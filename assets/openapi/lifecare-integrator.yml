    Decision:
      type: object
      description: "A decision from one of the Lifecare systems, re-modelled to a\
        \ common shape. Uniqueness is per (source, law, decisionId) — the decisionId\
        \ alone is only unique within its source system."
      properties:
        source:
          type: string
          description: The source system the decision originates from
          enum:
            - ELDERLY_CARE
            - FAMILY_CARE
          examples:
            - ELDERLY_CARE
        law:
          type:
            - string
            - "null"
          description: The law the decision is made under. Only present for ELDERLY_CARE
            decisions
          enum:
            - SOL
            - LSS
          examples:
            - SOL
        decisionId:
          type: string
          description: The decision id in the source system
          examples:
            - "12345"
        decided:
          type: string
          format: date
          description: The date the decision was made
          examples:
            - 2026-05-01
        validFrom:
          type: string
          format: date
          description: The date the decision is valid from
          examples:
            - 2026-05-01
        validTo:
          type: string
          format: date
          description: The date the decision is valid to
          examples:
            - 2026-10-31
        type:
          type: string
          description: The decision type
          examples:
            - Ekonomiskt bistånd
        reason:
          type: string
          description: The decision reason
          examples:
            - Bifall
        decisionMaker:
          type: string
          description: Name of the caseworker that made the decision
          examples:
            - Anna Andersson
        amount:
          type: number
          description: "The decided amount, when the decision concerns an amount"
          examples:
            - 5000.0
        elderlyCareDetails:
          type: "null"
          $ref: "#/components/schemas/ElderlyCareDecisionDetails"
          description: Details only present for ELDERLY_CARE decisions
        familyCareDetails:
          type: "null"
          $ref: "#/components/schemas/FamilyCareDecisionDetails"
          description: Details only present for FAMILY_CARE decisions
