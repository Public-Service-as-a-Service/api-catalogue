              schema:
                $ref: "#/components/schemas/Problem"
    post:
      tags:
        - Actualisations
      description: Create an actualisation (case intake) in Lifecare family care.
        Ids in the request come from the proposal endpoint
      operationId: createActualisation
      parameters:
        - name: municipalityId
          in: path
          description: Municipality id
          required: true
          schema:
            type: string
          example: 2281
      requestBody:
