components:
  schemas:
    Problem:
      type: object
      properties:
        title:
          type: string
        detail:
          type: string
        instance:
          type: string
          format: uri
        type:
          type: string
          format: uri
        status:
          type: integer
          format: int32
    CalculationExpenseRequest:
      type: object
      description: An expense or special expense included in a calculation
      properties:
        typeId:
          type: integer
          format: int32
          description: "The id of the expense type, from the calculation proposal's\
            \ expenseTypes or specialExpenseTypes"
          examples:
            - 1
        amount:
          type: number
          description: The amount of the expense
          examples:
            - 5000.0
        approvedAmount:
          type: number
          description: The approved amount of the expense
          examples:
            - 4500.0
        note:
          type: string
          description: A note on the expense
          examples:
            - Hyra april
      required:
        - typeId
    CalculationIncomeRequest:
      type: object
      description: An income included in a calculation
      properties:
        typeId:
          type: integer
          format: int32
          description: "The id of the income type, from the calculation proposal's\
            \ incomeTypes"
          examples:
            - 1
        applicantAmount:
          type: number
          description: The applicant's amount
          examples:
            - 5000.0
        applicantAmountDate:
          type: string
          format: date
          description: The date of the applicant's amount
          examples:
            - 2026-05-01
        coApplicantAmount:
          type: number
          description: The co-applicant's amount
          examples:
            - 5000.0
        coApplicantAmountDate:
          type: string
          format: date
          description: The date of the co-applicant's amount
          examples:
            - 2026-05-01
        note:
          type: string
          description: A note on the income
          examples:
            - Lön april
      required:
        - typeId
    CalculationPersonRequest:
      type: object
      description: A person included in a calculation
      properties:
        partyId:
          type: string
          description: The party id of the person
          examples:
            - 81471222-5798-11e9-ae24-57fa13b361e1
        numberOfDays:
          type: integer
          format: int32
          description: The number of days the person is included in the calculation
          examples:
            - 30
        deviationFromDate:
          type: string
          format: date
          description: The date the deviation is valid from
          examples:
            - 2026-05-01
        deviationToDate:
          type: string
          format: date
          description: The date the deviation is valid to
          examples:
            - 2026-05-31
      required:
        - partyId
    CreateCalculationRequest:
      type: object
      description: Request to create a calculation in Lifecare FC. All ids come from
        the calculation proposal endpoint.
      properties:
        partyId:
          type: string
          description: The party id of the person the calculation concerns
          examples:
            - 81471222-5798-11e9-ae24-57fa13b361e1
        serviceId:
          type: integer
          format: int32
          description: "The id of the service to link to, from the calculation proposal\
            \ endpoint"
          examples:
            - 12345
        investigationId:
          type: integer
          format: int32
          description: "The id of the investigation to link to, from the calculation\
            \ proposal endpoint"
          examples:
            - 12345
        normId:
          type: integer
          format: int32
          description: "The id of the norm to base the calculation on, from the calculation\
            \ proposal endpoint"
          examples:
            - 1
        actualisationId:
          type: integer
          format: int32
          description: "The id of the actualisation to link to, from the calculation\
            \ proposal endpoint"
          examples:
            - 12345
        calculationDate:
          type: string
          format: date
          description: The date of the calculation
          examples:
            - 2026-05-01
        calculationFromDate:
          type: string
          format: date
          description: The date the calculation is valid from
          examples:
            - 2026-05-01
        calculationToDate:
          type: string
          format: date
          description: The date the calculation is valid to
          examples:
            - 2026-05-31
        hasCustomHouseholdSize:
          type: boolean
          description: Whether a custom household size is used
          examples:
            - "false"
        householdSize:
          type: integer
          format: int32
          description: The size of the household
          examples:
            - 4
        persons:
          type: array
          items:
            $ref: "#/components/schemas/CalculationPersonRequest"
            description: The persons included in the calculation
        incomes:
          type: array
          items:
            $ref: "#/components/schemas/CalculationIncomeRequest"
            description: The incomes included in the calculation
        expenses:
          type: array
          items:
            $ref: "#/components/schemas/CalculationExpenseRequest"
            description: The expenses included in the calculation
        specialExpenses:
          type: array
          items:
            $ref: "#/components/schemas/CalculationExpenseRequest"
            description: The special expenses included in the calculation
      required:
        - calculationDate
        - calculationFromDate
        - calculationToDate
        - normId
        - partyId
    ConstraintViolationProblem:
      type: object
      properties:
        type:
          type: string
          format: uri
        status:
          type: integer
          format: int32
        violations:
          type: array
          items:
            $ref: "#/components/schemas/Violation"
        title:
          type: string
        detail:
          type: string
        causeAsProblem:
          $ref: "#/components/schemas/ThrowableProblem"
        instance:
          type: string
          format: uri
    ThrowableProblem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
        causeAsProblem: { }
    Violation:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
    CreatedResource:
      type: object
      description: The id of the created resource in Lifecare FC
      properties:
        id:
          type: integer
          format: int32
          description: The id of the created resource in Lifecare FC
          examples:
            - 12345
    CreateActualisationRequest:
      type: object
      description: Request to create an actualisation in Lifecare FC. All ids come
        from the actualisation proposal endpoint.
      properties:
        partyId:
          type: string
          description: The party id of the person the actualisation concerns
          examples:
            - 81471222-5798-11e9-ae24-57fa13b361e1
        date:
          type: string
          format: date
          description: The date of the actualisation
          examples:
            - 2026-05-01
        typeId:
          type: integer
          format: int32
          description: "The id of the actualisation type, from the actualisation proposal\
            \ endpoint"
          examples:
            - 1
        fromWhoId:
          type: integer
          format: int32
          description: "The id of the from-who value, from the actualisation proposal\
            \ endpoint"
          examples:
            - 1
        reasonId:
          type: integer
          format: int32
          description: "The id of the reason, from the actualisation proposal endpoint"
          examples:
            - 1
        organisationId:
          type: integer
          format: int32
          description: "The id of the organization, from the actualisation proposal\
            \ endpoint"
          examples:
            - 1
        organisationUnitId:
          type: string
          description: "The id of the organization unit, from the actualisation proposal\
            \ endpoint"
          examples:
            - "100"
        caseworkerId:
          type: string
          description: "The id of the caseworker, from the actualisation proposal\
            \ endpoint"
          examples:
            - abc123
        specifiesId:
          type: integer
          format: int32
          description: "The id of the specify type, from the actualisation proposal\
            \ endpoint"
          examples:
            - 1
        serviceId:
          type: integer
          format: int32
          description: "The id of the service to link to, from the actualisation proposal\
            \ endpoint"
          examples:
            - 12345
        investigationId:
          type: integer
          format: int32
          description: "The id of the investigation to link to, from the actualisation\
            \ proposal endpoint"
          examples:
            - 12345
        workingStatusId:
          type: integer
          format: int32
          description: "The id of the working status, from the actualisation proposal\
            \ endpoint"
          examples:
            - 1
      required:
        - date
        - partyId
        - typeId
    Caseworker:
      type: object
      description: A caseworker user account in the Lifecare family care system
      properties:
        id:
          type: string
          description: The user id in the source system
          examples:
            - "12345"
        hsaId:
          type: string
          description: The HSA id of the user
          examples:
            - SE2321000032-1234
        networkUserId:
          type: string
          description: The network user id of the user
          examples:
            - annand01
        firstName:
          type: string
          description: The first name of the user
          examples:
            - Anna
        lastName:
          type: string
          description: The last name of the user
          examples:
            - Andersson
        fullName:
          type: string
          description: The full name of the user
          examples:
            - Anna Andersson
        description:
          type: string
          description: A description of the user
          examples:
            - Handläggare ekonomiskt bistånd
        validFrom:
          type: string
          format: date-time
          description: The date and time the user account is valid from
          examples:
            - 2026-01-01T00:00:00Z
        validTo:
          type: string
          format: date-time
          description: The date and time the user account is valid to
          examples:
            - 2026-12-31T23:59:59Z
        disabled:
          type: boolean
          description: Whether the user account is disabled
          examples:
            - "false"
    CaseService:
      type: object
      description: A service (insats) from the Lifecare family care system
      properties:
        id:
          type: integer
          format: int32
          description: The service id in the source system
          examples:
            - 12345
        type:
          type: string
          description: The service type
          examples:
            - Ekonomiskt bistånd
        organization:
          type: string
          description: The organization handling the service
          examples:
            - IFO Vuxen
        startDate:
          type: string
          format: date
          description: The date the service starts
          examples:
            - 2026-05-01
        endDate:
          type: string
          format: date
          description: The date the service ends
          examples:
            - 2026-10-31
        caseworker:
          type: string
          description: The name of the caseworker
          examples:
            - Anna Andersson
        coCaseworker:
          type: string
          description: The name of the co-caseworker
          examples:
            - Bengt Bengtsson
        investigationId:
          type: integer
          format: int32
          description: The id of the investigation the service belongs to
          examples:
            - 23456
        decisionId:
          type: integer
          format: int32
          description: The id of the decision the service belongs to
          examples:
            - 34567
        applicant:
          type: string
          description: The name of the applicant
          examples:
            - Cecilia Cedersson
        coApplicant:
          type: string
          description: The name of the co-applicant
          examples:
            - David Davidsson
        persons:
          type: array
          items:
            $ref: "#/components/schemas/RelatedPerson"
            description: The persons the service concerns
    PagedServiceResponse:
      type: object
      description: A paged list of services from the Lifecare family care system
      properties:
        services:
          type: array
          items:
            $ref: "#/components/schemas/CaseService"
            description: The services on this page
        _meta:
          $ref: "#/components/schemas/PagingMetaData"
          readOnly: true
    PagingMetaData:
      type: object
      description: PagingMetaData model
      properties:
        page:
          type: integer
          format: int32
          description: Current page
          examples:
            - 5
          readOnly: true
        limit:
          type: integer
          format: int32
          description: Displayed objects per page
          examples:
            - 20
          readOnly: true
        count:
          type: integer
          format: int32
          description: Displayed objects on current page
          examples:
            - 13
          readOnly: true
        totalRecords:
          type: integer
          format: int64
          description: Total amount of hits based on provided search parameters
          examples:
            - 98
          readOnly: true
        totalPages:
          type: integer
          format: int32
          description: Total amount of pages based on provided search parameters
          examples:
            - 23
          readOnly: true
    RelatedPerson:
      type: object
      description: A person related to a family care case
      properties:
        name:
          type: string
          description: The name of the person
          examples:
            - Anna Andersson
        coApplicant:
          type: boolean
          description: Whether the person is a co-applicant. Null when the source
            does not state a role
          examples:
            - "false"
    PagedResourceAllocationResponse:
      type: object
      description: A paged list of resource allocations from the Lifecare family care
        system
      properties:
        resourceAllocations:
          type: array
          items:
            $ref: "#/components/schemas/ResourceAllocation"
            description: The resource allocations on this page
        _meta:
          $ref: "#/components/schemas/PagingMetaData"
          readOnly: true
    ResourceAllocation:
      type: object
      description: A resource allocation from the Lifecare family care system
      properties:
        id:
          type: integer
          format: int32
          description: The resource allocation id in the source system
          examples:
            - 12345
        startDate:
          type: string
          format: date
          description: The date the resource allocation starts
          examples:
            - 2026-05-01
        endDate:
          type: string
          format: date
          description: The date the resource allocation ends
          examples:
            - 2026-10-31
        percent:
          type: integer
          format: int32
          description: The allocation percentage
          examples:
            - 100
        resource:
          type: string
          description: The allocated resource
          examples:
            - Anna Andersson
        resourceType:
          type: string
          description: The type of the allocated resource
          examples:
            - Handläggare
        serviceId:
          type: integer
          format: int32
          description: The id of the service the resource allocation belongs to
          examples:
            - 23456
    Person:
      type: object
      description: Person master data from Lifecare family care
      properties:
        customerNumber:
          type: integer
          format: int32
          description: The customer number in the source system
          examples:
            - 12345
        name:
          type: string
          description: Full name of the person
          examples:
            - Anna Andersson
        streetAddress:
          type: string
          description: Street address
          examples:
            - Storgatan 1
        careOfAddress:
          type: string
          description: Care of (c/o) address
          examples:
            - c/o Karlsson
        postalCode:
          type: string
          description: Postal code
          examples:
            - "85185"
        postalAddress:
          type: string
          description: Postal address
          examples:
            - Sundsvall
        phoneHome:
          type: string
          description: Home phone number
          examples:
            - 060-123456
        phoneWork:
          type: string
          description: Work phone number
          examples:
            - 060-654321
        phoneMobile:
          type: string
          description: Mobile phone number
          examples:
            - 070-1234567
        email:
          type: string
          description: Email address
          examples:
            - anna.andersson@example.com
        addressProtection:
          type: boolean
          description: Whether the person's address is protected
          examples:
            - "false"
        secretPhone:
          type: boolean
          description: Whether the person's phone number is secret
          examples:
            - "false"
        protectedRegistration:
          type: boolean
          description: Whether the person has protected registration
          examples:
            - "false"
    PagedPaymentResponse:
      type: object
      description: A paged list of payments from the Lifecare family care system
      properties:
        payments:
          type: array
          items:
            $ref: "#/components/schemas/Payment"
            description: The payments on this page
        _meta:
          $ref: "#/components/schemas/PagingMetaData"
          readOnly: true
    Payment:
