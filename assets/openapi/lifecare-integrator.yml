          in: query
          description: Party id of the person
          required: true
          schema:
            type: string
            description: Party id of the person
            examples:
              - 81471222-5798-11e9-ae24-57fa13b361e1
        - name: from
          in: query
          description: Start of the period (inclusive)
          required: false
          schema:
            type: string
            format: date
            description: Start of the period (inclusive)
            examples:
              - 2025-01-01
        - name: to
          in: query
          description: End of the period (inclusive)
          required: false
          schema:
            type: string
            format: date
            description: End of the period (inclusive)
            examples:
              - 2026-12-31
        - name: ascending
          in: query
          description: Sort order by date
          required: false
          schema:
            type: boolean
            description: Sort order by date
            examples:
              - "true"
        - name: page
          in: query
          description: Page number
          required: false
          schema:
            type: integer
            format: int32
            default: 1
            description: Page number
            examples:
              - 1
            minimum: 1
        - name: limit
          in: query
          description: Result size per page. Maximum allowed value is dynamically configured
          required: false
          schema:
            type: integer
            format: int32
            description: Result size per page. Maximum allowed value is dynamically
              configured
            examples:
              - 15
            minimum: 1
