openapi: 3.1.0
info:
  title: api-lifecare-integrator
  contact: { }
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT
  version: "1.0"
servers:
  - url: http://localhost:60713
    description: Generated server url
tags:
  - name: Investigations
    description: Investigation reads from the Lifecare family care system
  - name: Executions
    description: Execution reads from the Lifecare family care system
  - name: Actualisations
    description: Actualisation (case intake) resource for the Lifecare family care system
  - name: Resource allocations
    description: Resource allocation reads from the Lifecare family care system
  - name: Person
    description: Person master data and contacts from Lifecare family care
  - name: Decisions
    description: "Unified decision resource, merging the Lifecare elderly care (SoL\
    \ + LSS) and family care decision sources"
  - name: Payments
    description: Payment reads from the Lifecare family care system
  - name: Calculations
    description: Calculation (normberäkning) resource for the Lifecare family care system
  - name: Documents
    description: Documents stored for a person in the Lifecare family care system
  - name: Services
    description: Service reads from the Lifecare family care system
  - name: Users
    description: Caseworker (user) lookup in the Lifecare family care system
paths:
  /{municipalityId}/calculations:
    get:
      tags:
        - Calculations
      description: Get the calculations registered on a person in the given period
      operationId: getCalculations
      parameters:
        - name: municipalityId
          in: path
          description: Municipality id
          required: true
          schema:
            type: string
          example: 2281
        - name: partyId
          in: query
          description: Party id of the person
          required: true
          schema:
            type: string
            description: Party id of the person
            examples:
              - 81471222-5798-11e9-ae24-57fa13b361e1
        - name: from
          in: query
          description: Start of the period (inclusive)
          required: false
          schema:
            type: string
            format: date
            description: Start of the period (inclusive)
            examples:
              - 2025-01-01
        - name: to
          in: query
          description: End of the period (inclusive)
          required: false
          schema:
            type: string
            format: date
            description: End of the period (inclusive)
            examples:
              - 2026-12-31
        - name: ascending
          in: query
          description: Sort order by date
          required: false
          schema:
            type: boolean
            description: Sort order by date
            examples:
              - "true"
        - name: page
          in: query
          description: Page number
          required: false
          schema:
            type: integer
            format: int32
            default: 1
            description: Page number
            examples:
              - 1
            minimum: 1
        - name: limit
          in: query
          description: Result size per page. Maximum allowed value is dynamically configured
          required: false
          schema:
            type: integer
            format: int32
            description: Result size per page. Maximum allowed value is dynamically
              configured
            examples:
              - 15
            minimum: 1
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedCalculationResponse"
        "404":
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Problem"
                  - $ref: "#/components/schemas/ConstraintViolationProblem"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      tags:
        - Calculations
      description: Create a calculation in Lifecare family care. Ids in the request
        come from the proposal endpoint
      operationId: createCalculation
      parameters:
        - name: municipalityId
          in: path
          description: Municipality id
          required: true
          schema:
            type: string
          example: 2281
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCalculationRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedResource"
        "404":
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Problem"
                  - $ref: "#/components/schemas/ConstraintViolationProblem"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
