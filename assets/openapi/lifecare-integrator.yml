              schema:
                $ref: "#/components/schemas/CreatedResource"
        "404":
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Problem"
                  - $ref: "#/components/schemas/ConstraintViolationProblem"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /{municipalityId}/actualisations/{actualisationId}/attachments:
    post:
      tags:
        - Actualisations
      description: Upload a document and bind it to an actualisation. Type codes come
        from the proposal endpoint's attachmentTypes
      operationId: addActualisationAttachment
      parameters:
        - name: municipalityId
          in: path
          description: Municipality id
          required: true
          schema:
            type: string
          example: 2281
        - name: actualisationId
          in: path
          description: Id of the actualisation
          required: true
          schema:
            type: integer
            format: int32
          example: 12345
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                documentType:
                  type: string
                  description: The document type code
                  minLength: 1
                senderType:
                  type: string
                  description: The document sender type code
                  minLength: 1
                title:
                  type: string
                  description: The document title
                senderName:
                  type: string
                  description: The sender name
                file:
                  type: string
                  format: binary
              required:
                - documentType
                - file
                - senderType
        required: true
      responses:
        "204":
          description: No content
        "404":
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
