  /{municipalityId}/users:
    get:
      tags:
        - Users
      description: Get the family care caseworkers (users)
      operationId: getUsers
      parameters:
        - name: municipalityId
          in: path
          description: Municipality id
          required: true
          schema:
            type: string
          example: 2281
        - name: limit
          in: query
          description: The maximum number of users to return
          required: true
          schema:
            type: integer
            format: int32
            exclusiveMinimum: 0
            maximum: 1000
          example: 100
        - name: offset
          in: query
          description: The starting point within the result set
          required: false
          schema:
            type: integer
            format: int32
          example: 0
        - name: modifiedAfter
          in: query
          description: Only users modified after this time
          required: false
          schema:
            type: string
            format: date-time
        - name: modifiedBefore
          in: query
          description: Only users modified before this time
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
