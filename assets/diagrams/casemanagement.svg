oke-width="1.6" marker-end="url(#arr)"/><rect x="597.5" y="464" rx="10" width="205" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="700.0" y="492.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">OepIntegrator 1.5</text><text x="700.0" y="511.0" text-anchor="middle" font-size="11.5" fill="#46595f">Skickar statusuppdateringar och…<title>Skickar statusuppdateringar och meddelanden tillbaka till e-tjänsteplattformen (Open ePlatform).</title></text><path d="M 700.0 372 C 700.0 418.0, 700.0 418.0, 700.0 464" fill="none" stroke="#7d99a1" stroke-width="1.6" marker-end="url(#arr)"/><rect x="816.5" y="464" rx="10" width="205" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="919.0" y="492.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">Party 2.1</text><text x="919.0" y="511.0" text-anchor="middle" font-size="11.5" fill="#46595f">Översätter partyId till person- elle…<title>Översätter partyId till person- eller organisationsnummer.</title></text><path d="M 700.0 372 C 700.0 418.0, 919.0 418.0, 919.0 464" fill="none" stroke="#7d99a1" stroke-width="1.6" marker-end="url(#arr)"/><rect x="1035.5" y="464" rx="10" width="205" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="1138.0" y="492.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">Messaging 7.10</text><text x="1138.0" y="511.0" text-anchor="middle" font-size="11.5" fill="#46595f">Notifierar förvaltningen när ett är…<title>Notifierar förvaltningen när ett ärende inte kunnat levereras till målsystemet.</title></text><path d="M 700.0 372 C 700.0 418.0, 1138.0 418.0, 1138.0 464" fill="none" stroke="#7d99a1" stroke-width="1.6" marker-end="url(#arr)"/><rect x="597.5" y="544" rx="10" width="205" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="700.0" y="572.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">Eventlog 2.1</text><text x="700.0" y="591.0" text-anchor="middle" font-size="11.5" fill="#46595f">Skriver ärendehändelser till kom…<title>Skriver ärendehändelser till kommunens centrala händelselogg.</title></text><path d="M 700.0 372 C 700.0 458.0, 700.0 458.0, 700.0 544" fill="none" stroke="#7d99a1" stroke-width="1.6" marker-end="url(#arr)"/><rect x="40" y="662" rx="12" width="1320" height="124" fill="#f4f5f7" stroke="#64748b" stroke-width="1.5" opacity="0.55"/><text x="56" y="686" font-size="13" font-weight="bold" letter-spacing="1" fill="#1c2b33">EXTERNA SYSTEM OCH INTEGRATIONER</text><rect x="159.5" y="702" rx="10" width="205" height="64" fill="#eef1f4" stroke="#64748b" stroke-width="2" stroke-dasharray="7,5"/><text x="262.0" y="730.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">ByggR (bygglovssystem…<title>ByggR (bygglovssystem, SOAP via ArendeExport)</title></text><text x="262.0" y="749.0" text-anchor="middle" font-size="11.5" fill="#46595f">integration</text><path d="M 700.0 372 C 700.0 537.0, 262.0 537.0, 262.0 702" fill="none" stroke="#7d99a1" stroke-width="1.6" stroke-dasharray="6,5" marker-end="url(#arr)"/><rect x="378.5" y="702" rx="10" width="205" height="64" fill="#eef1f4" stroke="#64748b" stroke-width="2" stroke-dasharray="7,5"/><text x="481.0" y="730.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">Ecos/MinutMiljö (miljö- o…<title>Ecos/MinutMiljö (miljö- och hälsoskyddssystem, SOAP)</title></text><text x="481.0" y="749.0" text-anchor="middle" font-size="11.5" fill="#46595f">integration</text><path d="M 700.0 372 C 700.0 537.0, 481.0 537.0, 481.0 702" fill="none" stroke="#7d99a1" stroke-width="1.6" stroke-dasharray="6,5" marker-end="url(#arr)"/><rect x="597.5" y="702" rx="10" width="205" height="64" fill="#eef1f4" stroke="#64748b" stroke-width="2" stroke-dasharray="7,5"/><text x="700.0" y="730.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">EDP Future (verksamhet…<title>EDP Future (verksamhetssystem, SOAP)</title></text><text x="700.0" y="749.0" text-anchor="middle" font-size="11.5" fill="#46595f">integration</text><path d="M 700.0 372 C 700.0 537.0, 700.0 537.0, 700.0 702" fill="none" stroke="#7d99a1" stroke-width="1.6" stroke-dasharray="6,5" marker-end="url(#arr)"/><rect x="816.5" y="702" rx="10" width="205" height="64" fill="#eef1f4" stroke="#64748b" stroke-width="2" stroke-dasharray="7,5"/><text x="919.0" y="730.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">FB (fastighetsdatasyste…<title>FB (fastighetsdatasystem, Sokigo)</title></text><text x="919.0" y="749.0" text-anchor="middle" font-size="11.5" fill="#46595f">integration</text><path d="M 700.0 372 C 700.0 537.0, 919.0 537.0, 919.0 702" fill="none" stroke="#7d99a1" stroke-width="1.6" stroke-dasharray="6,5" marker-end="url(#arr)"/><rect x="1035.5" y="702" rx="10" width="205" height="64" fill="#eef1f4" stroke="#64748b" stroke-width="2" stroke-dasharray="7,5"/><text x="1138.0" y="730.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">Lantmäteriet (registerbet…<title>Lantmäteriet (registerbeteckningar för fastigheter)</title></text><text x="1138.0" y="749.0" text-anchor="middle" font-size="11.5" fill="#46595f">integration</text><path d="M 700.0 372 C 700.0 537.0, 1138.0 537.0, 1138.0 702" fill="none" stroke="#7d99a1" stroke-width="1.6" stroke-dasharray="6,5" marker-end="url(#arr)"/><text x="40" y="814" font-size="12" fill="#46595f">• Inkommande ärenden sparas först lokalt och skickas sedan vidare asynkront via Springs applikationshändelser; varje målsystem har en egen processor med Failsafe-återförsökspolicy, och när maxantalet leveransförsök överskrids notifieras</text><text x="50.007999999999996" y="832" font-size="12" fill="#46595f">förvaltningen via Messaging (ByggrProcessor med flera).</text><text x="40" y="852" font-size="12" fill="#46595f">• Open ePlatform kan bara skicka POST-anrop, så uppdateringar signaleras med extraparametern oepAction=PUT – en dokumenterad specialhantering i CaseService.handleCase.</text><text x="40" y="872" font-size="12" fill="#46595f">• Fastighetsbeteckningar slås upp i två steg: Lantmäteriets registerbeteckningsreferens hämtas först och används sedan för att hämta fastighetsuppgifter ur FB (FbService).</text><rect x="40" y="900" width="26" height="16" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="73" y="913" font-size="12.5" fill="#1c2b33">Detta API</text><rect x="160.5" y="900" width="26" height="16" rx="4" fill="#e8f5ee" stroke="#15803d" stroke-width="1.5"/><text x="193.5" y="913" font-size="12.5" fill="#1c2b33">Beroende mikrotjänst</text><rect x="345.6" y="900" width="26" height="16" rx="4" fill="#fdf3d7" stroke="#b45309" stroke-width="1.5"/><text x="378.6" y="913" font-size="12.5" fill="#1c2b33">Databas</text><rect x="459.15000000000003" y="900" width="26" height="16" rx="4" fill="#eef1f4" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,4"/><text x="492.15000000000003" y="913" font-size="12.5" fill="#1c2b33">Extern/gemensam tjänst</text></svg>