<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 532" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" role="img" aria-label="Arkitekturdiagram för SimulatorServer 2.1"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#7d99a1"/></marker></defs><rect width="1400" height="532" fill="#ffffff"/><text x="700.0" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#00434f">Lösningsarkitektur — SimulatorServer 2.1</text><text x="700.0" y="60" text-anchor="middle" font-size="13" fill="#46595f">Pilar visar anrop. Konsumenter når API:et via kommunens API-plattform (WSO2); tjänsten anropar i sin tur andra mikrotjänster.</text><rect x="490.0" y="84" rx="10" width="420" height="64" fill="#eef1f4" stroke="#64748b" stroke-width="2" stroke-dasharray="7,5"/><text x="700.0" y="112.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1c2b33">Konsumerande applikationer</text><text x="700.0" y="131.0" text-anchor="middle" font-size="11.5" fill="#46595f">webbappar, e-tjänster och verksamhetssystem</text><path d="M 700.0 148 L 700.0 194" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/><text x="712.0" y="176" font-size="11" fill="#46595f">OAuth2 (CLIENT_KEY/CLIENT_SECRET)</text><rect x="380.0" y="194" rx="10" width="640" height="58" fill="#eef1f4" stroke="#005a70" stroke-width="2"/><text x="700.0" y="219.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1c2b33">API-plattform (WSO2)</text><text x="700.0" y="238.0" text-anchor="middle" font-size="11.5" fill="#46595f">api.sundsvall.se — gemensam ingång till alla verksamhets-API:er</text><path d="M 700.0 252 L 700.0 298" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arr)"/><rect x="480.0" y="298" rx="10" width="440" height="74" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="700.0" y="331.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1c2b33">SimulatorServer 2.1</text><text x="700.0" y="350.0" text-anchor="middle" font-size="11.5" fill="#46595f">api-service-simulator-server</text><text x="40" y="424" font-size="12" fill="#46595f">• Tjänsten är ett renodlat utvecklings- och testverktyg utan verksamhetslogik – API-vägarna saknar municipalityId, till skillnad från kommunens övriga API:er.</text><text x="40" y="444" font-size="12" fill="#46595f">• Statuskoden kan anges antingen som siffra eller som text – en egen konverterare läser de tre första tecknen och slår upp motsvarande HttpStatus – verifierat i StatusToEnumConverter.</text><text x="40" y="464" font-size="12" fill="#46595f">• Parametern sortSize genererar och sorterar sortSize × 10 000 slumpade UUID:n (max 100, dvs. en miljon) för att simulera CPU-tung bearbetning – verifierat i kontrollern.</text><rect x="40" y="492" width="26" height="16" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="73" y="505" font-size="12.5" fill="#1c2b33">Detta API</text><rect x="160.5" y="492" width="26" height="16" rx="4" fill="#e8f5ee" stroke="#15803d" stroke-width="1.5"/><text x="193.5" y="505" font-size="12.5" fill="#1c2b33">Beroende mikrotjänst</text><rect x="345.6" y="492" width="26" height="16" rx="4" fill="#fdf3d7" stroke="#b45309" stroke-width="1.5"/><text x="378.6" y="505" font-size="12.5" fill="#1c2b33">Databas</text><rect x="459.15000000000003" y="492" width="26" height="16" rx="4" fill="#eef1f4" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,4"/><text x="492.15000000000003" y="505" font-size="12.5" fill="#1c2b33">Extern/gemensam tjänst</text></svg>