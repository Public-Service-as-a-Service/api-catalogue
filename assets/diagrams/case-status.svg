<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 770" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" role="img" aria-label="Arkitekturdiagram för CaseStatus 4.3"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#7d99a1"/></marker></defs><rect width="1400" height="770" fill="#ffffff"/><text x="700.0" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#00434f">Lösningsarkitektur — CaseStatus 4.3</text><text x="700.0" y="60" text-anchor="middle" font-size="13" fill="#46595f">Pilar visar anrop. Konsumenter når API:et via kommunens API-plattform (WSO2); tjänsten anropar i sin tur andra mikrotjänster.</text><rect x="490.0" y="84" rx="10" width="420" height="64" fill="#eef1f4" stroke="#64748b" stroke-width="2" stroke-dasharray="7,5"/><text x="700.0" y="112.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1c2b33">Konsumerande applikationer</text><text x="700.0" y="131.0" text-anchor="middle" font-size="11.5" fill="#46595f">webbappar, e-tjänster och verksamhetssystem</text><path d="M 700.0 148 L 700.0 194" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/><text x="712.0" y="176" font-size="11" fill="#46595f">OAuth2 (CLIENT_KEY/CLIENT_SECRET)</text><rect x="380.0" y="194" rx="10" width="640" height="58" fill="#eef1f4" stroke="#005a70" stroke-width="2"/><text x="700.0" y="219.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1c2b33">API-plattform (WSO2)</text><text x="700.0" y="238.0" text-anchor="middle" font-size="11.5" fill="#46595f">api.sundsvall.se — gemensam ingång till alla verksamhets-API:er</text><path d="M 700.0 252 L 700.0 298" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arr)"/><rect x="480.0" y="298" rx="10" width="440" height="74" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="700.0" y="331.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1c2b33">CaseStatus 4.3</text><text x="700.0" y="350.0" text-anchor="middle" font-size="11.5" fill="#46595f">api-service-case-status</text><rect x="1110" y="305" rx="10" width="260" height="60" fill="#fdf3d7" stroke="#b45309" stroke-width="2"/><text x="1240.0" y="331.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1c2b33">Databas</text><text x="1240.0" y="350.0" text-anchor="middle" font-size="11.5" fill="#46595f">MariaDB</text><path d="M 920.0 335.0 L 1110 335.0" fill="none" stroke="#b45309" stroke-width="1.6" marker-end="url(#arr)"/><text x="1015.0" y="325.0" text-anchor="middle" font-size="11" fill="#b45309">lagring</text><rect x="40" y="424" rx="12" width="1320" height="204" fill="#f4faf6" stroke="#15803d" stroke-width="1.5" opacity="0.55"/><text x="56" y="448" font-size="13" font-weight="bold" letter-spacing="1" fill="#1c2b33">BEROENDE MIKROTJÄNSTER — anropas av tjänsten</text><rect x="159.5" y="464" rx="10" width="205" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="262.0" y="492.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">CaseManagement 8.3</text><text x="262.0" y="511.0" text-anchor="middle" font-size="11.5" fill="#46595f">Hämtar ärendestatus från de ver…<title>Hämtar ärendestatus från de verksamhetssystem CaseManagement integrerar (ByggR, Ecos med flera).</title></text><path d="M 700.0 372 C 700.0 418.0, 262.0 418.0, 262.0 464" fill="none" stroke="#7d99a1" stroke-width="1.6" marker-end="url(#arr)"/><rect x="378.5" y="464" rx="10" width="205" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="481.0" y="492.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">SupportManagement 12.0</text><text x="481.0" y="511.0" text-anchor="middle" font-size="11.5" fill="#46595f">Hämtar status för supportärenden.</text><path d="M 700.0 372 C 700.0 418.0, 481.0 418.0, 481.0 464" fill="none" stroke="#7d99a1" stroke-width="1.6" marker-end="url(#arr)"/><rect x="597.5" y="464" rx="10" width="205" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="700.0" y="492.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">CaseData 13.0</text><text x="700.0" y="511.0" text-anchor="middle" font-size="11.5" fill="#46595f">Statusuppdateringar för CaseDat…<title>Statusuppdateringar för CaseData-ärenden hämtas via händelseflödet och skrivs tillbaka till e-tjänsten.</title></text><path d="M 700.0 372 C 700.0 418.0, 700.0 418.0, 700.0 464" fill="none" stroke="#7d99a1" stroke-width="1.6" marker-end="url(#arr)"/><rect x="816.5" y="464" rx="10" width="205" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="919.0" y="492.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">OepIntegrator 1.6</text><text x="919.0" y="511.0" text-anchor="middle" font-size="11.5" fill="#46595f">Läser ärenden och statusar från…<title>Läser ärenden och statusar från Open ePlatform samt skriver tillbaka statusuppdateringar och hämtar ärende-PDF.</title></text><path d="M 700.0 372 C 700.0 418.0, 919.0 418.0, 919.0 464" fill="none" stroke="#7d99a1" stroke-width="1.6" marker-end="url(#arr)"/><rect x="1035.5" y="464" rx="10" width="205" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="1138.0" y="492.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">Party 2.0</text><text x="1138.0" y="511.0" text-anchor="middle" font-size="11.5" fill="#46595f">Översätter partyId till person- elle…<title>Översätter partyId till person- eller organisationsnummer.</title></text><path d="M 700.0 372 C 700.0 418.0, 1138.0 418.0, 1138.0 464" fill="none" stroke="#7d99a1" stroke-width="1.6" marker-end="url(#arr)"/><rect x="488.0" y="544" rx="10" width="205" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="590.5" y="572.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">Eventlog 2.1</text><text x="590.5" y="591.0" text-anchor="middle" font-size="11.5" fill="#46595f">Poller händelser för CaseManag…<title>Poller händelser för CaseManagement- och CaseData-ärenden som utlöser statusuppdateringar.</title></text><path d="M 700.0 372 C 700.0 458.0, 590.5 458.0, 590.5 544" fill="none" stroke="#7d99a1" stroke-width="1.6" marker-end="url(#arr)"/><rect x="707.0" y="544" rx="10" width="205" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="809.5" y="572.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">Messaging 7.9</text><text x="809.5" y="591.0" text-anchor="middle" font-size="11.5" fill="#46595f">Skickar Slack-meddelanden till fö…<title>Skickar Slack-meddelanden till förvaltningen när en statusuppdatering misslyckas.</title></text><path d="M 700.0 372 C 700.0 458.0, 809.5 458.0, 809.5 544" fill="none" stroke="#7d99a1" stroke-width="1.6" marker-end="url(#arr)"/><text x="40" y="662" font-size="12" fill="#46595f">• Statusuppslag görs parallellt mot CaseManagement, Open ePlatform och SupportManagement med CompletableFuture på en MDC-medveten trådpool, och utkast (status "utkast") kan filtreras bort (CaseAggregator).</text><text x="40" y="682" font-size="12" fill="#46595f">• Cachejobbet sätter tjänstens hälsoindikator till unhealthy om inga ärenden alls kunde cachas för en e-tjänstefamilj – en medveten skyddsmekanism mot att cachen tyst blir inaktuell (CaseStatusCacheWorker).</text><text x="40" y="702" font-size="12" fill="#46595f">• E-tjänstefamiljerna som cachas ligger som uppräkning i koden (FamilyId) med separata id:n för test och produktion.</text><rect x="40" y="730" width="26" height="16" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="73" y="743" font-size="12.5" fill="#1c2b33">Detta API</text><rect x="160.5" y="730" width="26" height="16" rx="4" fill="#e8f5ee" stroke="#15803d" stroke-width="1.5"/><text x="193.5" y="743" font-size="12.5" fill="#1c2b33">Beroende mikrotjänst</text><rect x="345.6" y="730" width="26" height="16" rx="4" fill="#fdf3d7" stroke="#b45309" stroke-width="1.5"/><text x="378.6" y="743" font-size="12.5" fill="#1c2b33">Databas</text><rect x="459.15000000000003" y="730" width="26" height="16" rx="4" fill="#eef1f4" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,4"/><text x="492.15000000000003" y="743" font-size="12.5" fill="#1c2b33">Extern/gemensam tjänst</text></svg>