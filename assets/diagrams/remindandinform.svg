<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 690" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" role="img" aria-label="Arkitekturdiagram för RemindAndInform 4.0"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#7d99a1"/></marker></defs><rect width="1400" height="690" fill="#ffffff"/><text x="700.0" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#00434f">Lösningsarkitektur — RemindAndInform 4.0</text><text x="700.0" y="60" text-anchor="middle" font-size="13" fill="#46595f">Pilar visar anrop. Konsumenter når API:et via kommunens API-plattform (WSO2); tjänsten anropar i sin tur andra mikrotjänster.</text><rect x="490.0" y="84" rx="10" width="420" height="64" fill="#eef1f4" stroke="#64748b" stroke-width="2" stroke-dasharray="7,5"/><text x="700.0" y="112.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1c2b33">Konsumerande applikationer</text><text x="700.0" y="131.0" text-anchor="middle" font-size="11.5" fill="#46595f">webbappar, e-tjänster och verksamhetssystem</text><path d="M 700.0 148 L 700.0 194" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/><text x="712.0" y="176" font-size="11" fill="#46595f">OAuth2 (CLIENT_KEY/CLIENT_SECRET)</text><rect x="380.0" y="194" rx="10" width="640" height="58" fill="#eef1f4" stroke="#005a70" stroke-width="2"/><text x="700.0" y="219.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1c2b33">API-plattform (WSO2)</text><text x="700.0" y="238.0" text-anchor="middle" font-size="11.5" fill="#46595f">api.sundsvall.se — gemensam ingång till alla verksamhets-API:er</text><path d="M 700.0 252 L 700.0 298" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arr)"/><rect x="480.0" y="298" rx="10" width="440" height="74" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="700.0" y="331.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1c2b33">RemindAndInform 4.0</text><text x="700.0" y="350.0" text-anchor="middle" font-size="11.5" fill="#46595f">api-service-remindandinform</text><rect x="1110" y="305" rx="10" width="260" height="60" fill="#fdf3d7" stroke="#b45309" stroke-width="2"/><text x="1240.0" y="331.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1c2b33">Databas</text><text x="1240.0" y="350.0" text-anchor="middle" font-size="11.5" fill="#46595f">MariaDB</text><path d="M 920.0 335.0 L 1110 335.0" fill="none" stroke="#b45309" stroke-width="1.6" marker-end="url(#arr)"/><text x="1015.0" y="325.0" text-anchor="middle" font-size="11" fill="#b45309">lagring</text><rect x="40" y="424" rx="12" width="1320" height="124" fill="#f4faf6" stroke="#15803d" stroke-width="1.5" opacity="0.55"/><text x="56" y="448" font-size="13" font-weight="bold" letter-spacing="1" fill="#1c2b33">BEROENDE MIKROTJÄNSTER — anropas av tjänsten</text><rect x="597.5" y="464" rx="10" width="205" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="700.0" y="492.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">Messaging 7.9</text><text x="700.0" y="511.0" text-anchor="middle" font-size="11.5" fill="#46595f">Skickar påminnelsemeddelanden…<title>Skickar påminnelsemeddelanden till mottagarna; kanal väljs utifrån mottagarens kontaktinställningar.</title></text><path d="M 700.0 372 C 700.0 418.0, 700.0 418.0, 700.0 464" fill="none" stroke="#7d99a1" stroke-width="1.6" marker-end="url(#arr)"/><text x="40" y="582" font-size="12" fill="#46595f">• Det schemalagda utskicket hämtar alla oskickade påminnelser med datum till och med idag – även försenade påminnelser skickas alltså vid nästa körning – verifierat i SendRemindersLogic.</text><text x="40" y="602" font-size="12" fill="#46595f">• Påminnelserna markeras som skickade först efter att Messaging-anropet lyckats, vilket gör att de skickas om vid fel.</text><text x="40" y="622" font-size="12" fill="#46595f">• Meddelandetexterna byggs från konfigurerbara mallar där ärende-id och åtgärd sätts in; HTML-versionen för e-post escapas och base64-kodas innan den skickas.</text><rect x="40" y="650" width="26" height="16" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="73" y="663" font-size="12.5" fill="#1c2b33">Detta API</text><rect x="160.5" y="650" width="26" height="16" rx="4" fill="#e8f5ee" stroke="#15803d" stroke-width="1.5"/><text x="193.5" y="663" font-size="12.5" fill="#1c2b33">Beroende mikrotjänst</text><rect x="345.6" y="650" width="26" height="16" rx="4" fill="#fdf3d7" stroke="#b45309" stroke-width="1.5"/><text x="378.6" y="663" font-size="12.5" fill="#1c2b33">Databas</text><rect x="459.15000000000003" y="650" width="26" height="16" rx="4" fill="#eef1f4" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,4"/><text x="492.15000000000003" y="663" font-size="12.5" fill="#1c2b33">Extern/gemensam tjänst</text></svg>