geExchange 1.1</text><text x="262.0" y="591.0" text-anchor="middle" font-size="11.5" fill="#46595f">Synkroniserar trådade konversati…<title>Synkroniserar trådade konversationer kopplade till ärenden.</title></text><path d="M 700.0 372 C 700.0 458.0, 262.0 458.0, 262.0 544" fill="none" stroke="#7d99a1" stroke-width="1.6" marker-end="url(#arr)"/><rect x="378.5" y="544" rx="10" width="205" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="481.0" y="572.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">Messaging 7.9</text><text x="481.0" y="591.0" text-anchor="middle" font-size="11.5" fill="#46595f">Skickar utgående meddelanden t…<title>Skickar utgående meddelanden till ärendets parter.</title></text><path d="M 700.0 372 C 700.0 458.0, 481.0 458.0, 481.0 544" fill="none" stroke="#7d99a1" stroke-width="1.6" marker-end="url(#arr)"/><rect x="597.5" y="544" rx="10" width="205" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="700.0" y="572.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">MessagingSettings 2.0</text><text x="700.0" y="591.0" text-anchor="middle" font-size="11.5" fill="#46595f">Hämtar avsändar- och meddelan…<title>Hämtar avsändar- och meddelandeinställningar för utskick.</title></text><path d="M 700.0 372 C 700.0 458.0, 700.0 458.0, 700.0 544" fill="none" stroke="#7d99a1" stroke-width="1.6" marker-end="url(#arr)"/><rect x="816.5" y="544" rx="10" width="205" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="919.0" y="572.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">Employee v2</text><text x="919.0" y="591.0" text-anchor="middle" font-size="11.5" fill="#46595f">Slår upp handläggaruppgifter (po…<title>Slår upp handläggaruppgifter (portalpersondata) för notifieringar.</title></text><path d="M 700.0 372 C 700.0 458.0, 919.0 458.0, 919.0 544" fill="none" stroke="#7d99a1" stroke-width="1.6" marker-end="url(#arr)"/><rect x="1035.5" y="544" rx="10" width="205" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="1138.0" y="572.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">Relation 1.1</text><text x="1138.0" y="591.0" text-anchor="middle" font-size="11.5" fill="#46595f">Hanterar relationer mellan ärend…<title>Hanterar relationer mellan ärenden vid konversationssynkronisering.</title></text><path d="M 700.0 372 C 700.0 458.0, 1138.0 458.0, 1138.0 544" fill="none" stroke="#7d99a1" stroke-width="1.6" marker-end="url(#arr)"/><rect x="488.0" y="624" rx="10" width="205" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="590.5" y="652.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">Eventlog 2.1</text><text x="590.5" y="671.0" text-anchor="middle" font-size="11.5" fill="#46595f">Skriver ärendehändelser till kom…<title>Skriver ärendehändelser till kommunens centrala händelselogg.</title></text><path d="M 700.0 372 C 700.0 498.0, 590.5 498.0, 590.5 624" fill="none" stroke="#7d99a1" stroke-width="1.6" marker-end="url(#arr)"/><rect x="707.0" y="624" rx="10" width="205" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="809.5" y="652.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">JsonSchema</text><text x="809.5" y="671.0" text-anchor="middle" font-size="11.5" fill="#46595f">Validerar ärendens extraparamet…<title>Validerar ärendens extraparametrar mot JSON-scheman.</title></text><path d="M 700.0 372 C 700.0 498.0, 809.5 498.0, 809.5 624" fill="none" stroke="#7d99a1" stroke-width="1.6" marker-end="url(#arr)"/><text x="40" y="742" font-size="12" fill="#46595f">• ProcessService väljer processmotor utifrån ärendets namnrymd: parkeringstillstånd och färdtjänst delar namnrymd och skiljs på ärendetyp, medan mark- och exploateringsärenden har egen namnrymd – verifierat i ProcessService.startProcess.</text><text x="40" y="762" font-size="12" fill="#46595f">• Ärendetyper kan konfigureras i databasen att inte starta någon process (isProcessingDisabled) – processtarten hoppas då över.</text><text x="40" y="782" font-size="12" fill="#46595f">• Bilage-endpoints är undantagna från Logbook-payloadloggning; en kommentar i application.yml förklarar att base64-kropparna tidigare orsakade OOM-omstarter.</text><rect x="40" y="810" width="26" height="16" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="73" y="823" font-size="12.5" fill="#1c2b33">Detta API</text><rect x="160.5" y="810" width="26" height="16" rx="4" fill="#e8f5ee" stroke="#15803d" stroke-width="1.5"/><text x="193.5" y="823" font-size="12.5" fill="#1c2b33">Beroende mikrotjänst</text><rect x="345.6" y="810" width="26" height="16" rx="4" fill="#fdf3d7" stroke="#b45309" stroke-width="1.5"/><text x="378.6" y="823" font-size="12.5" fill="#1c2b33">Databas</text><rect x="459.15000000000003" y="810" width="26" height="16" rx="4" fill="#eef1f4" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,4"/><text x="492.15000000000003" y="823" font-size="12.5" fill="#1c2b33">Extern/gemensam tjänst</text></svg>