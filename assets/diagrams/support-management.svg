<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 868" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" role="img" aria-label="Arkitekturdiagram för SupportManagement 14.16"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#7d99a1"/></marker></defs><rect width="1400" height="868" fill="#ffffff"/><text x="700.0" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#00434f">Lösningsarkitektur — SupportManagement 14.16</text><text x="700.0" y="60" text-anchor="middle" font-size="13" fill="#46595f">Pilar visar anrop. Konsumenter når API:et via kommunens API-plattform (WSO2); tjänsten anropar i sin tur andra mikrotjänster.</text><rect x="490.0" y="84" rx="10" width="420" height="64" fill="#eef1f4" stroke="#64748b" stroke-width="2" stroke-dasharray="7,5"/><text x="700.0" y="112.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1c2b33">Konsumerande applikationer</text><text x="700.0" y="131.0" text-anchor="middle" font-size="11.5" fill="#46595f">webbappar, e-tjänster och verksamhetssystem</text><path d="M 700.0 148 L 700.0 194" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/><text x="712.0" y="176" font-size="11" fill="#46595f">OAuth2 (CLIENT_KEY/CLIENT_SECRET)</text><rect x="380.0" y="194" rx="10" width="640" height="58" fill="#eef1f4" stroke="#005a70" stroke-width="2"/><text x="700.0" y="219.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1c2b33">API-plattform (WSO2)</text><text x="700.0" y="238.0" text-anchor="middle" font-size="11.5" fill="#46595f">api.sundsvall.se — gemensam ingång till alla verksamhets-API:er</text><path d="M 700.0 252 L 700.0 298" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arr)"/><rect x="480.0" y="298" rx="10" width="440" height="74" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="700.0" y="331.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1c2b33">SupportManagement 14.16</text><text x="700.0" y="350.0" text-anchor="middle" font-size="11.5" fill="#46595f">api-service-support-management</text><rect x="1110" y="305" rx="10" width="260" height="60" fill="#fdf3d7" stroke="#b45309" stroke-width="2"/><text x="1240.0" y="331.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1c2b33">Databas</text><text x="1240.0" y="350.0" text-anchor="middle" font-size="11.5" fill="#46595f">MariaDB</text><path d="M 920.0 335.0 L 1110 335.0" fill="none" stroke="#b45309" stroke-width="1.6" marker-end="url(#arr)"/><text x="1015.0" y="325.0" text-anchor="middle" font-size="11" fill="#b45309">lagring</text><rect x="40" y="424" rx="12" width="1320" height="284" fill="#f4faf6" stroke="#15803d" stroke-width="1.5" opacity="0.55"/><text x="56" y="448" font-size="13" font-weight="bold" letter-spacing="1" fill="#1c2b33">BEROENDE MIKROTJÄNSTER — anropas av tjänsten</text><rect x="159.5" y="464" rx="10" width="205" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="262.0" y="492.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">Messaging 7.9</text><text x="262.0" y="511.0" text-anchor="middle" font-size="11.5" fill="#46595f">Skickar utgående sms, e-post oc…<title>Skickar utgående sms, e-post och webbmeddelanden i ärendekommunikationen.</title></text><path d="M 700.0 372 C 700.0 418.0, 262.0 418.0, 262.0 464" fill="none" stroke="#7d99a1" stroke-width="1.6" marker-end="url(#arr)"/><rect x="378.5" y="464" rx="10" width="205" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="481.0" y="492.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">MessagingSettings 2.0</text><text x="481.0" y="511.0" text-anchor="middle" font-size="11.5" fill="#46595f">Hämtar avsändar- och meddelan…<title>Hämtar avsändar- och meddelandeinställningar för utskick.</title></text><path d="M 700.0 372 C 700.0 418.0, 481.0 418.0, 481.0 464" fill="none" stroke="#7d99a1" stroke-width="1.6" marker-end="url(#arr)"/><rect x="597.5" y="464" rx="10" width="205" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="700.0" y="492.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">MessageExchange 3.0</text><text x="700.0" y="511.0" text-anchor="middle" font-size="11.5" fill="#46595f">Synkroniserar trådade konversati…<title>Synkroniserar trådade konversationer kopplade till ärenden.</title></text><path d="M 700.0 372 C 700.0 418.0, 700.0 418.0, 700.0 464" fill="none" stroke="#7d99a1" stroke-width="1.6" marker-end="url(#arr)"/><rect x="816.5" y="464" rx="10" width="205" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="919.0" y="492.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">EmailReader 4.2</text><text x="919.0" y="511.0" text-anchor="middle" font-size="11.5" fill="#46595f">Hämtar inkommande e-post som…<title>Hämtar inkommande e-post som blir kommunikation eller nya ärenden.</title></text><path d="M 700.0 372 C 700.0 418.0, 919.0 418.0, 919.0 464" fill="none" stroke="#7d99a1" stroke-width="1.6" marker-end="url(#arr)"/><rect x="1035.5" y="464" rx="10" width="205" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="1138.0" y="492.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">WebMessageCollector 5.1</text><text x="1138.0" y="511.0" text-anchor="middle" font-size="11.5" fill="#46595f">Hämtar webbmeddelanden från…<title>Hämtar webbmeddelanden från e-tjänsteplattformen via schemalagt jobb.</title></text><path d="M 700.0 372 C 700.0 418.0, 1138.0 418.0, 1138.0 464" fill="none" stroke="#7d99a1" stroke-width="1.6" marker-end="url(#arr)"/><rect x="159.5" y="544" rx="10" width="205" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="262.0" y="572.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">Notes 4.0</text><text x="262.0" y="591.0" text-anchor="middle" font-size="11.5" fill="#46595f">Lagrar och hämtar ärendeanteck…<title>Lagrar och hämtar ärendeanteckningar.</title></text><path d="M 700.0 372 C 700.0 458.0, 262.0 458.0, 262.0 544" fill="none" stroke="#7d99a1" stroke-width="1.6" marker-end="url(#arr)"/><rect x="378.5" y="544" rx="10" width="205" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="481.0" y="572.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">Citizen v3</text><text x="481.0" y="591.0" text-anchor="middle" font-size="11.5" fill="#46595f">Slår upp personuppgifter för part…<title>Slår upp personuppgifter för parter i ärendekommunikationen.</title></text><path d="M 700.0 372 C 700.0 458.0, 481.0 458.0, 481.0 544" fill="none" stroke="#7d99a1" stroke-width="1.6" marker-end="url(#arr)"/><rect x="597.5" y="544" rx="10" width="205" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="700.0" y="572.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">Employee v2</text><text x="700.0" y="591.0" text-anchor="middle" font-size="11.5" fill="#46595f">Slår upp handläggaruppgifter för…<title>Slår upp handläggaruppgifter för notifieringar.</title></text><path d="M 700.0 372 C 700.0 458.0, 700.0 458.0, 700.0 544" fill="none" stroke="#7d99a1" stroke-width="1.6" marker-end="url(#arr)"/><rect x="816.5" y="544" rx="10" width="205" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="919.0" y="572.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">Eventlog 2.1</text><text x="919.0" y="591.0" text-anchor="middle" font-size="11.5" fill="#46595f">Skriver ärendehändelser till kom…<title>Skriver ärendehändelser till kommunens centrala händelselogg.</title></text><path d="M 700.0 372 C 700.0 458.0, 919.0 458.0, 919.0 544" fill="none" stroke="#7d99a1" stroke-width="1.6" marker-end="url(#arr)"/><rect x="1035.5" y="544" rx="10" width="205" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="1138.0" y="572.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">Relation 1.1</text><text x="1138.0" y="591.0" text-anchor="middle" font-size="11.5" fill="#46595f">Hanterar relationer mellan ärend…<title>Hanterar relationer mellan ärenden.</title></text><path d="M 700.0 372 C 700.0 458.0, 1138.0 458.0, 1138.0 544" fill="none" stroke="#7d99a1" stroke-width="1.6" marker-end="url(#arr)"/><rect x="488.0" y="624" rx="10" width="205" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="590.5" y="652.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">JsonSchema 1.0</text><text x="590.5" y="671.0" text-anchor="middle" font-size="11.5" fill="#46595f">Validerar ärendens JSON-param…<title>Validerar ärendens JSON-parametrar mot scheman.</title></text><path d="M 700.0 372 C 700.0 498.0, 590.5 498.0, 590.5 624" fill="none" stroke="#7d99a1" stroke-width="1.6" marker-end="url(#arr)"/><rect x="707.0" y="624" rx="10" width="205" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="809.5" y="652.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">AccessMapper</text><text x="809.5" y="671.0" text-anchor="middle" font-size="11.5" fill="#46595f">Hämtar användarens åtkomstgru…<title>Hämtar användarens åtkomstgrupper för behörighetsstyrning av etiketter.</title></text><path d="M 700.0 372 C 700.0 498.0, 809.5 498.0, 809.5 624" fill="none" stroke="#7d99a1" stroke-width="1.6" marker-end="url(#arr)"/><text x="40" y="742" font-size="12" fill="#46595f">• Revisioner skapas genom att ärendets serialiserade ögonblicksbild jämförs med senaste revisionen – en ny revision skapas bara när innehållet faktiskt ändrats, och skillnaden mellan två revisioner räknas fram som JSON-patch-operationer</text><text x="50.007999999999996" y="760" font-size="12" fill="#46595f">(RevisionService).</text><text x="40" y="780" font-size="12" fill="#46595f">• Automatiska åtgärder är pluggbara: åtgärdsklasser (AddLabelAction, SendEmailAction) registreras per namn och styrs av konfiguration i databasen (ErrandActionService).</text><text x="40" y="800" font-size="12" fill="#46595f">• Inkommande e-post som inte kan knytas till ett befintligt ärende skapar ett nytt ärende med avsändaren som part – verifierat i EmailReader-arbetsflödet.</text><rect x="40" y="828" width="26" height="16" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="73" y="841" font-size="12.5" fill="#1c2b33">Detta API</text><rect x="160.5" y="828" width="26" height="16" rx="4" fill="#e8f5ee" stroke="#15803d" stroke-width="1.5"/><text x="193.5" y="841" font-size="12.5" fill="#1c2b33">Beroende mikrotjänst</text><rect x="345.6" y="828" width="26" height="16" rx="4" fill="#fdf3d7" stroke="#b45309" stroke-width="1.5"/><text x="378.6" y="841" font-size="12.5" fill="#1c2b33">Databas</text><rect x="459.15000000000003" y="828" width="26" height="16" rx="4" fill="#eef1f4" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,4"/><text x="492.15000000000003" y="841" font-size="12.5" fill="#1c2b33">Extern/gemensam tjänst</text></svg>