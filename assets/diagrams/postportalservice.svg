font-weight="bold" fill="#1c2b33">Citizen 3.0</text><text x="590.5" y="591.0" text-anchor="middle" font-size="11.5" fill="#46595f">Hämtar folkbokföringsuppgifter, b…<title>Hämtar folkbokföringsuppgifter, bland annat adresser och ålder, för förhandskontrollen.</title></text><path d="M 700.0 372 C 700.0 458.0, 590.5 458.0, 590.5 544" fill="none" stroke="#7d99a1" stroke-width="1.6" marker-end="url(#arr)"/><rect x="707.0" y="544" rx="10" width="205" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="809.5" y="572.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">LegalEntity v2</text><text x="809.5" y="591.0" text-anchor="middle" font-size="11.5" fill="#46595f">Hämtar uppgifter om företag och…<title>Hämtar uppgifter om företag och organisationer vid förhandskontroll av organisationsmottagare.</title></text><path d="M 700.0 372 C 700.0 458.0, 809.5 458.0, 809.5 544" fill="none" stroke="#7d99a1" stroke-width="1.6" marker-end="url(#arr)"/><rect x="40" y="662" rx="12" width="1320" height="124" fill="#f4f5f7" stroke="#64748b" stroke-width="1.5" opacity="0.55"/><text x="56" y="686" font-size="13" font-weight="bold" letter-spacing="1" fill="#1c2b33">EXTERNA SYSTEM OCH INTEGRATIONER</text><rect x="597.5" y="702" rx="10" width="205" height="64" fill="#eef1f4" stroke="#64748b" stroke-width="2" stroke-dasharray="7,5"/><text x="700.0" y="730.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">Kivra (via DigitalRegister…<title>Kivra (via DigitalRegisteredLetter)</title></text><text x="700.0" y="749.0" text-anchor="middle" font-size="11.5" fill="#46595f">integration</text><path d="M 700.0 372 C 700.0 537.0, 700.0 537.0, 700.0 702" fill="none" stroke="#7d99a1" stroke-width="1.6" stroke-dasharray="6,5" marker-end="url(#arr)"/><text x="40" y="814" font-size="12" fill="#46595f">• Förhandskontrollen kategoriserar mottagarna i digital brevlåda, fysisk post, olämpliga (minderåriga) och olevererbara (ej folkbokförda i Sverige) – verifierat i PrecheckService.</text><text x="40" y="834" font-size="12" fill="#46595f">• Leveransen till mottagarna körs parallellt i en dedikerad trådpool (DELIVERY_EXECUTOR) i stället för sekventiellt – verifierat i MessageService.</text><text x="40" y="854" font-size="12" fill="#46595f">• Varje utskick kräver headern X-Sent-By; avsändaren registreras per meddelande och används för historikvyn per användare.</text><rect x="40" y="882" width="26" height="16" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="73" y="895" font-size="12.5" fill="#1c2b33">Detta API</text><rect x="160.5" y="882" width="26" height="16" rx="4" fill="#e8f5ee" stroke="#15803d" stroke-width="1.5"/><text x="193.5" y="895" font-size="12.5" fill="#1c2b33">Beroende mikrotjänst</text><rect x="345.6" y="882" width="26" height="16" rx="4" fill="#fdf3d7" stroke="#b45309" stroke-width="1.5"/><text x="378.6" y="895" font-size="12.5" fill="#1c2b33">Databas</text><rect x="459.15000000000003" y="882" width="26" height="16" rx="4" fill="#eef1f4" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,4"/><text x="492.15000000000003" y="895" font-size="12.5" fill="#1c2b33">Extern/gemensam tjänst</text></svg>