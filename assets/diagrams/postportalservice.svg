<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 922" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" role="img" aria-label="Arkitekturdiagram för Postportalservice 1.9"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#7d99a1"/></marker></defs><rect width="1400" height="922" fill="#ffffff"/><text x="700.0" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#00434f">Lösningsarkitektur — Postportalservice 1.9</text><text x="700.0" y="60" text-anchor="middle" font-size="13" fill="#46595f">Pilar visar anrop. Konsumenter når API:et via kommunens API-plattform (WSO2); tjänsten anropar i sin tur andra mikrotjänster.</text><rect x="490.0" y="84" rx="10" width="420" height="64" fill="#eef1f4" stroke="#64748b" stroke-width="2" stroke-dasharray="7,5"/><text x="700.0" y="112.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1c2b33">Konsumerande applikationer</text><text x="700.0" y="131.0" text-anchor="middle" font-size="11.5" fill="#46595f">webbappar, e-tjänster och verksamhetssystem</text><path d="M 700.0 148 L 700.0 194" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/><text x="712.0" y="176" font-size="11" fill="#46595f">OAuth2 (CLIENT_KEY/CLIENT_SECRET)</text><rect x="380.0" y="194" rx="10" width="640" height="58" fill="#eef1f4" stroke="#005a70" stroke-width="2"/><text x="700.0" y="219.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1c2b33">API-plattform (WSO2)</text><text x="700.0" y="238.0" text-anchor="middle" font-size="11.5" fill="#46595f">api.sundsvall.se — gemensam ingång till alla verksamhets-API:er</text><path d="M 700.0 252 L 700.0 298" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arr)"/><rect x="480.0" y="298" rx="10" width="440" height="74" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="700.0" y="331.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1c2b33">Postportalservice 1.9</text><text x="700.0" y="350.0" text-anchor="middle" font-size="11.5" fill="#46595f">api-service-postportalservice</text><rect x="1110" y="305" rx="10" width="260" height="60" fill="#fdf3d7" stroke="#b45309" stroke-width="2"/><text x="1240.0" y="331.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1c2b33">Databas</text><text x="1240.0" y="350.0" text-anchor="middle" font-size="11.5" fill="#46595f">MariaDB</text><path d="M 920.0 335.0 L 1110 335.0" fill="none" stroke="#b45309" stroke-width="1.6" marker-end="url(#arr)"/><text x="1015.0" y="325.0" text-anchor="middle" font-size="11" fill="#b45309">lagring</text><rect x="40" y="424" rx="12" width="1320" height="204" fill="#f4faf6" stroke="#15803d" stroke-width="1.5" opacity="0.55"/><text x="56" y="448" font-size="13" font-weight="bold" letter-spacing="1" fill="#1c2b33">BEROENDE MIKROTJÄNSTER — anropas av tjänsten</text><rect x="159.5" y="464" rx="10" width="205" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="262.0" y="492.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">Messaging 7.11</text><text x="262.0" y="511.0" text-anchor="middle" font-size="11.5" fill="#46595f">Skickar brev (digital brevlåda me…<title>Skickar brev (digital brevlåda med reservväg till fysisk post) och sms.</title></text><path d="M 700.0 372 C 700.0 418.0, 262.0 418.0, 262.0 464" fill="none" stroke="#7d99a1" stroke-width="1.6" marker-end="url(#arr)"/><rect x="378.5" y="464" rx="10" width="205" height="64" fill="#e8f5ee" stroke="#15803d" stroke-width="2"/><text x="481.0" y="492.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c2b33">DigitalRegisteredLetter 3.1</text><text x="481.0" y="511.0" text-anchor="middle" font-size="11.5" fill="#46595f">Skickar digitala rekommenderad…<title>Skickar digitala rekommenderade brev via Kivra och hämtar signeringsinformation och kvitton.</title></text><path d="M 700.0 372 C