  <script type="application/json" id="page-data">{"api":{"repo":"api-service-simulator-server","namn":"SimulatorServer","slug":"simulator-server","kategori":"Utvecklingsverktyg","status":"verktyg","apiVersion":"2.1","ingress":"Testverktyg som simulerar API-svar med valfri statuskod, svarskropp och fördröjning – för att testa hur anropande system hanterar fel och långsamma svar.","beskrivning":["När ett system som integrerar mot kommunens API:er ska testas behöver man kunna framkalla situationer som är svåra att åstadkomma mot riktiga tjänster: timeouts, femhundrafel, ovanliga statuskoder eller långsamma svar. SimulatorServer är ett litet verktyg som gör just det – anroparen bestämmer själv vilket svar servern ska ge.","Verktyget har två resurser under /simulations/response. POST-varianten ekar tillbaka den inskickade svarskroppen med vald HTTP-status, medan GET-varianten bygger ett Problem-svar (RFC 7807) där titel, detaljer, typ och instans kan styras med parametrar. Båda kan fördröjas ett valfritt antal millisekunder för att simulera långsamma tjänster.","GET-varianten kan dessutom belasta servern med ett sorteringsarbete av upp till en miljon slumpade UUID:n, vilket gör det möjligt att simulera CPU-tung bearbetning – användbart vid last- och resilienstester av exempelvis circuit breakers och timeout-inställningar."],"malgrupp":"Utvecklare och testare av kommunens applikationer och integrationer","funktioner":[{"titel":"Valfri statuskod","text":"Svarar med den HTTP-status anroparen anger, för både lyckade svar och felsvar."},{"titel":"Eko av svarskropp","text":"POST-resursen returnerar den inskickade JSON-kroppen oförändrad, så att förväntade svar kan simuleras exakt."},{"titel":"Konfigurerbara Problem-svar","text":"GET-resursen bygger ett Problem-svar (RFC 7807) där titel, detaljer, typ och instans styrs med parametrar."},{"titel":"Fördröjning","text":"Svar kan fördröjas ett valfritt antal millisekunder för att simulera långsamma tjänster och testa timeouts."},{"titel":"Simulerad CPU-last","text":"Parametern sortSize låter servern sortera upp till en miljon slumpade UUID:n innan svaret skickas, för last- och resilienstester."}],"beroenden":[],"integrationer":[],"databas":null,"teknik":{"sprak":"Java 25","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.8), byggd med Maven","ovrigt":"Ingen persistens och inga externa integrationer – hela tjänsten är en enda REST-kontroller"},"konfiguration":["Ingen miljöspecifik konfiguration krävs – tjänsten saknar databas och integrationer","OpenAPI-dokumentationen genereras vid körning ur koden (ingen specifikation är incheckad i repot)","Körs lokalt med ./mvnw spring-boot:run; välkomstsida på port 8080"],"anteckningar":["Tjänsten är ett renodlat utvecklings- och testverktyg utan verksamhetslogik – API-vägarna saknar municipalityId, till skillnad från kommunens övriga API:er.","Statuskoden kan anges antingen som siffra eller som text – en egen konverterare läser de tre första tecknen och slår upp motsvarande HttpStatus – verifierat i StatusToEnumConverter.","Parametern sortSize genererar och sorterar sortSize × 10 000 slumpade UUID:n (max 100, dvs. en miljon) för att simulera CPU-tung bearbetning – verifierat i kontrollern.","Ingen OpenAPI-specifikation finns incheckad i repot; specifikationen genereras vid körning av dept44:s OpenAPI-stöd."]},"hasSpec":false,"hasSbom":true,"sbom":{"komponenter":193,"licenser":10}}</script>
