  <script type="application/json" id="page-data">{"api":{"repo":"api-service-financial-aid","namn":"Financial Aid","slug":"financial-aid","kategori":"Integration","status":null,"apiVersion":"1.0","ingress":"Hämtar beslutsunderlag för ekonomiskt bistånd från Försäkringskassans sammansatta bastjänst SSBTEK och levererar det som JSON till socialtjänstens handläggningssystem.","beskrivning":["Financial Aid ger socialtjänstens handläggare tillgång till det statliga beslutsunderlaget för ekonomiskt bistånd utan att varje system behöver bygga en egen SOAP-integration mot Försäkringskassan. Tjänsten är en proxy för SSBTEK (Sammansatt Bastjänst för Ekonomiskt Bistånd), som samlar uppgifter från sju myndigheter – bland andra CSN, Försäkringskassan, Arbetsförmedlingen, Skatteverket och Migrationsverket – i ett enda svar.","Anroparen skickar personnummer och ett datumintervall, och tjänsten bygger SSBTEK-frågan med kommunens organisationsuppgifter, anropar bastjänsten över ömsesidig TLS och översätter XML-svaret till generisk JSON grupperad per myndighet.","Tjänsten är helt tillståndslös – inga personuppgifter lagras – och används som beslutsstöd i socialtjänstens handläggning av ekonomiskt bistånd."],"malgrupp":"Socialtjänstens handläggningssystem och kommunens verksamhetssystem","funktioner":[{"titel":"Samlat myndighetsunderlag","text":"Ett anrop hämtar uppgifter från sju myndigheter (CSN, FK, AF, SKV, SPV/SO, TNS, MIV) via SSBTEK i ett svar."},{"titel":"Fråga per person och period","text":"Underlaget hämtas med personnummer och datumintervall som parametrar."},{"titel":"XML till JSON","text":"SSBTEK:s SOAP/XML-svar översätts generiskt till JSON grupperad per myndighet, redo att konsumeras av moderna applikationer."},{"titel":"Säker myndighetsanslutning","text":"Anropen till SSBTEK sker över ömsesidig TLS med kommunens certifikat, och frågan signeras med kommunens organisationsuppgifter."},{"titel":"Tillståndslös proxy","text":"Inga uppgifter lagras i tjänsten – varje anrop hämtas i realtid från bastjänsten."}],"beroenden":[],"integrationer":["Försäkringskassan SSBTEK (Sammansatt Bastjänst för Ekonomiskt Bistånd, SOAP-tjänst med uppgifter från sju myndigheter)"],"databas":null,"teknik":{"sprak":"Java 25","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.8), byggd med Maven","ovrigt":"Spring Web Services (WebServiceTemplate) med JAXB-genererade klasser från SSBTEK:s kontrakt (v10)"},"konfiguration":["URL till SSBTEK-tjänsten samt keystore (base64) och lösenord för klientcertifikatet","Konfigurerbara connect- och read-timeouts mot SSBTEK","Ingen databas och inga OAuth2-klienter mot andra kommun-API:er – tjänsten har bara den externa SSBTEK-integrationen","Anrop görs per kommun – municipalityId ingår i API-vägen"],"anteckningar":["Kommunens organisationsnummer, organisationsnamn och aktörs-id mot Försäkringskassan är hårdkodade konstanter i SSBTEKIntegration – tjänsten är i praktiken knuten till Sundsvalls kommun.","XML-svaret översätts till JSON med en generisk XML-till-JSON-konvertering i stället för fältvis mappning, vilket gör att nya fält i bastjänsten följer med automatiskt.","API:et består av en enda GET-endpoint (/{municipalityId}/financial-aid) med personnummer och datumintervall som parametrar – verifierat i FinancialAidResource.","Tjänsten lagrar ingenting; den saknar databas och beroenden till andra kommun-API:er."]},"hasSpec":true,"hasSbom":true,"sbom":{"komponenter":209,"licenser":10}}</script>
