  <script type="application/json" id="page-data">{"api":{"repo":"api-service-datacatalog","namn":"DataCatalog","slug":"datacatalog","kategori":"Integration","status":null,"apiVersion":"1.0","ingress":"Aggregerar kommunens öppna data-metadata till en samlad DCAT-AP-SE-katalog som skördas av Sveriges Dataportal.","beskrivning":["DataCatalog är kommunens metadatakatalog för öppna data. Tjänsten samlar ihop DCAT-AP-SE-beskrivningar av kommunens datamängder från flera källor och slår samman dem till en enda katalog i RDF/XML-format, som Sveriges Dataportal (dataportal.se) skördar för att göra kommunens öppna data hittbara nationellt.","Katalogen byggs från två håll: dels hämtas färdiga DCAT-kataloger från konfigurerade externa källor (i dag IoT-plattformen Diwise), dels genererar tjänsten själv DCAT-metadata för internt förvaltade datamängder som beskrivs direkt i konfigurationen – till exempel sopschemat som exponeras via kommunens Garbage-API.","Vid sammanslagningen dedupliceras utgivare mot kommunens kanoniska utgivarpost och alla dataset samlas under en gemensam dcat:Catalog. Externa källor cachas en konfigurerbar tid, och en källa som inte svarar utesluts ur katalogen i stället för att fälla hela anropet."],"malgrupp":"Sveriges Dataportal och andra skördare av öppna data-metadata","funktioner":[{"titel":"Samlad DCAT-katalog","text":"GET /datasets/dcat returnerar hela kommunens öppna data-katalog som DCAT-AP-SE i RDF/XML."},{"titel":"Aggregering från externa källor","text":"Färdiga DCAT-kataloger hämtas från konfigurerade källor, i dag IoT-plattformen Diwise."},{"titel":"Egen metadatagenerering","text":"DCAT-metadata för internt förvaltade datamängder (t.ex. sopschemat via Garbage-API:et) genereras ur konfigurationen."},{"titel":"Sammanslagning med deduplicering","text":"Alla källor slås ihop till en dcat:Catalog och utgivare dedupliceras mot kommunens kanoniska utgivarpost."},{"titel":"Cachning och feltålighet","text":"Externa källor cachas (standard en timme) och en källa som inte svarar utesluts i stället för att fälla anropet."}],"beroenden":[],"integrationer":["Diwise (IoT-plattform – extern DCAT-källa)","Sveriges Dataportal (skördar den publicerade katalogen)"],"databas":null,"teknik":{"sprak":"Java 25","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.5), byggd med Maven","ovrigt":"Egen RDF/XML-hantering (parsning, generering och sammanslagning av DCAT-element), RestClient för källhämtning"},"konfiguration":["integration.dcat.rdf-sources – lista över externa DCAT-källor med namn och URL","integration.dcat.catalog – kommunens katalogmetadata (titlar, utgivare, kontaktuppgifter) och internt förvaltade dataset beskrivs direkt i application.yml","integration.dcat.cache-duration styr hur länge externa källor cachas (standard PT1H)","Ingen databas och inga OAuth2-integrationer – tjänsten är en ren läsande aggregator"],"anteckningar":["En extern källa som inte svarar loggas och utesluts ur katalogen i stället för att fälla anropet; först när inga källor alls finns svarar tjänsten 503 – verifierat i DcatClient och DataCatalogService.","Internt förvaltade datamängder beskrivs helt i application.yml och renderas till DCAT av DcatRdfGenerator – i dag sopschemat från Garbage-API:et.","Tjänsten saknar municipalityId i API-vägen till skillnad från de flesta av kommunens API:er – katalogen är en enda gemensam resurs.","Repot innehåller ingen incheckad OpenAPI-specifikation (ingen openapi.yml under integrationstesterna); API:et består av en enda GET-endpoint."]},"hasSpec":false,"hasSbom":true,"sbom":{"komponenter":194,"licenser":11}}</script>
