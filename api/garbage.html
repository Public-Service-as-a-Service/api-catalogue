  <script type="application/json" id="page-data">{"api":{"repo":"api-service-garbage","namn":"Garbage","slug":"garbage","kategori":"Samhällsservice","status":null,"apiVersion":"2.1","ingress":"Tillhandahåller uppgifter om när avfallshämtning sker på en viss adress eller inom ett område – för e-tjänster och applikationer som vill visa hämtschema för invånare.","beskrivning":["Garbage svarar på frågan \"när töms soporna hos mig?\". API:et lagrar kommunens hämtscheman för avfall och låter applikationer söka fram schemat för en adress – gata, husnummer, postnummer och ort – eller för ett större urval med paginering. Svaret anger bland annat hämtdag, vecka (jämn/udda), avfallstyp och fastighetskategori.","Schemauppgifterna hämtas automatiskt från avfallsverksamhetens system: ett schemalagt jobb laddar varje vardagsmorgon ner en CSV-fil från en SFTP-server, tolkar den och ersätter hela databasinnehållet med de nya raderna. Uppdateringen kan även triggas manuellt via API:et.","API:et hanterar fyra avfallstyper – restavfall, matavfall, plastförpackningar och pappersförpackningar – och skiljer på småhus och fritidshus. Det gör att e-tjänster kan visa ett komplett sorteringsschema per hushåll."],"malgrupp":"Kommunens applikationer och verksamhetssystem","funktioner":[{"titel":"Hämtschema per adress","text":"Sök fram avfallshämtningsschema utifrån gata, husnummer, postnummer och ort."},{"titel":"Flera avfallstyper","text":"Schemat omfattar restavfall, matavfall, plastförpackningar och pappersförpackningar."},{"titel":"Fastighetskategorier","text":"Skiljer på småhus och fritidshus, som kan ha olika hämtintervall."},{"titel":"Automatisk uppdatering","text":"Ett schemalagt jobb hämtar varje vardagsmorgon en CSV-fil från avfallssystemets SFTP-server och ersätter databasens innehåll."},{"titel":"Manuell uppdatering","text":"Schemauppdateringen kan även startas på begäran via ett API-anrop."},{"titel":"Paginering","text":"Stora sökresultat kan hämtas sida för sida, grupperade per adress så att en adress aldrig delas mellan sidor."}],"beroenden":[],"integrationer":["SFTP-server hos avfallsverksamheten (CSV-filer med hämtscheman)"],"databas":"MariaDB med Flyway-migrationer; lagrar hämtscheman per adress, avfallstyp och hämtdatum","teknik":{"sprak":"Java 25","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.8), byggd med Maven","ovrigt":"Apache Commons VFS2 och JSch för SFTP, Jackson CSV för filtolkning, ShedLock för schemalagda jobb"},"konfiguration":["application.yml med SFTP-uppgifter (värd, användarnamn, lösenord, filnamn) som injiceras via miljön per driftsättning","MariaDB-anslutning; databasschemat versionshanteras med Flyway","Schemalagt jobb (cron, vardagar kl. 05) med ShedLock-låsning och maximal körtid, konfigurerbart per kommun (municipality-ids)","Timeout-inställningar för SFTP-anslutning och överföring så att ett hängande jobb avbryts snabbt","Anrop görs per kommun – municipalityId ingår i alla API-vägar"],"anteckningar":["Vid varje uppdatering ersätts hela databasinnehållet: befintliga rader raderas i batch och de nyinlästa CSV-raderna sparas – verifierat i tjänstelagret. Om filen är tom avbryts bytet och tjänstens hälsoindikator sätts till unhealthy.","Pagineringen görs medvetet efter gruppering per adress, inte på databasrader – databasen lagrar en rad per (adress, avfallstyp) och radpaginering skulle dela en adress mellan sidor.","SFTP-nedladdningen använder en egen filsystemhanterare per körning i stället för VFS:s process-globala singleton, för att undvika att en cachead, död SFTP-kanal återanvänds mellan körningar (\"Pipe closed\").","Tjänsten har inga beroenden till andra kommun-mikrotjänster – all data kommer från CSV-filen via SFTP."]},"hasSpec":true,"hasSbom":true,"sbom":{"komponenter":281,"licenser":14}}</script>
