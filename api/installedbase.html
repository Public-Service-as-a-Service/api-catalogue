  <script type="application/json" id="page-data">{"api":{"repo":"api-service-installedbase","namn":"InstalledBase","slug":"installedbase","kategori":"Parts- och kunddata","status":null,"apiVersion":"3.2","ingress":"Visar en parts engagemang och anläggningar (installerad bas) hos kommunens leverantörsbolag, och hanterar delegering av anläggningar mellan parter.","beskrivning":["InstalledBase samlar uppgifter om vilka engagemang en invånare eller ett företag har hos leverantörer inom kommunkoncernen – till exempel el-, fjärrvärme- och renhållningsabonnemang – och vilka anläggningar som hör till engagemangen. Uppgifterna hämtas ur kommunens datalager via tjänsten DataWarehouseReader och presenteras samlat per kund, med anläggningsadresser och metadata per anläggning.","API:et kan slå upp installerad bas antingen per partyId eller per leverantörsbolag och kundnummer, med möjlighet att filtrera på ändringsdatum för att bara hämta det som tillkommit eller ändrats sedan en viss dag.","Tjänsten hanterar också delegeringar: en anläggningsägare kan delegera sina anläggningar till en annan part, till exempel för att någon annan ska kunna företräda ägaren i kommunens e-tjänster. Delegeringarna lagras i tjänstens egen databas och alla förändringar loggas som händelser i kommunens EventLog-tjänst."],"malgrupp":"Kommunens applikationer och verksamhetssystem","funktioner":[{"titel":"Installerad bas per part","text":"Hämtar en parts samtliga engagemang och anläggningar hos koncernens leverantörsbolag, uppslaget på partyId."},{"titel":"Filtrering och paginering","text":"Resultatet kan filtreras på leverantörsbolag och ändringsdatum samt pagineras och sorteras."},{"titel":"Skapa delegering","text":"En anläggningsägare kan delegera sina anläggningar till en annan part; dubbletter avvisas."},{"titel":"Uppdatera och ta bort delegering","text":"Befintliga delegeringar kan uppdateras med nya anläggningar och tas bort."},{"titel":"Sök delegeringar","text":"Delegeringar söks fram per ägare eller mottagare (delegatedTo)."},{"titel":"Händelselogg","text":"Alla förändringar av delegeringar loggas som händelser i EventLog med berörda anläggningar."}],"beroenden":[{"name":"DataWarehouseReader","version":"5.3","usage":"Hämtar kundengagemang och installerad bas ur kommunens datalager."},{"name":"EventLog","version":"2.1","usage":"Loggar skapande, uppdatering och borttag av delegeringar som händelser."}],"integrationer":[],"databas":"MariaDB med Flyway-migrationer; delegeringar och deras anläggningar lagras i databasen (uppgifterna om installerad bas lagras inte utan hämtas vid varje anrop)","teknik":{"sprak":"Java 25","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.8), byggd med Maven","ovrigt":"Resilience4j-circuit breaker mot DataWarehouseReader"},"konfiguration":["application.yml med URL och OAuth2-klientuppgifter för DataWarehouseReader och EventLog","MariaDB-anslutning; databasschemat versionshanteras med Flyway","Lång läs-timeout (110 s) mot DataWarehouseReader eftersom uppslagen i datalagret kan ta tid","Anrop görs per kommun – municipalityId ingår i alla API-vägar"],"anteckningar":["Vid uppslag per leverantörsbolag hämtar tjänsten alla sidor från DataWarehouseReader i en loop (100 poster per sida) och slår ihop dem till ett svar – verifierat i InstalledBaseService.","En ägare kan bara ha en delegering per mottagare och kommun; försök att skapa en till besvaras med 409 Conflict – verifierat i DelegationService.","Vid delegering återanvänds redan lagrade anläggningsposter i databasen i stället för att dubbletter skapas – verifierat i DelegationService.","Varje förändring av en delegering skickas som händelse till EventLog med anläggnings-id och organisationsnummer i metadata – verifierat i DelegationService."]},"hasSpec":true,"hasSbom":true,"sbom":{"komponenter":296,"licenser":14}}</script>
