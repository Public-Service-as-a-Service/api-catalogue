  <script type="application/json" id="page-data">{"api":{"repo":"api-service-casemanagement","namn":"CaseManagement","slug":"casemanagement","kategori":"Integration","status":null,"apiVersion":"8.4","ingress":"Integrationslager som tar emot ärenden från e-tjänster och skickar dem vidare till rätt verksamhetssystem – ByggR, Ecos, Alk-T, EDP Future eller CaseData – och ger en samlad statusbild tillbaka.","beskrivning":["CaseManagement gör att kommunens e-tjänster inte behöver känna till vilket verksamhetssystem som handlägger ett visst ärende. E-tjänsten skickar in ärendet till detta API, som utifrån ärendetypen registrerar det i rätt system: bygglovsärenden i ByggR, miljö- och hälsoskyddsärenden i Ecos, serveringstillstånd i Alk-T, ärenden i EDP Future eller myndighetsärenden i CaseData.","Inkommande ärenden sparas först i tjänstens egen databas och skickas därefter vidare asynkront. Varje målsystem har en egen processor med återförsökslogik – misslyckas leveransen slutgiltigt notifieras förvaltningen via Messaging. Kopplingen mellan e-tjänstens ärende-id och verksamhetssystemets diarienummer sparas i en mappningstabell, som också gör det möjligt att uppdatera e-tjänsten med status.","API:et exponerar ärendestatus samlat: en fråga per externt ärende-id, per organisationsnummer eller per part slås upp mot rätt bakomliggande system via mappningstabellen. Vid registrering i ByggR och Ecos berikas ärendena med fastighetsinformation från fastighetsdatasystemet FB och Lantmäteriets registerbeteckningar."],"malgrupp":"Kommunens e-tjänster och verksamhetssystem","funktioner":[{"titel":"Ett API mot flera verksamhetssystem","text":"Tar emot ärenden och registrerar dem i ByggR, Ecos, Alk-T, EDP Future eller CaseData beroende på ärendetyp."},{"titel":"Asynkron leverans med återförsök","text":"Ärenden sparas lokalt och skickas vidare asynkront; varje målsystem har en processor med återförsökspolicy och notifiering via Messaging när leveransen slutgiltigt misslyckas."},{"titel":"Samlad ärendestatus","text":"Status kan hämtas per externt ärende-id, organisationsnummer eller part och slås upp i rätt bakomliggande system via mappningstabellen."},{"titel":"Ärendemappning","text":"Kopplingen mellan e-tjänstens ärende-id och verksamhetssystemets diarienummer lagras och används för status och uppdateringar."},{"titel":"Fastighetsberikning","text":"Fastighetsbeteckningar valideras och berikas med uppgifter från FB och Lantmäteriets registerbeteckningar innan ärendet registreras."},{"titel":"Återkoppling till e-tjänsten","text":"Statusuppdateringar och meddelanden skickas tillbaka till Open ePlatform via OepIntegrator."}],"beroenden":[{"name":"CaseData","version":"13.0","usage":"Registrerar och uppdaterar myndighetsärenden, t.ex. parkeringstillstånd."},{"name":"Alkt","version":"2.0","usage":"Hämtar ärendestatus för serveringstillstånd ur Alk-T."},{"name":"OepIntegrator","version":"1.5","usage":"Skickar statusuppdateringar och meddelanden tillbaka till e-tjänsteplattformen (Open ePlatform)."},{"name":"Party","version":"2.1","usage":"Översätter partyId till person- eller organisationsnummer."},{"name":"Messaging","version":"7.10","usage":"Notifierar förvaltningen när ett ärende inte kunnat levereras till målsystemet."},{"name":"Eventlog","version":"2.1","usage":"Skriver ärendehändelser till kommunens centrala händelselogg."}],"integrationer":["ByggR (bygglovssystem, SOAP via ArendeExport)","Ecos/MinutMiljö (miljö- och hälsoskyddssystem, SOAP)","EDP Future (verksamhetssystem, SOAP)","FB (fastighetsdatasystem, Sokigo)","Lantmäteriet (registerbeteckningar för fastigheter)"],"databas":"MariaDB med Flyway-migrationer; inkommande ärenden och mappningen mellan externa ärende-id:n och verksamhetssystemens diarienummer lagras här","teknik":{"sprak":"Java 25","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.8), byggd med Maven","ovrigt":"SOAP-klienter (genererade ur WSDL) mot ByggR, Ecos och EDP Future, Failsafe-återförsökspolicyer, asynkron hantering via Springs applikationshändelser, Resilience4j (circuit breakers)"},"konfiguration":["application.yml med URL och OAuth2-klientuppgifter för de beroende mikrotjänsterna samt anslutningsuppgifter (användarnamn/lösenord) för SOAP-tjänsterna ByggR, Ecos, EDP Future och FB","MariaDB-anslutning; databasschemat versionshanteras med Flyway","Återförsökspolicy (antal försök och intervall) för leverans till målsystemen","Truststore för certifikatverifiering mot externa system","Anrop görs per kommun – municipalityId ingår i API-vägarna"],"anteckningar":["Inkommande ärenden sparas först lokalt och skickas sedan vidare asynkront via Springs applikationshändelser; varje målsystem har en egen processor med Failsafe-återförsökspolicy, och när maxantalet leveransförsök överskrids notifieras förvaltningen via Messaging (ByggrProcessor med flera).","Open ePlatform kan bara skicka POST-anrop, så uppdateringar signaleras med extraparametern oepAction=PUT – en dokumenterad specialhantering i CaseService.handleCase.","Fastighetsbeteckningar slås upp i två steg: Lantmäteriets registerbeteckningsreferens hämtas först och används sedan för att hämta fastighetsuppgifter ur FB (FbService).","README listar ByggR, Ecos, Alk-T och CaseData som målsystem, men koden hanterar även EDP Future via SOAP – koden är sanningskällan."]},"hasSpec":true,"hasSbom":true,"sbom":{"komponenter":268,"licenser":14}}</script>
