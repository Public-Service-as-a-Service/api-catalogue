  <script type="application/json" id="page-data">{"api":{"repo":"api-service-messaging","namn":"Messaging","slug":"messaging","kategori":"Kommunikation","status":null,"apiVersion":"7.12","ingress":"Gemensamt API för att skicka meddelanden till invånare, företag och medarbetare – via sms, e-post, digital brevlåda, webbmeddelanden och fysiska brev.","beskrivning":["Messaging är kommunens gemensamma väg ut för meddelanden. I stället för att varje applikation själv integrerar mot sms-leverantörer, e-postservrar och digitala brevlådor anropar de detta API, som tar hand om leveransen via rätt kanal. API:et används bland annat av kommunens ärendehanterings- och myndighetsutövningsapplikationer för att skicka beslut och notifieringar.","API:et stödjer enstaka utskick och batchutskick av sms och e-post, digital post och digitala fakturor till invånarnas digitala brevlådor, webbmeddelanden till kommunens e-tjänsteplattform samt fysiska brev. Meddelandetypen letter är särskilt kraftfull: den försöker först leverera till mottagarens digitala brevlåda och faller automatiskt tillbaka på fysisk post om digital leverans inte är möjlig.","Varje utskick registreras med leveransstatus som kan följas upp per meddelande, batch eller leverans. API:et erbjuder även statistik per meddelandetyp och avdelning, konversationshistorik per part samt en meddelandevy per användare."],"malgrupp":"Kommunens applikationer och verksamhetssystem","funktioner":[{"titel":"Sms och e-post","text":"Enstaka utskick och batchutskick av sms och e-post till en eller flera mottagare."},{"titel":"Digital brevlåda","text":"Digital post och digitala fakturor levereras till invånarnas digitala brevlådor, med uppslag av vilka mottagare som kan nås digitalt."},{"titel":"Brev med automatisk kanalväxling","text":"Meddelandetypen letter levereras i första hand digitalt och skickas annars automatiskt som fysisk post."},{"titel":"Kanalval utifrån kontaktinställningar","text":"Meddelandetypen message slår upp mottagarens re
