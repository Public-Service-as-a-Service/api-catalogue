  <script type="application/json" id="page-data">{"api":{"repo":"api-service-messaging-settings","namn":"MessagingSettings","slug":"messaging-settings","kategori":"Kommunikation","status":null,"apiVersion":"3.0","ingress":"Håller verksamheternas inställningar för meddelandeutskick – till exempel avsändaruppgifter och kanalval – per kommun och avdelning, med uppslag utifrån inloggad användare.","beskrivning":["MessagingSettings är registret över hur kommunens olika verksamheter vill att deras meddelanden ska skickas. I stället för att varje applikation hårdkodar avsändaruppgifter och kanalinställningar hämtas de härifrån, per kommun och avdelning. Tjänsten används av meddelandeflödena runt Messaging-API:et.","Inställningarna lagras som typade nyckel-värde-par (boolean, sträng, numeriskt eller webbadress) knutna till en kommun och en avdelning, till exempel avsändarnamn, mappnamn för fysiska brev eller vilken metod som används för rekommenderade försändelser. Modellen är generisk, så nya inställningar kan läggas till utan databasändringar.","Utöver vanlig hantering per inställning kan en applikation fråga efter inställningar för den organisation en användare tillhör: tjänsten slår då upp användarens avdelning via Employee-API:et och letar hierarkiskt – först på avdelningsnivå och därefter uppåt i organisationen – tills inställningar hittas."],"malgrupp":"Kommunens applikationer och verksamhetssystem","funktioner":[{"titel":"Hämta inställningar","text":"Inställningar listas per kommun med flexibla filteruttryck, eller hämtas per id."},{"titel":"Skapa och uppdatera","text":"Inställningsposter skapas, uppdateras och raderas per kommun och avdelning; enskilda nycklar kan raderas separat."},{"titel":"Typade nyckel-värde-par","text":"Varje inställning är ett nyckel-värde-par med typ (BOOLEAN, STRING, NUMERIC eller WEB), vilket gör modellen utbyggbar utan schemaändringar."},{"titel":"Uppslag utifrån användare","text":"Med användarens identitet i anropshuvudet slås tillhörande avdelning upp via Employee-API:et och inställningarna hämtas hierarkiskt för organisationen."}],"beroenden":[{"name":"Employee","version":"v2","usage":"Slår upp vilken avdelning och organisation en användare tillhör vid uppslag av inställningar per användare."}],"integrationer":[],"databas":"MariaDB med Flyway-migrationer; inställningarna lagras som typade nyckel-värde-par per kommun och avdelning","teknik":{"sprak":"Java 25","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.8), byggd med Maven","ovrigt":"JPA med specifikationsbaserad filtrering"},"konfiguration":["URL och OAuth2-klientuppgifter (client credentials) för Employee-API:et","AD-domän per kommun för användaruppslag (integration.employee.domains)","MariaDB-anslutning; databasschemat versionshanteras med Flyway","Anrop görs per kommun – municipalityId ingår i alla API-vägar"],"anteckningar":["Uppslag per användare sker hierarkiskt: användarens avdelningar hämtas från Employee-API:et och prövas i tur och ordning tills inställningar hittas, annars svarar API:et 404 – verifierat i MessagingSettingsService.","Användarens identitet tas från anropshuvudet x-sent-by (dept44 Identifier), inte från en parameter i anropet.","Datamodellen gjordes om från fasta kolumner (bl.a. rek-metod, sms-avsändare, mappnamn) till generiska typade nyckel-värde-par i Flyway-migrationen V1_5 – äldre beskrivningar av fasta fält stämmer inte längre.","Vilken AD-domän användare slås upp mot styrs per kommun i konfigurationen, så flera kommuner med olika kataloger kan dela tjänsten."]},"hasSpec":true,"hasSbom":true,"sbom":{"komponenter":300,"licenser":14}}</script>
