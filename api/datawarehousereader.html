  <script type="application/json" id="page-data">{"api":{"repo":"api-service-datawarehousereader","namn":"DataWarehouseReader","slug":"datawarehousereader","kategori":"Parts- och kunddata","status":null,"apiVersion":"5.7","ingress":"Läs-API mot Stadsbackenkoncernens datalager – kunder, avtal, anläggningar, fakturor och mätvärden för el, fjärrvärme, vatten och andra nyttigheter.","beskrivning":["DataWarehouseReader ger kommunens applikationer ett enhetligt REST-gränssnitt mot Stadsbackenkoncernens datalager, där kund-, avtals- och förbrukningsdata från de kommunala bolagen samlas. I stället för att applikationer ansluter direkt till datalagret frågar de detta API, som hanterar behörigheter, paginering och identitetsöversättning.","API:et täcker flera datadomäner: kundengagemang och kunddetaljer, avtal, anläggningar (installations), installerad bas, fakturor med fakturadetaljer samt mätvärden. Mätvärdena kan hämtas per nyttighet – bredband, fjärrkyla, fjärrvärme, el, elhandel, avfall och vatten – och aggregeras på olika tidsupplösningar.","Personuppgifter skyddas genom att API:et arbetar med partyId i stället för person- och organisationsnummer: inkommande partyId översätts till legal-id via Party-tjänsten innan datalagret frågas, och svaren översätts tillbaka. Uppslagen cachas ett dygn för att minska trafiken mot Party."],"malgrupp":"Kommunens applikationer och verksamhetssystem","funktioner":[{"titel":"Kundengagemang och kunddetaljer","text":"Sökning av kunder och deras engagemang i de kommunala bolagen, med partyId som identifierare."},{"titel":"Avtal","text":"Paginerad sökning av avtal per kund, anläggning och nyttighet."},{"titel":"Anläggningar och installerad bas","text":"Uppgifter om anläggningar och installerad bas kopplade till kundernas engagemang."},{"titel":"Fakturor","text":"Fakturor med tillhörande fakturadetaljer och pdf-referenser ur datalagret."},{"titel":"Mätvärden","text":"Förbrukningsvärden per nyttighet (el, fjärrvärme, fjärrkyla, elhandel, vatten, avfall, bredband) med valbar aggregering."},{"titel":"Skyddade identiteter","text":"PartyId översätts till person-/organisationsnummer först vid frågan mot datalagret och tillbaka i svaret."}],"beroenden":[{"name":"Party","version":"2.0","usage":"Översätter partyId till person- eller organisationsnummer och tillbaka; provar privat- och företagskund i tur och ordning."}],"integrationer":["Stadsbackenkoncernens datalager (Microsoft SQL Server, läsande åtkomst)"],"databas":"Microsoft SQL Server – läser direkt ur Stadsbackens datalager (inga egna migrationer; schemat ägs av datalagret)","teknik":{"sprak":"Java 25","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.8), byggd med Maven","ovrigt":"JPA mot SQL Server med lagrade procedurer och JDBC-frågor, Caffeine-cache för Party-uppslag, Resilience4j circuit breaker mot Party"},"konfiguration":["SQL Server-anslutning till Stadsbackens datalager med utökad anslutningspool (upp till 50 anslutningar)","URL och OAuth2-klientuppgifter (client credentials) för Party-integrationen","Cache för party-/legal-id-uppslag: upp till 1000 poster i 24 timmar","Anrop görs per kommun – municipalityId ingår i alla API-vägar"],"anteckningar":["Tjänsten är ett renodlat läs-API: den äger ingen egen databas utan frågar Stadsbackens SQL Server-datalager direkt, utan Flyway-migrationer.","PartyId slås upp först som privatkund och därefter som företagskund innan 404 returneras – verifierat i PartyProvider.","Uppslag mot Party cachas i Caffeine (partyIds/legalIds, 24 timmar) för att minska trafiken vid stora svarsmängder.","Mätvärdeskategorierna mappas till datalagrets svenska benämningar (t.ex. ELECTRICITY ⇒ 'El', WASTE_MANAGEMENT ⇒ 'Avfallsvåg') i Category-enumen."]},"hasSpec":true,"hasSbom":true,"sbom":{"komponenter":252,"licenser":12}}</script>
