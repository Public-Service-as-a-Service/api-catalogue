  <script type="application/json" id="page-data">{"api":{"repo":"api-service-billing-data-collector","namn":"Billing Data Collector","slug":"billing-data-collector","kategori":"Ekonomi och fakturering","status":null,"apiVersion":"2.1","ingress":"Samlar in faktureringsunderlag från e-tjänsteformulär och avtal, omvandlar dem till fakturaposter och skickar dem vidare till Billing Preprocessor.","beskrivning":["Billing Data Collector automatiserar insamlingen av faktureringsunderlag som annars skulle registreras manuellt. Tjänsten hämtar inskickade kundfakturaformulär från kommunens e-tjänsteplattform (Open ePlatform) och omvandlar dem till fakturaposter som skickas till Billing Preprocessor för vidare hantering mot ekonomisystemet.","Tjänsten sköter också schemalagd avtalsfakturering: avtal hämtas från Contract-tjänsten, priser räknas upp med konsumentprisindex (KPI) från SCB, och färdiga fakturaposter skapas enligt varje avtals faktureringsintervall. När en post skapats registreras en koppling mellan avtalet och fakturaposten via Relation-tjänsten.","Underlag som inte kan behandlas hamnar i en falloutlista som kan granskas och triggas om via API:et, och en daglig e-postrapport skickas till konfigurerade mottagare. Faktureringen kan även triggas manuellt per ärende eller för ett datumintervall."],"malgrupp":"Kommunens applikationer och verksamhetssystem","funktioner":[{"titel":"Insamling från e-tjänstformulär","text":"Hämtar inskickade kundfakturaformulär från Open ePlatform och omvandlar dem till fakturaposter, schemalagt varje natt eller manuellt per ärende."},{"titel":"Schemalagd avtalsfakturering","text":"Skapar fakturaposter från avtal enligt deras faktureringsintervall, med priser uppräknade med konsumentprisindex från SCB."},{"titel":"Vidarebefordran till Billing Preprocessor","text":"Färdiga fakturaposter skickas till Billing Preprocessor som tar dem vidare till ekonomisystemet Raindance."},{"titel":"Fallouthantering","text":"Underlag som inte kan behandlas sparas som fallout, kan triggas om via API:et och rapporteras dagligen via e-post."},{"titel":"Avtalshändelser","text":"Tar emot händelser om skapade, uppdaterade, borttagna och avslutade avtal och uppdaterar den schemalagda faktureringen därefter."},{"titel":"KPI-uppslag","text":"Exponerar konsumentprisindex från SCB via ett eget API-anrop, med långtidscachning av svaren."}],"beroenden":[{"name":"BillingPreProcessor","version":"4.5","usage":"Tar emot de fakturaposter tjänsten skapar."},{"name":"Contract","version":"10.0","usage":"Hämtar avtal som underlag för den schemalagda avtalsfaktureringen."},{"name":"Messaging","version":"7.9","usage":"Skickar den dagliga falloutrapporten via e-post."},{"name":"Party","version":"2.0","usage":"Slår upp partyId för externa fakturamottagare."},{"name":"Relation","version":"1.1","usage":"Registrerar kopplingen mellan avtal och skapad fakturapost."}],"integrationer":["Open ePlatform (e-tjänsteplattform, hämtning av kundfakturaformulär)","SCB PxWeb API (konsumentprisindex för prisuppräkning)"],"databas":"MariaDB med Flyway-migrationer; lagrar historik, falloutposter, schemalagd fakturering och motpartsmappning","teknik":{"sprak":"Java 25","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.8), byggd med Maven","ovrigt":"Schemalagda jobb med Shedlock-låsning, Caffeine-cache för partyId och KPI-data, Xsoup för tolkning av formulärdata"},"konfiguration":["application.yml med URL och OAuth2-klientuppgifter för Billing Preprocessor, Contract, Party och Relation","Anslutning och certifikat för Open ePlatform samt bas-URL för SCB:s PxWeb-API","MariaDB-anslutning; databasschemat versionshanteras med Flyway","Cron-scheman för jobben: OpenE-hämtning (03:00), falloutrapport (04:00), avtalsfakturering (varannan timme) och certifikatkontroll (06:00)","Mottagare och mall för falloutrapportens e-post"],"anteckningar":["Externa fakturaposter berikas med partyId via Party-tjänsten; hittas inget partyId skickas organisationsnumret vidare i stället (gäller ej privatpersoner) – verifierat i KundfakturaformularBillingRecordDecorator.","Avtalspriser indexuppräknas med KPI från SCB där oktobervärdet alltid används som indexperiod; KPI-svaren cachas i 30 dagar.","När en avtalsfakturapost skapats registreras en relation mellan avtalet och posten via Relation-API:et – verifierat i ContractBillingHandler.","Ett dagligt certifikatjobb kontrollerar OpenE-certifikatets giltighet och varnar 15 dagar före utgång.","README beskriver bara tjänsten översiktligt (\"schedules and performs billings\") – funktionaliteten ovan är härledd ur koden."]},"hasSpec":true,"hasSbom":true,"sbom":{"komponenter":311,"licenser":14}}</script>
