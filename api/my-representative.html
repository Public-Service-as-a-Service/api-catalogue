  <script type="application/json" id="page-data">{"api":{"repo":"api-service-my-representative","namn":"MyRepresentative","slug":"my-representative","kategori":"Parts- och kunddata","status":null,"apiVersion":"4.4","ingress":"Registrerar och håller ordning på fullmakter (mandat) mellan parter, så att kommunens tjänster vet vem som får företräda vem.","beskrivning":["MyRepresentative hanterar fullmakter mellan parter i kommunen: en fullmaktsgivare (till exempel ett företag) ger en fullmaktstagare rätt att agera ombud. Fullmakterna lagras per kommun och namnrymd (namespace), så att olika verksamhetsområden kan hålla sina fullmakter åtskilda. Andra tjänster slår upp fullmakterna för att avgöra om en person får företräda en organisation i ett visst sammanhang.","När en fullmakt skapas för en organisation kontrollerar tjänsten att den person som ställer ut fullmakten verkligen är behörig firmatecknare: person- och organisationsnummer slås upp via Party-tjänsten och personens engagemang i organisationen hämtas från LegalEntity-tjänsten, som också anger om personen är firmatecknare. Saknas engagemang avvisas fullmakten med 404, och en person som inte är firmatecknare avvisas med 403.","Fullmakter har giltighetstid (aktiv från och inaktiv efter), kan sökas fram med filter, och tas bort mjukt genom tidsstämpling i stället för att raderas. Dubbletter med överlappande giltighetsperiod för samma parter avvisas."],"malgrupp":"Kommunens applikationer och verksamhetssystem","funktioner":[{"titel":"Registrera fullmakter","text":"Fullmakter skapas med fullmaktsgivare, fullmaktstagare, firmatecknare och giltighetsperiod, per kommun och namnrymd."},{"titel":"Firmatecknarkontroll","text":"Vid skapande verifieras att utställaren är behörig firmatecknare för organisationen via LegalEntity-tjänsten."},{"titel":"Sökning","text":"Fullmakter söks fram med filter på bland annat parter och giltighet."},{"titel":"Detaljer med signeringsinformation","text":"Enskilda fullmakter hämtas med detaljer inklusive information om undertecknandet."},{"titel":"Mjuk borttagning","text":"Fullmakter tas bort genom tidsstämpling (soft delete) och finns kvar för spårbarhet."}],"beroenden":[{"name":"Party","version":"2.0","usage":"Översätter partyId till person- respektive organisationsnummer vid firmatecknarkontrollen."},{"name":"LegalEntity","version":"v2","usage":"Hämtar personens engagemang i organisationen och avgör om personen är behörig firmatecknare."}],"integrationer":[],"databas":"MariaDB med Flyway-migrationer; fullmakter lagras med parter, giltighetsperiod och mjuk borttagning","teknik":{"sprak":"Java 25","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.8), byggd med Maven","ovrigt":"Feign-klienter med circuit breakers via dept44"},"konfiguration":["application.yml med URL och OAuth2-klientuppgifter för Party och LegalEntity","MariaDB-anslutning; databasschemat versionshanteras med Flyway","Firmatecknarvalideringen kan stängas av via konfiguration, och en vitlista kan undanta specifika kombinationer av firmatecknare och fullmaktsgivare","Anrop görs per kommun och namnrymd – municipalityId och namespace ingår i API-vägarna"],"anteckningar":["Firmatecknarkontrollen ger 404 om personen saknar engagemang i organisationen och 403 om personen inte är firmatecknare – verifierat i LegalEntityService.","En konfigurerbar vitlista (firmatecknare → fullmaktsgivare) kan hoppa över valideringen för utpekade kombinationer, och hela valideringen kan stängas av via konfiguration – då loggas en varning.","Dubbletter avvisas med 409 om samma parter redan har en fullmakt med överlappande giltighetsperiod i samma kommun och namnrymd.","Borttagning är en mjuk radering där fältet deleted tidsstämplas – fullmakten ligger kvar i databasen.","OpenAPI-specens titel är api-myrepresentatives (pluralform) medan repot och README använder MyRepresentative."]},"hasSpec":true,"hasSbom":true,"sbom":{"komponenter":297,"licenser":14}}</script>
