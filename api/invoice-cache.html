arty-tjänsten, och svaren mappas tillbaka till rätt part."},{"titel":"Backup och återställning","text":"Fakturacachen säkerhetskopieras i egna batchjobb som kan återställa data om synkroniseringen misslyckas."}],"beroenden":[{"name":"Party","version":"1.0","usage":"Översätter partyId till person- eller organisationsnummer vid fakturasökning."}],"integrationer":["Raindance (ekonomisystem, skrivskyddad databasanslutning via SQL Server samt PDF-filer via Samba-filshare)"],"databas":"MariaDB med Flyway-migrationer för fakturacache och PDF-lagring; separat skrivskyddad SQL Server-anslutning mot Raindance","teknik":{"sprak":"Java 25","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.8), byggd med Maven","ovrigt":"Spring Batch för synkroniserings-, backup- och återställningsjobb med Shedlock-låsning, jcifs-ng för Samba-åtkomst, mssql-jdbc mot Raindance"},"konfiguration":["Två datakällor: MariaDB för cachen (Flyway-versionerad) och en skrivskyddad SQL Server-anslutning mot Raindance","Samba-anslutning för import av faktura-PDF:er, med eget cron-schema","Cron-scheman för batchjobben, bland annat timvis fakturasynkronisering","URL och anslutningsuppgifter för Party-tjänsten","Gräns för när cachade fakturor betraktas som inaktuella (raindance.invoice.outdated)"],"anteckningar":["Tjänsten läser Raindances databas direkt via en skrivskyddad SQL Server-datakälla i stället för att gå via något API – verifierat i RaindanceDataSourceConfig.","OCR-nummer för betalningspåminnelser genereras i koden med Luhn-kontrollsiffra utifrån Raindance-fälten – verifierat i util/OCR.java.","Egna hälsoindikatorer exponerar status för synkroniserings-, backup- och återställningsjobben via actuator.","Base64-innehåll i PDF-anrop maskeras i anropsloggarna via Logbook-filter."]},"hasSpec":true,"hasSbom":true,"sbom":{"komponenter":341,"licenser":15}}</script>
