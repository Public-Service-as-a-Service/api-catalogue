  <script type="application/json" id="page-data">{"api":{"repo":"api-service-document","namn":"Document","slug":"document","kategori":"Dokument och arkiv","status":null,"apiVersion":"3.0","ingress":"Central dokumenttjänst där kommunens applikationer lagrar, versionerar och söker dokument med tillhörande filer och metadata.","beskrivning":["Document är kommunens gemensamma lagringsplats för verksamhetsdokument. Applikationer skapar dokument med metadata och en eller flera filer, och varje dokument får ett unikt registreringsnummer på formatet ÅÅÅÅ-kommunkod-löpnummer, där löpnumret nollställs vid varje årsskifte.","Tjänsten är revisionsbaserad: en uppdatering av ett dokument skriver aldrig över befintlig data utan skapar i stället en ny revision, så att hela historiken kan läsas ut i efterhand. Dokument och enskilda filer kan markeras som konfidentiella, och läsande anrop måste uttryckligen begära att konfidentiellt material ska ingå för att få se det.","Utöver hämtning per registreringsnummer finns fritextsökning och parameterbaserad sökning med paginering, administration av dokumenttyper per kommun samt möjlighet att arkivmarkera dokument. Ändringar av konfidentialitet loggas till kommunens händelselogg via Eventlog."],"malgrupp":"Kommunens applikationer och verksamhetssystem","funktioner":[{"titel":"Dokumentlagring med metadata","text":"Dokument skapas med metadata och filer (upp till 60 MB per anrop) och får automatiskt ett unikt registreringsnummer per kommun och år."},{"titel":"Revisionshantering","text":"Varje uppdatering skapar en ny revision i stället för att skriva över – tidigare revisioner och deras filer kan läsas ut."},{"titel":"Konfidentialitet","text":"Dokument kan markeras som konfidentiella; läsande anrop får bara med konfidentiellt material om det uttryckligen begärs, och ändringar loggas till Eventlog."},{"titel":"Sökning","text":"Fritextsökning och parameterbaserad sökning med paginering och sortering, med möjlighet att begränsa till senaste revisionen."},{"titel":"Filhantering","text":"Filer kan läggas till, ersättas (samma filnamn ersätter befintlig fil) och laddas ner per dokument och revision."},{"titel":"Dokumenttyper","text":"Administrationsgränssnitt för att hantera vilka dokumenttyper som finns per kommun."}],"beroenden":[{"name":"Eventlog","version":"2.0","usage":"Loggar händelser, bland annat när konfidentialitetsinställningar på ett dokument ändras."}],"integrationer":[],"databas":"MariaDB med Flyway-migrationer; dokumentmetadata, revisioner och filernas binärdata lagras i databasen","teknik":{"sprak":"Java 25","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.8), byggd med Maven","ovrigt":"Feign-klient mot Eventlog, JPA/Hibernate för lagring, filinnehåll strömmas som BLOB:ar"},"konfiguration":["application.yml med URL och OAuth2-klientuppgifter för Eventlog-integrationen","MariaDB-anslutning; databasschemat versionshanteras med Flyway (avstängt som standard, aktiveras per miljö)","Maxstorlek för uppladdade filer är satt till 60 MB per fil och anrop","Anrop görs per kommun – municipalityId ingår i alla API-vägar"],"anteckningar":["Registreringsnummer genereras per kommun på formatet ÅÅÅÅ-kommunkod-löpnummer och sekvensen nollställs varje nytt år – verifierat i RegistrationNumberService.","Uppdateringar skapar alltid en ny revision i stället för att ändra befintlig post, med kommentaren \"Do not update existing entity, create a new revision instead\" i tjänstelagret.","Konfidentialitetsändringar slår igenom på dokumentets alla revisioner samtidigt och skickas som UPDATE-händelse till Eventlog.","Filinnehåll lagras som binärdata i databasen och strömmas direkt till HTTP-svaret vid nedladdning."]},"hasSpec":true,"hasSbom":true,"sbom":{"komponenter":256,"licenser":13}}</script>
