  <script type="application/json" id="page-data">{"api":{"repo":"api-service-manager-responsibility","namn":"ManagerResponsibility","slug":"manager-responsibility","kategori":"Parts- och kunddata","status":null,"apiVersion":"1.0","ingress":"Läsande API som svarar på vilka organisationer en chef ansvarar för – och vem som är chef för en viss organisation.","beskrivning":["ManagerResponsibility ger kommunens applikationer ett enhetligt sätt att slå upp chefers organisatoriska ansvar. API:et kan besvara frågan från två håll: vilka organisationer en viss person (chef) ansvarar för, och vilka chefer som ansvarar för en viss organisation. Uppslag kan göras på person-id, användarnamn eller organisations-id.","Tjänsten är helt läsande. Uppgifterna hämtas ur en externt ägd databasvy i kommunens datalager (SQL Server) som tjänsten aldrig ändrar i. Varje träff kontrolleras dessutom mot kommunens Employee-tjänst, så att bara chefer som faktiskt finns i medarbetarregistret returneras.","API:et används av applikationer som behöver veta chefsansvar, exempelvis för attestflöden, behörighetsstyrning och organisationsvyer."],"malgrupp":"Kommunens applikationer och verksamhetssystem","funktioner":[{"titel":"Chefsansvar per person","text":"Listar vilka organisationer en chef ansvarar för, uppslaget på person-id (UUID)."},{"titel":"Chefsansvar per användarnamn","text":"Samma uppslag men på chefens inloggningsnamn."},{"titel":"Chef per organisation","text":"Listar vilka chefer som ansvarar för en viss organisation, uppslaget på organisations-id."},{"titel":"Filtrering mot medarbetarregistret","text":"Alla svar filtreras mot Employee-tjänsten så att endast befintliga medarbetare returneras."},{"titel":"Cachade kontroller","text":"Kontrollen av att en medarbetare finns cachas för att avlasta Employee-tjänsten."}],"beroenden":[{"name":"Employee","version":"v2","usage":"Verifierar att en chef finns i medarbetarregistret innan resultat returneras."}],"integrationer":["Kommunens datalager (SQL Server) – externt ägd vy med chefers organisationsansvar, läses men ändras aldrig"],"databas":"SQL Server (externt ägd vy org_edw.vChefOrganisationer i datalagret); tjänsten läser enbart och har inga egna migrationer","teknik":{"sprak":"Java 25","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.8), byggd med Maven","ovrigt":"Caffeine-cache för medarbetarkontroller, Resilience4j-circuit breaker mot Employee"},"konfiguration":["application.yml med URL och OAuth2-klientuppgifter för Employee-tjänsten","JDBC-anslutning till datalagrets SQL Server; Hibernate validerar schemat men skapar inget (ddl-auto: none)","Caffeine-cachen för medarbetarkontroller är konfigurerad till 5 dagars livslängd och max 3000 poster","Anrop görs per kommun – municipalityId ingår i alla API-vägar"],"anteckningar":["Tjänsten läser en externt ägd SQL Server-vy (org_edw.vChefOrganisationer) med samtliga kolumner markerade som ej skrivbara – helt läsande åtkomst, verifierat i entiteten.","Alla resultat filtreras mot Employee-tjänsten; poster utan användarnamn sorteras också bort – verifierat i ManagerResponsibilityService.","Svaret på om en medarbetare finns cachas per kommun och användarnamn i upp till fem dagar (Caffeine) – verifierat i EmployeeIntegration.","Organisations-id kan matchas partiellt i en pipe-avgränsad lista av organisationer i vyn – verifierat i repositoryts frågor."]},"hasSpec":true,"hasSbom":true,"sbom":{"komponenter":251,"licenser":12}}</script>
