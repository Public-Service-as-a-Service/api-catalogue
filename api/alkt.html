],"databas":"Microsoft SQL Server (AlkT:s databas, strikt läsande anslutning, inga egna migrationer)","teknik":{"sprak":"Java 25 (via dept44-föräldern)","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.8), byggd med Maven","ovrigt":"Resilience4j (circuit breaker mot Party), Spring Cache för klartexter och legalId-uppslag"},"konfiguration":["application.yml med URL och OAuth2-klientuppgifter (client credentials) för Party-integrationen","SQL Server-anslutning mot AlkT-databasen, konfigurerad som read-only på både anslutningspools- och Hibernate-nivå","Tidszon Europe/Stockholm för JDBC och schema dbo som standardschema","Anrop görs per kommun – municipalityId ingår i alla API-vägar"],"anteckningar":["Databasanslutningen är genomgående läsande (read-only i både Hikari och Hibernate) – API:et skriver aldrig till AlkT.","Organisationer kan förekomma flera gånger i AlkT-databasen, därför returnerar ägaruppslaget en lista – dokumenterat och verifierat i tjänstelagret.","Uppslaget kräver att person-/organisationsnumret efter bindestreckskomplettering är exakt 11 tecken, annars returneras tom lista i stället för fel.","OpenAPI-specens info.title är \"api-alkt\"; specen ligger incheckad under src/test/resources/api/openapi.yaml."]},"hasSpec":true,"hasSbom":true,"sbom":{"komponenter":250,"licenser":12}}</script>
