  <script type="application/json" id="page-data">{"api":{"repo":"api-service-disturbance","namn":"Disturbance","slug":"disturbance","kategori":"Samhällsservice","status":null,"apiVersion":"5.0","ingress":"Hanterar driftstörningar i kommunal infrastruktur – el, fjärrvärme, vatten, fibernät med mera – och notifierar automatiskt berörda kunder via sms och e-post.","beskrivning":["Disturbance håller reda på driftstörningar i den infrastruktur kommunen och dess bolag levererar: elnät, elhandel, fjärrvärme, fjärrkyla, vatten, avfallshantering och fibernät (kategorin communication används av ServaNet). Verksamhetssystem registrerar en störning med berörda anläggningar och kunder, och API:et sköter resten – från registrering till avslut.","Invånare och företag kan prenumerera på störningsinformation. När en störning skapas, uppdateras eller avslutas skickar API:et automatiskt meddelanden via kommunens Messaging-API till alla berörda som har en prenumeration – med möjlighet att välja bort (opt-out) specifika kategorier eller anläggningar. Meddelandetexterna byggs från konfigurerbara mallar per kategori, med variabler för bland annat beskrivning och beräknad åtgärdstid.","Störningar kan sökas fram per kategori, status och berörd part, så att e-tjänster kan visa aktuell driftinformation för en specifik kund eller adress."],"malgrupp":"Kommunens applikationer och verksamhetssystem","funktioner":[{"titel":"Registrera störningar","text":"Skapa, uppdatera och avsluta driftstörningar med kategori, status, berörda anläggningar och planerade start- och sluttider."},{"titel":"Automatiska notifieringar","text":"Vid ny, uppdaterad eller avslutad störning skickas sms och e-post till berörda kunder via Messaging-API:et."},{"titel":"Prenumerationer med opt-out","text":"Parter kan prenumerera på störningsinformation och välja bort enskilda kategorier eller anläggningar."},{"titel":"Konfigurerbara meddelandemallar","text":"Ämne och text per kategori och händelsetyp (ny/uppdaterad/avslutad) med variabler som ersätts med störningens uppgifter."},{"titel":"Sökning och uppslag","text":"Hämta störningar per kategori, status eller berörd part (partyId) – till exempel för att visa driftinformation i en e-tjänst."},{"titel":"Automatisk gallring","text":"Ett nattligt jobb rensar avslutade störningar som är äldre än konfigurerat antal månader (standard 24)."}],"beroenden":[{"name":"Messaging","version":"7.9","usage":"Skickar sms och e-post till berörda kunder när störningar skapas, uppdateras eller avslutas."}],"integrationer":[],"databas":"MariaDB med Flyway-migrationer; lagrar störningar, berörda parter och prenumerationer med opt-out-inställningar","teknik":{"sprak":"Java 25","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.8), byggd med Maven","ovrigt":"Resilience4j (circuit breaker mot Messaging), ShedLock för schemalagda jobb, Apache Commons Text för mallhantering"},"konfiguration":["application.yaml med URL och OAuth2-klientuppgifter för Messaging-integrationen","MariaDB-anslutning; databasschemat versionshanteras med Flyway","Meddelandemallar per kategori (ämne, text, avsändare för sms och e-post) – notifiering kan slås av/på per kategori","Gallringsjobb (cron, kl. 02 varje natt) med ShedLock-låsning och konfigurerbar lagringstid","Anrop görs per kommun – municipalityId ingår i alla API-vägar"],"anteckningar":["Notifieringar skickas bara till parter som har en prenumeration utan matchande opt-out – tjänstelagret kontrollerar opt-out per kategori och anläggnings-id före varje utskick.","Meddelandemallarna i konfigurationen är i praktiken skrivna för ServaNet (fibernät) och kommunens energibolag – avsändarnamn och texter sätts per kategori i application.yaml.","Gallringsjobbet tar enbart bort störningar med status CLOSED som är äldre än konfigurerad tid; öppna och planerade störningar behålls oavsett ålder.","OpenAPI-specens info.title är \"api-disturbance\" (härledd ur applikationsnamnet); API:et exponeras som Disturbance."]},"
