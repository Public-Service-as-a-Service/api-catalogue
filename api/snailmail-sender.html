  <script type="application/json" id="page-data">{"api":{"repo":"api-service-snailmail-sender","namn":"SnailMailSender","slug":"snailmail-sender","kategori":"Kommunikation","status":null,"apiVersion":"3.3","ingress":"Samlar ihop fysiska brevförsändelser i batchar och lämnar över dem till tryck- och kuverteringsleverantör via filöverföring.","beskrivning":["SnailMailSender hanterar kommunens utskick av fysiska brev. Applikationer – i praktiken främst Messaging-API:et, som faller tillbaka på fysisk post när digital leverans inte är möjlig – skickar in brevförsändelser med mottagaradress och bilagor (breven som PDF). Försändelserna samlas per batch och avdelning i en databas.","När en batch är komplett triggas utskicket, och tjänsten skriver då ut brevunderlaget till en filyta som tryck- och kuverteringsleverantören hämtar ifrån: en Samba-utdelning och/eller en SFTP-server, beroende på vilka integrationer som är aktiverade. Underlaget består av brevens PDF-filer tillsammans med csv-filer med mottagaruppgifter, sorterade i mappar per avdelning.","En schemalagd bevakning fångar upp batchar som av någon anledning aldrig triggats: batchar äldre än en konfigurerbar tid (standard en timme) skickas automatiskt. Efter lyckad överlämning raderas batchen ur databasen."],"malgrupp":"Kommunens applikationer och verksamhetssystem","funktioner":[{"titel":"Ta emot brevförsändelser","text":"Försändelser med mottagaradress, avdelning och PDF-bilagor registreras och köas i en batch per utskick."},{"titel":"Skicka batch","text":"Ett separat anrop triggar överlämning av en hel batch till leverantören, varefter batchen raderas ur databasen."},{"titel":"Filleverans via Samba och/eller SFTP","text":"Brevunderlag (PDF:er och csv-filer med mottagaruppgifter) skrivs till en Samba-utdelning och/eller SFTP-server; integrationerna kan aktiveras oberoende av varandra."},{"titel":"Mappstruktur per avdelning","text":"Underlaget sorteras i mappar per batch och avdelning, med konfigurerbart mappnamn, så att leverantören kan hantera olika brevtyper olika."},{"titel":"Automatisk hantering av kvarglömda batchar","text":"En schemalagd kontroll (var tionde minut) skickar batchar som inte triggats inom konfigurerad tid."}],"beroenden":[],"integrationer":["Samba-filutdelning hos tryck- och kuverteringsleverantör","SFTP-server hos tryck- och kuverteringsleverantör"],"databas":"MariaDB med Flyway-migrationer; batchar, avdelningar och försändelser lagras tills batchen skickats och raderas därefter","teknik":{"sprak":"Java 25","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.8), byggd med Maven","ovrigt":"Spring Integration SFTP och JSch för SFTP, SMB-klient för Samba, ShedLock för schemaläggningslås, Resilience4j circuit breakers"},"konfiguration":["MariaDB-anslutning; databasschemat versionshanteras med Flyway","Samba-integration: aktivering, adress till utdelning och inloggningsuppgifter (integration.samba)","SFTP-integration: aktivering, server och inloggningsuppgifter (integration.sftp)","Schemalagd bevakning av ohanterade batchar: cron, ålder innan batch anses övergiven samt ShedLock-låstider","Anrop görs per kommun – municipalityId ingår i API-vägarna"],"anteckningar":["Inkommande försändelser serialiseras med en semafor som begränsar till ett samtidigt anrop, som skydd mot kapplöpning vid get-or-create av batch och avdelning – verifierat i SnailMailService.","Databasen körs med isolationsnivån READ_COMMITTED, och circuit breakers ignorerar DataIntegrityViolationException – båda medvetna val för att get-or-create-kapplöpningar ska läka i stället för att ge fel.","Om varken Samba- eller SFTP-integrationen är aktiv avvisas batch-utskick med ett fel – minst en leveransväg måste vara konfigurerad.","README anger Citizen som beroende tjänst, men koden innehåller ingen Citizen-integration (endast Samba, SFTP och databas) – koden är sanningskällan.","Bilagors base64-innehåll maskeras i anropsloggarna via Logbook-filter."]},"hasSpec":true,"hasSbom":true,"sbom":{"komponenter":273,"licenser":14}}</script>
