  <script type="application/json" id="page-data">{"api":{"repo":"api-service-contactsettings","namn":"ContactSettings","slug":"contactsettings","kategori":"Parts- och kunddata","status":null,"apiVersion":"2.0","ingress":"Register över invånares och företags valda kontaktvägar – används av kommunens meddelandetjänster för att avgöra hur en mottagare vill bli nådd.","beskrivning":["ContactSettings håller reda på hur invånare och företag vill bli kontaktade av kommunen. För varje part (partyId) lagras kontaktinställningar med en eller flera kanaler, till exempel sms-nummer och e-postadresser, tillsammans med ett alias per kanal. Andra tjänster – bland annat Messaging – slår upp inställningarna för att välja rätt kanal när ett meddelande ska skickas.","Utöver personliga inställningar stödjer tjänsten virtuella kontaktinställningar, som skapas av en riktig inställning och saknar egen part – de kan användas för till exempel funktionsbrevlådor. Tjänsten hanterar även delegat-relationer: en part kan delegera sin kontakthantering till en annan part, med filter som styr i vilka sammanhang delegeringen gäller.","Vid uppslag per part följer tjänsten delegeringskedjan och samlar in alla kontaktinställningar som matchar angivna filter, så att ett meddelande kan nå både parten själv och dess delegater. Det går också att söka fram vilka inställningar som pekar på en viss destination, till exempel ett telefonnummer eller en e-postadress."],"malgrupp":"Kommunens applikationer och verksamhetssystem","funktioner":[{"titel":"Kontaktinställningar per part","text":"Skapa, uppdatera, hämta och ta bort kontaktinställningar med kanaler (t.ex. sms och e-post) för invånare och företag."},{"titel":"Virtuella inställningar","text":"Kontaktinställningar utan egen part kan skapas under en riktig inställning, till exempel för funktionsbrevlådor."},{"titel":"Delegering","text":"En part kan delegera sin kontakthantering till en annan part; delegeringen förses med filter som styr när den gäller."},{"titel":"Uppslag med delegeringskedja","text":"Vid uppslag per part följs delegeringskedjan rekursivt och alla matchande kontaktinställningar samlas in."},{"titel":"Sökning på destination","text":"Hitta vilka kontaktinställningar som innehåller en viss destination, till exempel ett telefonnummer eller en e-postadress."}],"beroenden":[],"integrationer":[],"databas":"MariaDB med Flyway-migrationer; kontaktinställningar, kanaler, delegat-relationer och filter lagras här","teknik":{"sprak":"Java 25","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.8), byggd med Maven","ovrigt":"Ingen integration mot andra mikrotjänster – tjänsten är ett fristående register"},"konfiguration":["MariaDB-anslutning; databasschemat versionshanteras med Flyway","Inga beroende mikrotjänster behöver konfigureras","Anrop görs per kommun – municipalityId ingår i alla API-vägar"],"anteckningar":["Uppslaget per part följer delegeringskedjan rekursivt och skyddar mot cirkulära delegeringar med ett register över redan besökta inställningar – verifierat i ContactSettingsService.","När en riktig kontaktinställning tas bort raderas även dess virtuella barn och alla delegat-relationer i samma operation.","Tjänsten saknar helt integrationer mot andra mikrotjänster – den är ett rent register som andra tjänster (t.ex. Messaging) anropar.","Delegeringar kan förses med nyckel/värde-filter, och vid uppslag matchas frågans parametrar mot delegeringens filter."]},"hasSpec":true,"hasSbom":true,"sbom":{"komponenter":230,"licenser":13}}</script>
