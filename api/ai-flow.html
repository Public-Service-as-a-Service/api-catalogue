  <script type="application/json" id="page-data">{"api":{"repo":"api-service-ai-flow","namn":"AiFlow","slug":"ai-flow","kategori":"AI-tjänster","status":null,"apiVersion":"3.1","ingress":"Kör konfigurerbara AI-flöden i flera steg – till exempel tjänsteskrivelser, bildtolkning och transkribering – där varje steg utförs av en assistent på AI-plattformen Eneo.","beskrivning":["AiFlow låter kommunens applikationer köra fördefinierade AI-flöden som består av flera steg med beroenden sinsemellan. Flödesdefinitionerna lagras versionerade i databasen och beskriver vilka indata som krävs, vilka steg som ingår och vilken Eneo-assistent som utför varje steg. Med tjänsten följer bland annat flöden för tjänsteskrivelser, bildtolkning och transkribering av ljud.","En anropare skapar en session för ett flöde, lämnar in indata som text eller uppladdade filer och startar sedan hela flödet eller enskilda steg. Text ur PDF- och Word-dokument extraheras automatiskt, och filer laddas upp till Eneo som kunskapsunderlag för assistenterna. Steg körs asynkront och sessionens tillstånd kan följas tills alla steg är klara.","Resultatet kan hämtas per steg eller sammanställas till ett färdigt dokument genom Templating-API:et, som renderar sessionens utdata med en angiven dokumentmall."],"malgrupp":"Kommunens applikationer och verksamhetssystem","funktioner":[{"titel":"Versionerade flödesdefinitioner","text":"Flöden skapas, versioneras och tas bort via API:et; definitionerna valideras bland annat mot cirkulära stegberoenden."},{"titel":"Sessioner med indata","text":"En session skapas per flödeskörning och matas med textindata eller uppladdade filer; obligatoriska indata kontrolleras innan körning."},{"titel":"Stegvis eller hel körning","text":"Hela flödet eller enskilda steg kan köras, med möjlighet att automatiskt köra de steg ett steg beror på."},{"titel":"Dokumentextraktion","text":"Text extraheras ur PDF (PDFBox) och Word-dokument (Apache POI) innan innehållet skickas till assistenterna."},{"titel":"Rendering till dokument","text":"Sessionens utdata kan renderas till ett färdigt dokument via Templating-API:et med angiven mall."},{"titel":"Automatisk sessionstädning","text":"Ett schemalagt jobb tar bort sessioner som passerat flödets TTL."}],"beroenden":[{"name":"Templating","version":"2.0","usage":"Renderar sessionens utdata till ett färdigt dokument utifrån en dokumentmall."}],"integrationer":["Eneo (kommunens AI-plattform) – assistenter som utför flödesstegen samt lagring av uppladdade underlagsfiler"],"databas":"MariaDB med Flyway-migrationer; flödesdefinitioner lagras versionerade (sessioner hålls däremot i minnet)","teknik":{"sprak":"Java 25","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.8), byggd med Maven","ovrigt":"Apache PDFBox och Apache POI för dokumentextraktion, dept44-scheduler med ShedLock för sessionstädning, asynkron stegexekvering"},"konfiguration":["application.yml med URL och OAuth2-klientuppgifter för Eneo och Templating","Polling av pågående steg: intervall och maxtid (app-polling, standard 2 s respektive 180 s)","Schemaläggning av sessionstädning (stale-session-reaper): cron och ShedLock-låstider","MariaDB-anslutning; databasschemat versionshanteras med Flyway","Maxstorlek för uppladdade filer (25 MB per fil som standard)"],"anteckningar":["Sessioner lagras enbart i minnet (ConcurrentHashMap) och överlever inte en omstart; endast flödesdefinitionerna persisteras i databasen – verifierat i tjänstelagret.","Sessioner städas av ett schemalagt jobb utifrån en TTL som definieras per flöde, inte globalt.","Flödesvalidatorn stoppar definitioner med cirkulära beroenden mellan steg.","Base64-innehåll i filuppladdningar maskeras i anropsloggarna via Logbook-filter.","Repot innehåller färdiga flödesdefinitioner för tjänsteskrivelse, bildtolkare och transkriberare under src/main/resources/flows."]},"hasSpec":true,"hasSbom":true,"sbom":{"komponenter":277,"licenser":13}}</script>
