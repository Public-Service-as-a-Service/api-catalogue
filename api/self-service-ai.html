  <script type="application/json" id="page-data">{"api":{"repo":"api-service-self-service-ai","namn":"SelfServiceAi","slug":"self-service-ai","kategori":"AI-tjänster","status":null,"apiVersion":"2.0","ingress":"Driver en AI-assistent för kundservice i självbetjäningskanaler – assistenten laddas med kundens avtal, fakturor och mätvärden och kan sedan svara på frågor om kundens engagemang.","beskrivning":["SelfServiceAi gör det möjligt för kommunkoncernens självbetjäningskanaler att erbjuda en AI-assistent som kan svara på frågor om kundens egna engagemang. När en session skapas hämtar tjänsten kundens installerade bas (abonnemang och anläggningar) och berikar den med avtal, fakturor och mätdata från kommunens övriga API:er.","Det sammanställda kundunderlaget laddas upp som en fil till AI-plattformen Eneo och kopplas till assistentsessionen. Uppladdningen sker asynkront – anroparen kan följa initieringen via en statusresurs (PENDING/READY/FAILED) och börjar ställa frågor när sessionen är klar. Frågor och följdfrågor besvaras av Eneo-assistenten med kundunderlaget som kontext.","Sessioner städas löpande: när en session avslutas, eller när ett schemalagt jobb hittar inaktiva sessioner, sparas chatthistoriken till kundservicesystemet Lime innan sessionen och de uppladdade filerna tas bort från Eneo."],"malgrupp":"Kommunkoncernens självbetjäningskanaler och kundservicesystem","funktioner":[{"titel":"Assistentsessioner","text":"Skapar en session hos AI-plattformen Eneo för en angiven kund (partyId) och håller ordning på sessionens tillstånd."},{"titel":"Automatiskt kundunderlag","text":"Hämtar kundens installerade bas och berikar den med avtal, fakturor och mätdata; underlaget laddas upp till Eneo som kontext för assistenten."},{"titel":"Frågor och följdfrågor","text":"Vidarebefordrar kundens frågor till Eneo-assistenten med sessionens filer som kunskapsunderlag."},{"titel":"Initieringsstatus","text":"Statusresurs som visar om sessionen är under uppbyggnad, klar eller misslyckad, eftersom underlaget byggs asynkront."},{"titel":"Chatthistorik till Lime","text":"Innan en session tas bort sparas hela chatthistoriken till kundservicesystemet Lime."},{"titel":"Automatisk städning","text":"Ett schemalagt jobb tar bort sessioner som varit inaktiva längre än en konfigurerbar tröskel (standard 60 minuter) inklusive uppladdade filer."}],"beroenden":[{"name":"Agreement","version":"4.0","usage":"Hämtar kundens avtal för att berika kundunderlaget."},{"name":"InstalledBase","version":"3.0","usage":"Hämtar kundens installerade bas – grunden i det underlag som laddas upp till assistenten."},{"name":"Invoices","version":"9.5","usage":"Hämtar kundens fakturor för att berika kundunderlaget."},{"name":"MeasurementData","version":"2.0","usage":"Hämtar mätvärden för kundens anläggningar."}],"integrationer":["Eneo (kommunens AI-plattform) – sessioner, frågor och filuppladdning","Lime (kundservicesystem) – chatthistorik sparas innan sessioner tas bort"],"databas":"MariaDB med Flyway-migrationer; sessioner, kopplade filer och historik lagras för statusuppföljning och städning","teknik":{"sprak":"Java 25","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.8), byggd med Maven","ovrigt":"Resilience4j (circuit breakers mot samtliga integrationer), dept44-scheduler med ShedLock för schemalagd sessionstädning, asynkron initiering med @Async"},"konfiguration":["application.yml med URL och OAuth2-klientuppgifter (client_credentials) för Eneo, Agreement, InstalledBase, Invoices, Lime och MeasurementData","Eneo-assistentens id (assistant-id) samt organisationsnummer för fakturauppslag konfigureras per miljö","Schemaläggning av sessionstädning: cron, inaktivitetströskel och ShedLock-låstider","MariaDB-anslutning; databasschemat versionshanteras med Flyway","Anrop görs per kommun – municipalityId ingår i alla API-vägar"],"anteckningar":["Kundunderlaget byggs asynkront efter att sessionen skapats; berikningen från Agreement, Invoices och MeasurementData är individuellt felskyddad så att ett fel i en källa inte stoppar de övriga – verifierat i tjänstelagret.","Om en fil laddats upp till Eneo men inte kan kopplas till sessionen (t.ex. för att sessionen hunnit tas bort) raderas filen ur Eneo igen, så att inga föräldralösa filer lämnas kvar.","En session tas bara bort om chatthistoriken först kunnat sparas till Lime; misslyckas historiksparningen lämnas sessionen kvar och rapporteras via schemaläggarens hälsokontroll.","Utan träff i installerad bas markeras sessionen som misslyckad med förklarande status i stället för att assistenten startas utan underlag."]},"hasSpec":true,"hasSbom":true,"sbom":{"komponenter":262,"licenser":13}}</script>
