  <script type="application/json" id="page-data">{"api":{"repo":"api-service-postportalservice","namn":"Postportalservice","slug":"postportalservice","kategori":"Kommunikation","status":null,"apiVersion":"1.9","ingress":"Backend för kommunens postportal – handläggare skickar brev, rekommenderade brev, sms och signeringsförfrågningar till invånare och företag, med automatiskt kanalval och uppföljning.","beskrivning":["Postportalservice är tjänsten bakom kommunens postportal, där handläggare skickar utskick till invånare och företag utan att själva behöva veta vilken kanal som fungerar för varje mottagare. Tjänsten stödjer vanliga brev (digital brevlåda med automatisk reservväg till fysisk post via Messaging), digitala rekommenderade brev via Kivra, sms samt dokument som ska signeras elektroniskt.","Före utskick kan portalen göra en förhandskontroll (precheck) av mottagarlistan: tjänsten översätter partyId till person- eller organisationsnummer, hämtar folkbokföringsuppgifter och avgör per mottagare om leveransen kan ske digitalt eller som fysisk post. Minderåriga och personer som inte är folkbokförda i Sverige sorteras ut som olämpliga respektive olevererbara mottagare. Mottagarlistor kan även läsas in från CSV-filer, både för brev och sms.","Vilka avdelningar som får skicka, och med vilka avsändaruppgifter, styrs av MessagingSettings-tjänsten. Varje utskick registreras per användare och avdelning, vilket ger historik per handläggare samt statistik per avdelning. För signeringsärenden tar tjänsten emot statushändelser från e-signeringstjänsten och tillhandahåller signerade dokument, signeringsinformation och kvitton."],"malgrupp":"Kommunens applikationer och verksamhetssystem","funktioner":[{"titel":"Brev med automatiskt kanalval","text":"Brev levereras till digital brevlåda när mottagaren kan nås digitalt och skickas annars som fysisk post, via Messaging-tjänsten."},{"titel":"Digitala rekommenderade brev","text":"Rekommenderade brev skickas via Kivra genom DigitalRegisteredLetter-tjänsten, med signeringsinformation och kvitto."},{"titel":"Sms-utskick","text":"Sms till enskilda mottagare eller massutskick via CSV-fil med validering av telefonnummer."},{"titel":"Elektronisk signering","text":"Dokument skickas för signering via e-signeringstjänsten; statushändelser tas emot och signerat dokument kan hämtas."},{"titel":"Förhandskontroll av mottagare","text":"Precheck avgör per mottagare om leverans kan ske digitalt eller per post, och sorterar ut minderåriga och personer utan svensk folkbokföring."},{"titel":"Historik och statistik","text":"Utskick registreras per användare och avdelning, med meddelandehistorik per handläggare och statistik per avdelning."}],"beroenden":[{"name":"Messaging","version":"7.11","usage":"Skickar brev (digital brevlåda med reservväg till fysisk post) och sms."},{"name":"DigitalRegisteredLetter","version":"3.1","usage":"Skickar digitala rekommenderade brev via Kivra och hämtar signeringsinformation och kvitton."},{"name":"ESigning","version":"2.1","usage":"Startar och avbryter elektroniska signeringsärenden för uppladdade dokument."},{"name":"MessagingSettings","version":"3.0","usage":"Hämtar avdelningarnas avsändaruppgifter och inställningar, t.ex. sms-avsändare och leveransmetod för fysisk post."},{"name":"Party","version":"2.1","usage":"Översätter partyId till person- eller organisationsnummer."},{"name":"Citizen","version":"3.0","usage":"Hämtar folkbokföringsuppgifter, bland annat adresser och ålder, för förhandskontrollen."},{"name":"LegalEntity","version":"v2","usage":"Hämtar uppgifter om företag och organisationer vid förhandskontroll av organisationsmottagare."}],"integrationer":["Kivra (via DigitalRegisteredLetter)"],"databas":"MariaDB med Flyway-migrationer; utskick, mottagare, bilagor, signeringsärenden, användare och avdelningar lagras här","teknik":{"sprak":"Java 25","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.8), byggd med Maven","ovrigt":"Dedikerad trådpool (deliveryExecutor) för parallell leverans till många mottagare"},"konfiguration":["application.yml med URL och OAuth2-klientuppgifter för Messaging, DigitalRegisteredLetter, ESigning, MessagingSettings, Party, Citizen och LegalEntity","MariaDB-anslutning; databasschemat versionshanteras med Flyway","Trådpool för leverans konfigureras separat (antal trådar och köstorlek)","Anropande handläggare identifieras via headern X-Sent-By (dept44 Identifier), som valideras och lagras per utskick","Anrop görs per kommun – municipalityId ingår i alla API-vägar"],"anteckningar":["Förhandskontrollen kategoriserar mottagarna i digital brevlåda, fysisk post, olämpliga (minderåriga) och olevererbara (ej folkbokförda i Sverige) – verifierat i PrecheckService.","Leveransen till mottagarna körs parallellt i en dedikerad trådpool (DELIVERY_EXECUTOR) i stället för sekventiellt – verifierat i MessageService.","Varje utskick kräver headern X-Sent-By; avsändaren registreras per meddelande och används för historikvyn per användare.","Statushändelser för signeringsärenden tas emot via en callback-endpoint (POST /events/{messageId}) från e-signeringstjänsten och uppdaterar ärendets status till exempelvis SIGNED eller CANCELLED."]},"hasSpec":true,"hasSbom":true,"sbom":{"komponenter":260,"licenser":13}}</script>
