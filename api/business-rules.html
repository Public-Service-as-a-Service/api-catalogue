  <script type="application/json" id="page-data">{"api":{"repo":"api-service-business-rules","namn":"BusinessRules","slug":"business-rules","kategori":"Ärendehantering","status":null,"apiVersion":"2.0","ingress":"Regelmotor som utvärderar verksamhetsregler – i dag för parkeringstillstånd för rörelsehindrade – och ger ärendehandläggningen ett maskinellt beslutsunderlag.","beskrivning":["Vid myndighetsutövning ska samma regler tillämpas lika för alla. BusinessRules samlar verksamhetsreglerna i en central regelmotor: anroparen skickar in fakta om ett ärende och får tillbaka ett utvärderat resultat per regel, med motivering. Det gör att ärendeprocesser kan automatisera bedömningar utan att reglerna dubbleras i varje system.","Det regelområde (context) som är implementerat är parkeringstillstånd för rörelsehindrade. Reglerna täcker nyansökan och förnyelse för förare respektive passagerare samt förlorat tillstånd, och bygger på kriterier som gångförmåga, läkarintyg, passfoto, varaktighet, signatur, polisanmälans format och återkommande förluster.","Regelmotorn väljs per kommun och regelområde: Sundsvall och Ånge har egna motorer för parkeringstillstånd, där Ånges variant kör automatiserade regler. Varje regel avgör själv om den är tillämplig på de inskickade fakta – icke tillämpliga regler rapporteras som sådana i svaret i stället för att utelämnas."],"malgrupp":"Kommunens ärendehanteringssystem och automatiserade processer","funktioner":[{"titel":"Regelutvärdering","text":"Tar emot ett regelområde och en uppsättning fakta och returnerar resultat per regel: PASS, FAIL, VALIDATION_ERROR eller NOT_APPLICABLE, med beskrivningar."},{"titel":"Parkeringstillstånd","text":"Regler för nyansökan och förnyelse för förare och passagerare samt förlorat tillstånd."},{"titel":"Kriteriebaserade bedömningar","text":"Reglerna byggs av återanvändbara kriterier, t.ex. gångförmåga, läkarintyg, passfoto, varaktighet och återkommande förluster."},{"titel":"Kommunspecifika motorer","text":"Regelmotor väljs utifrån kommun och regelområde – Sundsvall och Ånge har egna motorer, där Ånges kör automatiserade regler."},{"titel":"Uppslag av befintliga tillstånd","text":"Kriterier som rör aktiva, utgående eller förlorade tillstånd kontrolleras mot tillgångstjänsten PartyAssets."}],"beroenden":[{"name":"PartyAssets","version":"5.0","usage":"Slår upp personens befintliga parkeringstillstånd för kriterier om aktiva tillstånd, utgående tillstånd och återkommande förluster."}],"integrationer":[],"databas":null,"teknik":{"sprak":"Java 25","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.8), byggd med Maven","ovrigt":"Egenutvecklad regelmotor (Rule/Criteria-abstraktioner), Feign-klient genererad ur PartyAssets-specifikationen, Guava"},"konfiguration":["application.yml med URL och OAuth2-klientuppgifter för PartyAssets","Ingen databas – regler och kriterier är implementerade i kod","Anrop görs per kommun – municipalityId ingår i API-vägen och avgör vilken regelmotor som används"],"anteckningar":["API:et består av en enda resurs, POST /{municipalityId}/engine; regelmotor väljs på kommun och regelområde och saknas en motor för kombinationen svarar tjänsten 404 – verifierat i RuleEngineService.","Varje regel prövar först om den är tillämplig på de inskickade fakta; icke tillämpliga regler redovisas som NOT_APPLICABLE i svaret i stället för att utelämnas – verifierat i ParkingPermitRuleEngine.","Kommun-id:na är kodade i tjänsten: Sundsvall (2281) med fullständig regeluppsättning och Ånge (2260) med automatiserade regler.","Kriterierna för aktiva och utgående tillstånd samt återkommande förluster hämtar personens tillgångar från PartyAssets – regelmotorn är i övrigt självständig."]},"hasSpec":true,"hasSbom":true,"sbom":{"komponenter":221,"licenser":10}}</script>
