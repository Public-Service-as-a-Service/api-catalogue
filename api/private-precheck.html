  <script type="application/json" id="page-data">{"api":{"repo":"api-service-private-precheck","namn":"PrivatePreCheck","slug":"private-precheck","kategori":"Samhällsservice","status":null,"apiVersion":"0.5","ingress":"Förkontroll för privatpersoner: svarar på om en person är folkbokförd i kommunen och vilka tillstånd personen redan har – till exempel innan en ansökan om parkeringstillstånd påbörjas.","beskrivning":["PrivatePreCheck används som förkontroll i e-tjänster riktade till privatpersoner. Med ett enda anrop får e-tjänsten veta dels om personen är folkbokförd i kommunen, dels vilka tillstånd (till exempel parkeringstillstånd) personen redan har registrerade – och om ett nytt kan beställas.","Kontrollen bygger på två av kommunens mikrotjänster: Citizen, som ger personens folkbokföringsuppgifter, och PartyAssets, som listar personens registrerade tillgångar. Folkbokföringskontrollen görs genom att personens folkbokföringsadress jämförs med angivet kommun-id.","Resultatet kan filtreras på tillståndstyp via en frågeparameter, så att e-tjänsten bara får svar för den tillståndstyp ansökan gäller."],"malgrupp":"Kommunens applikationer och verksamhetssystem","funktioner":[{"titel":"Folkbokföringskontroll","text":"Avgör om personen är folkbokförd i angiven kommun genom uppslag av folkbokföringsadressen via Citizen."},{"titel":"Tillståndsöversikt","text":"Listar personens registrerade tillstånd från PartyAssets, med typ, status och orsak."},{"titel":"Beställningsbarhet","text":"Varje tillstånd markeras med om det kan beställas på nytt utifrån dess status."},{"titel":"Filtrering på tillståndstyp","text":"Frågeparametern assetType begränsar svaret till en viss tillståndstyp, till exempel PARKING_PERMIT."}],"beroenden":[{"name":"Citizen","version":"v3","usage":"Hämtar personens folkbokföringsuppgifter för kontroll av kommuntillhörighet."},{"name":"PartyAssets","version":"2.1","usage":"Listar personens registrerade tillgångar/tillstånd som underlag för förkontrollen."}],"integrationer":[],"databas":null,"teknik":{"sprak":"Java 25 (via dept44-föräldern)","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.8), byggd med Maven","ovrigt":"OpenFeign-klienter mot Citizen och PartyAssets"},"konfiguration":["application.yml med URL och OAuth2-klientuppgifter (client credentials) för Citizen- och PartyAssets-integrationerna","Timeout-inställningar per integration (connect 5 s, read 30 s)","Ingen databas – tjänsten är helt tillståndslös","municipalityId anges som frågeparameter i stället för i API-vägen"],"anteckningar":["Ett tillstånd markeras som beställningsbart (orderable) endast när dess status är EXPIRED – samtidigt hämtar tjänstelagret enbart tillgångar med status ACTIVE från PartyAssets, så aktiva tillstånd blir aldrig beställningsbara i svaret.","Folkbokföringskontrollen jämför enbart adresser av typen POPULATION_REGISTRATION_ADDRESS med angivet kommun-id – verifierat i PreCheckUtil.","API-versionen är 0.5 och API-ytan består av en enda endpoint (GET /precheck/{partyId}) – tjänsten är i ett tidigt skede.","Trots namnlikheten är detta inte samma tjänst som den arkiverade PreCheck (adressbaserad leveranskontroll) – denna gäller personbundna tillstånd."]},"hasSpec":true,"hasSbom":true,"sbom":{"komponenter":221,"licenser":10}}</script>
