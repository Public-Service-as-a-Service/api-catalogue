  <script type="application/json" id="page-data">{"api":{"repo":"api-service-configuration","namn":"Configuration","slug":"configuration","kategori":"Utvecklingsverktyg","status":null,"apiVersion":"1.0","ingress":"Enkel lagringstjänst för applikationskonfiguration – ger kommunens webbapplikationer ett standardiserat sätt att spara och hämta inställningar som nyckel-värdepar.","beskrivning":["Configuration ersätter ad hoc-lösningar för applikationsinställningar med ett gemensamt, återanvändbart API. Frontendteam kan lagra och hämta konfiguration för sina applikationer – till exempel funktionsflaggor eller rollistor – utan att varje applikation behöver en egen lagringslösning.","Varje konfiguration identifieras av kombinationen kommun, namespace och applikation, och innehåller konfigurationsdata som nyckel-värdepar där varje nyckel kan ha flera värden. En konfiguration kan skapas, hämtas, uppdateras och tas bort, och alla konfigurationer inom ett namespace kan listas i ett anrop.","Tjänsten är medvetet enkel: en renodlad CRUD-tjänst utan beroenden till andra mikrotjänster, med unikhetskrav som hindrar att samma applikation får dubbla konfigurationer inom ett namespace."],"malgrupp":"Kommunens applikationer och verksamhetssystem","funktioner":[{"titel":"Hämta konfiguration","text":"Hämta en applikations konfiguration som nyckel-värdepar, eller alla konfigurationer inom ett namespace."},{"titel":"Skapa konfiguration","text":"Registrera konfiguration per kommun, namespace och applikation; dubbletter avvisas med 409 Conflict."},{"titel":"Uppdatera och ta bort","text":"Konfigurationen kan uppdateras i sin helhet eller tas bort; kopplade nyckel-värdepar följer med automatiskt."},{"titel":"Flervärdesnycklar","text":"Varje konfigurationsnyckel kan ha flera värden, till exempel en lista av roller."}],"beroenden":[],"integrationer":[],"databas":"MariaDB med Flyway-migrationer; lagrar konfigurationer och deras nyckel-värdepar med unikhetskrav per kommun, applikation och namespace","teknik":{"sprak":"Java 25 (via dept44-föräldern)","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.8), byggd med Maven","ovrigt":"Renodlad CRUD-tjänst utan externa integrationer"},"konfiguration":["MariaDB-anslutning; databasschemat versionshanteras med Flyway","Inga integrations- eller OAuth2-klientinställningar behövs – tjänsten saknar beroenden till andra tjänster","Anrop görs per kommun – municipalityId ingår i alla API-vägar tillsammans med namespace"],"anteckningar":["Kombinationen kommun, applikation och namespace är unik – både i tjänstelagret (kontroll med 409 Conflict) och som unikhetskrav i databasschemat.","Konfigurationsvärden lagras som separata rader (upp till 2000 tecken per värde) med kaskadradering – tas konfigurationen bort försvinner alla dess nyckel-värdepar.","Tjänsten har inga beroenden till andra mikrotjänster och gör inga externa anrop – API-ytan är två resursvägar.","OpenAPI-specens info.title är \"api-service-configuration\" (härledd ur applikationsnamnet)."]},"hasSpec":true,"hasSbom":true,"sbom":{"komponenter":230,"licenser":13}}</script>
