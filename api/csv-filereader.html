  <script type="application/json" id="page-data">{"api":{"repo":"api-service-csv-filereader","namn":"CsvFileReader","slug":"csv-filereader","kategori":"Integration","status":null,"apiVersion":"1.0","ingress":"Schemalagd tjänst som hämtar CSV-filer med organisations- och medarbetardata via SFTP och läser in dem i en databas som andra tjänster kan använda.","beskrivning":["CsvFileReader är en bakgrundstjänst som håller en databas med kommunens organisationsträd och medarbetare uppdaterad. Källsystemet exporterar två CSV-filer – en med organisationsenheter och en med medarbetare – som tjänsten hämtar från en SFTP-server, läser in och skriver till MariaDB.","Importen körs varje timme och dessutom direkt vid uppstart. Raderna läses in i konfigurerbara batchar och skrivs med upsert-logik: befintliga poster uppdateras, nya läggs till. Medarbetare som inte längre finns med i filen markeras som inaktiva i stället för att raderas, så att historiken bevaras. Bearbetade filer flyttas till en processed-katalog och tidigare bearbetade filer rensas.","Tjänsten exponerar inget eget REST-API – dess uppgift är att fylla databasen, som i sin tur används av andra tjänster som behöver aktuell organisations- och medarbetarinformation."],"malgrupp":"Kommunens interna tjänster som behöver aktuell organisations- och medarbetardata","funktioner":[{"titel":"SFTP-hämtning","text":"Hämtar organisations- och medarbetarfiler från en SFTP-server till en inkommande-katalog."},{"titel":"CSV-inläsning","text":"Läser semikolonseparerade CSV-filer i teckenkodningen Windows-1252 med Jacksons CSV-stöd."},{"titel":"Batchvis upsert","text":"Skriver rader i konfigurerbara batchar till MariaDB; befintliga poster uppdateras och nya läggs till (ON DUPLICATE KEY UPDATE)."},{"titel":"Inaktivering i stället för radering","text":"Medarbetare som inte uppdaterats under en importkörning markeras som inaktiva, så att borttagna anställningar syns utan att data raderas."},{"titel":"Schemaläggning med lås","text":"Importjobben körs varje timme med ShedLock-lås (dept44-scheduler) så att endast en instans kör åt gången, samt direkt vid uppstart."}],"beroenden":[],"integrationer":["SFTP-server där källsystemet lämnar CSV-exporterna"],"databas":"MariaDB; tabeller för organisation och medarbetare som fylls av importen (baseline-skript finns i repot, Flyway är avstängt i konfigurationen)","teknik":{"sprak":"Java 25","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.3), byggd med Maven","ovrigt":"Jackson dataformat-csv för CSV-parsning, Apache Commons VFS2 + JSch för SFTP, JdbcTemplate med batchuppdateringar, dept44-scheduler med ShedLock"},"konfiguration":["SFTP-uppgifter (värd, användarnamn, lösenord) via miljövariabler","Förväntade filnamn för organisations- respektive medarbetarfilen samt kataloger för inkommande, bearbetade och misslyckade filer","Batchstorlekar för organisations- och medarbetarimporten","MariaDB-anslutning via miljövariabler; cron-uttryck och ShedLock-tider för importjobben"],"anteckningar":["Tjänsten saknar REST-API och därmed OpenAPI-specifikation – den består enbart av schemalagda importjobb och startas även av en CommandLineRunner vid uppstart.","Efter varje medarbetarimport sätts alla medarbetare som inte uppdaterats under körningen till inaktiva – verifierat i EmployeeImportService.","Medarbetare vars organisationsenhet saknas i organisationstabellen hanteras särskilt: org-id:n kontrolleras mot databasen batch för batch – verifierat i determineUnknownOrgIds.","Ett Flyway-baseline-skript finns under db/migration, men Flyway är avstängt i application.yml – databasschemat förutsätts alltså vara etablerat i förväg.","README:s kloningsanvisning pekar på organisationen Public-Service-as-a-Service, medan koden publiceras under Sundsvallskommun – repot delas mellan organisationerna."]},"hasSpec":false,"hasSbom":true,"sbom":{"komponenter":220,"licenser":13}}</script>
