  <script type="application/json" id="page-data">{"api":{"repo":"api-service-invoices","namn":"Invoices","slug":"invoices","kategori":"Ekonomi och fakturering","status":null,"apiVersion":"9.5","ingress":"Samlad ingång för fakturauppgifter – hämtar kommersiella fakturor och offentliga förvaltningsfakturor från underliggande källor och levererar dem i ett gemensamt format.","beskrivning":["Invoices ger kommunens applikationer en gemensam väg till fakturainformation, oavsett var fakturorna kommer ifrån. API:et delar upp fakturor i två ursprung: kommersiella fakturor (till exempel el- och fjärrvärmefakturor från de kommunala bolagen) som hämtas via DataWarehouseReader, och offentliga förvaltningsfakturor som hämtas från InvoiceCache.","Anroparen söker med partyId, fakturanummer, OCR-nummer, datumintervall eller anläggnings-id, och tjänsten översätter parametrarna till rätt fråga mot rätt källa. För kommersiella fakturor löses partyId först upp till kundnummer via kundengagemang i DataWarehouseReader. Fakturor kan även hämtas som PDF via InvoiceCache.","Tjänsten är ett rent aggregerings-API utan egen datalagring – all information hämtas i realtid från de underliggande tjänsterna, med circuit breakers som skydd mot störningar."],"malgrupp":"Kommunens applikationer och verksamhetssystem","funktioner":[{"titel":"Fakturasökning per ursprung","text":"Sökning av fakturor uppdelat på kommersiella fakturor och offentliga förvaltningsfakturor, med gemensamt svarsformat."},{"titel":"Sökning via part","text":"PartyId löses upp till kundnummer via kundengagemang i DataWarehouseReader innan kommersiella fakturor hämtas."},{"titel":"Fakturadetaljer","text":"Detaljerade fakturarader för en enskild kommersiell faktura."},{"titel":"Faktura-PDF","text":"Hämtning och nedladdning av fakturor i PDF-format via InvoiceCache."},{"titel":"Kundfakturalistor","text":"Fakturor för en eller flera kunder med filtrering på period, status och anläggning samt paginering och sortering."}],"beroenden":[{"name":"DataWarehouseReader","version":"5.7","usage":"Hämtar kommersiella fakturor, fakturadetaljer och kundengagemang ur kommunkoncernens datalager."},{"name":"InvoiceCache","version":"4.1","usage":"Hämtar offentliga förvaltningsfakturor och faktura-PDF:er."}],"integrationer":[],"databas":null,"teknik":{"sprak":"Java 25","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.8), byggd med Maven","ovrigt":"Resilience4j (circuit breakers mot båda beroende tjänsterna), Logbook för anropsloggning"},"konfiguration":["application.yml med URL och OAuth2-klientuppgifter för DataWarehouseReader och InvoiceCache","Konfigurerbara timeout-värden per integration","Ingen databas – tjänsten är tillståndslös och hämtar allt i realtid","Anrop görs per kommun – municipalityId ingår i API-vägarna"],"anteckningar":["Vid sökning av kommersiella fakturor på partyId hämtas först kundengagemang från DataWarehouseReader; saknas engagemang svarar tjänsten 404 – verifierat i InvoicesService.","Tjänsten saknar helt egen datalagring – den mappar och vidarebefordrar frågor till DataWarehouseReader respektive InvoiceCache.","Den äldre sökvägen för kommersiella fakturor är markerad som utfasad i koden till förmån för kundfakturalistan (getInvoicesForCustomer).","PDF-innehåll maskeras i anropsloggarna via Logbook-filter, och 4xx-svar från de beroende tjänsterna öppnar inte circuit breakern."]},"hasSpec":true,"hasSbom":true,"sbom":{"komponenter":223,"licenser":11}}</script>
