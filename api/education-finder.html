  <script type="application/json" id="page-data">{"api":{"repo":"api-service-education-finder","namn":"EducationFinder","slug":"education-finder","kategori":"Utbildning","status":null,"apiVersion":"3.1","ingress":"Sök- och statistik-API för kommunens vuxenutbildningsutbud – kurser kan filtreras på kategori, nivå, studieort med mera och sammanställas till statistik.","beskrivning":["EducationFinder gör kommunens utbud av vuxenutbildning sökbart för e-tjänster och webbplatser. API:et exponerar kurser med uppgifter som namn, kategori, nivå, omfattning, poäng, studieort, anordnare, start- och slutdatum, antal platser och sista ansökningsdag, med fritextsökning, filtrering, sortering och paginering.","För varje filterattribut (kategori, underkategori, nivå, anordnare, omfattning, poäng, studieort) kan giltiga värden hämtas dynamiskt – de tas fram ur databasens faktiska innehåll och cachelagras i ett dygn. Kategorier och underkategorier härleds ur databasens sammansatta kategorifält.","Statistikdelen sammanställer pågående, planerade och avslutade kurser samt tillgängliga platser och total kapacitet inom ett valt tidsintervall, filtrerat på samma attribut. Datat läses ur en färdig databasvy som fylls på av verksamhetens system – API:et är renodlat läsande."],"malgrupp":"Kommunens applikationer och verksamhetssystem","funktioner":[{"titel":"Kurssökning","text":"Fritextsökning i kurskod, namn, information och kategori, kombinerad med filtrering på bland annat nivå, studieort och anordnare."},{"titel":"Paginering och sortering","text":"Resultat hämtas sida för sida med valfri sortering på kursens attribut."},{"titel":"Dynamiska filtervärden","text":"Giltiga värden per filterattribut hämtas ur databasens aktuella innehåll och cachelagras i ett dygn."},{"titel":"Kursdetaljer","text":"Enskild kurs hämtas per id med fullständiga uppgifter inklusive ansökningslänk."},{"titel":"Statistik","text":"Antal pågående, planerade och avslutade kurser samt platser och kapacitet inom ett valt tidsintervall."}],"beroenden":[],"integrationer":["Verksamhetens kursdatabas för vuxenutbildning (läses via databasvyn api_vuxenutb.KurserVuxenutbildning)"],"databas":"Microsoft SQL Server (läsande åtkomst mot en färdig vy, inga egna migrationer)","teknik":{"sprak":"Java 25 (via dept44-föräldern)","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.8), byggd med Maven","ovrigt":"Caffeine-cache för filtervärden, JPA Specifications för dynamisk filtrering"},"konfiguration":["application.yml med SQL Server-anslutning (JDBC-URL, användarnamn, lösenord)","Cacheinställningar för filtervärden (maximalt 1000 poster, 24 timmars livslängd)","Ingen Flyway – databasschemat ägs av källsystemet och valideras endast av JPA","Anrop görs per kommun – municipalityId ingår i alla API-vägar"],"anteckningar":["Avviker från kommunens standardval MariaDB: datat läses ur en befintlig SQL Server-vy (api_vuxenutb.KurserVuxenutbildning) som fylls av verksamhetens system – API:et skriver aldrig till databasen.","Kategori och underkategori är i databasen ett sammansatt fält (\"kategori - underkategori\") som tjänstelagret delar upp vid både filtrering och filtervärdeslistning – verifierat i CourseService.","Filtervärdena beräknas med distinct-frågor mot databasen och cachelagras i ett dygn med Caffeine, en cache för kurser och en för statistik.","OpenAPI-specens info.title är \"api-education-finder\"; specen ligger incheckad under src/main/resources/api/openapi.yaml."]},"hasSpec":true,"hasSbom":true,"sbom":{"komponenter":226,"licenser":12}}</script>
