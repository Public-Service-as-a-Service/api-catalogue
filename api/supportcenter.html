  <script type="application/json" id="page-data">{"api":{"repo":"api-service-supportcenter","namn":"SupportCenter","slug":"supportcenter","kategori":"Ärendehantering","status":null,"apiVersion":"2.3","ingress":"API för att skapa och uppdatera ärenden och tillgångar (assets) i IT-servicedesksystemet POB, med enhetlig statushantering ovanpå POB:s eget API.","beskrivning":["SupportCenter är kommunens gemensamma väg in till servicedesksystemet POB (Wendia Point of Business). I stället för att applikationer integrerar direkt mot POB:s omfattande API erbjuder tjänsten ett förenklat REST-gränssnitt för att skapa, uppdatera och hämta ärenden, hantera anteckningar samt registrera och uppdatera tillgångar som datorer och annan utrustning via serienummer.","Vid statusändringar gör tjänsten mer än att bara vidarebefordra: en kedja av processorer översätter den önskade statusen till rätt kombination av fält i POB – exempelvis parkeras och återupptas ärenden med särskilda anrop, lösnings- och arbetsanteckningar läggs till automatiskt vid leverans, och avslutskoder valideras mot POB:s konfiguration.","Tjänsten är medvetet tunn och tillståndslös: den har ingen egen databas utan hämtar ärendekategorier och avslutskoder från POB och cachar dem i minnet i ett dygn. Anroparen skickar med sin egen POB-API-nyckel i varje anrop, så behörigheten styrs per konsument snarare än av tjänsten själv."],"malgrupp":"Kommunens applikationer och verksamhetssystem som skapar servicedeskärenden","funktioner":[{"titel":"Ärenden i POB","text":"Skapa, uppdatera och hämta servicedeskärenden med anteckningar av olika typer."},{"titel":"Enhetlig statushantering","text":"Statusändringar översätts till rätt fältkombinationer i POB, inklusive parkering och återupptagning av ärenden."},{"titel":"Tillgångshantering","text":"Registrera och uppdatera tillgångar (t.ex. datorer) via serienummer i POB:s konfigurationsregister."},{"titel":"Konfigurationsuppslag","text":"Hämtar giltiga ärendekategorier och avslutskoder från POB, cachade i ett dygn."},{"titel":"Behörighet per anropare","text":"Varje anrop autentiseras mot POB med anroparens egen API-nyckel (pobKey-header)."}],"beroenden":[],"integrationer":["POB / Wendia Point of Business (servicedesksystem, REST-API v110)"],"databas":null,"teknik":{"sprak":"Java 25","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.8), byggd med Maven","ovrigt":"Processorkedja för statusövergångar, Caffeine-cache för POB-konfiguration, Resilience4j (circuit breaker mot POB), Feign-klient"},"konfiguration":["application.yml med bas-URL och timeouts för POB-integrationen","Ingen egen databas – tjänsten är tillståndslös","Cache för ärendekategorier och avslutskoder (Caffeine, 24 timmars livslängd)","Anroparens POB-API-nyckel skickas i pobKey-headern i varje anrop; municipalityId ingår i alla API-vägar"],"anteckningar":["Statusändringar hanteras av en kedja av processorer (bl.a. SuspendCaseProcessor, SolutionNoteProcessor, ClosureCodeProcessor) som körs före och efter uppdateringen mot POB och formar payloaden – t.ex. läggs en intern arbetsanteckning automatiskt till när ett ärende sätts till levererat.","Tjänsten vidarebefordrar anroparens POB-nyckel som Authorization-header mot POB – den har inga egna POB-uppgifter, så åtkomsten styrs helt av konsumentens nyckel.","Ärendekategorier och avslutskoder hämtas från POB och cachas i minnet (maximalt 50 poster, 86400 sekunder) i stället för i databas – tjänsten saknar helt egen datalagring.","Till skillnad från de flesta andra tjänster i plattformen har SupportCenter inga beroenden till andra kommun-API:er – enda integrationen är POB."]},"hasSpec":true,"hasSbom":true,"sbom":{"komponenter":225,"licenser":10}}</script>
