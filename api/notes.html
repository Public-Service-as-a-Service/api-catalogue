  <script type="application/json" id="page-data">{"api":{"repo":"api-service-notes","namn":"Notes","slug":"notes","kategori":"Ärendehantering","status":null,"apiVersion":"4.1","ingress":"Gemensam anteckningstjänst som lagrar anteckningar kopplade till parter eller ärenden, med full revisionshistorik för varje ändring.","beskrivning":["Notes är kommunens gemensamma lagring av anteckningar. I stället för att varje applikation bygger egen anteckningsfunktionalitet skapar de anteckningar här, knutna till en part (partyId), ett ärende (caseId), en applikation (clientId), ett sammanhang (context) och en roll. Bland annat använder SupportManagement tjänsten för sina ärendeanteckningar.","Anteckningar kan sökas fram med valfri kombination av dessa nycklar, med paginering. Varje gång en anteckning skapas eller ändras sparas en revision – men bara om innehållet faktiskt skiljer sig från den senaste revisionen, så historiken innehåller enbart verkliga ändringar.","Revisionerna kan listas per anteckning, och skillnaden mellan två valfria versioner kan hämtas som JSON-patch-operationer enligt RFC 6902 – användbart för att visa exakt vad som ändrats, när och av vem."],"malgrupp":"Kommunens applikationer och verksamhetssystem","funktioner":[{"titel":"Anteckningar med koppling","text":"Skapa, uppdatera, hämta och ta bort anteckningar knutna till part, ärende, applikation, sammanhang och roll."},{"titel":"Flexibel sökning","text":"Sök anteckningar på valfri kombination av partyId, caseId, clientId, context och roll, med paginering."},{"titel":"Revisionshistorik","text":"Varje verklig ändring sparas som en ny revision med versionsnummer – oförändrat innehåll skapar ingen ny revision."},{"titel":"Skillnad mellan versioner","text":"Skillnaden mellan två revisioner returneras som JSON-patch-operationer enligt RFC 6902."}],"beroenden":[],"integrationer":[],"databas":"MariaDB med Flyway-migrationer; anteckningar och deras revisioner lagras per kommun","teknik":{"sprak":"Java 25","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.8), byggd med Maven","ovrigt":"JSON-diff med zjsonpatch för revisionsjämförelser (RFC 6902)"},"konfiguration":["application.yml med MariaDB-anslutning; databasschemat versionshanteras med Flyway","Inga beroenden till andra mikrotjänster – tjänsten är fristående","Anrop görs per kommun – municipalityId ingår i alla API-vägar"],"anteckningar":["En ny revision skapas bara när anteckningens serialiserade ögonblicksbild skiljer sig från senaste revisionen – identiska uppdateringar lämnar ingen ny version efter sig (RevisionService.createRevision).","Versionsjämförelsen görs med zjsonpatch och returneras som JSON-patch-operationer enligt RFC 6902.","Tjänsten är en av de enklaste i plattformen: inga integrationer mot andra tjänster, bara databas – den konsumeras i sin tur av bland annat SupportManagement för ärendeanteckningar."]},"hasSpec":true,"hasSbom":true,"sbom":{"komponenter":272,"licenser":14}}</script>
