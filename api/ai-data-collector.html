  <script type="application/json" id="page-data">{"api":{"repo":"api-service-ai-data-collector","namn":"AI Data Collector","slug":"ai-data-collector","kategori":"AI-tjänster","status":null,"apiVersion":"1.0","ingress":"Samlar in innehåll från Confluence och håller det synkroniserat som kunskapsunderlag i AI-plattformen Eneo, så att kommunens AI-assistenter alltid svarar utifrån aktuell dokumentation.","beskrivning":["AI Data Collector försörjer kommunens AI-assistenter med kunskapsunderlag. Tjänsten läser sidträd i Confluence – kommunens dokumentationsplattform – och laddar upp sidornas innehåll till grupper i AI-plattformen Eneo, där assistenterna använder dem som kunskapskällor.","Synkroniseringen sker på två sätt: dels genom schemalagda genomgångar av konfigurerade sidträd, dels i realtid via en webhook som Confluence anropar när sidor skapas, uppdateras eller tas bort. Webhook-anropen verifieras med HMAC-SHA256-signatur innan de behandlas.","Vilka Confluence-träd som mappas mot vilka Eneo-grupper konfigureras per kommun, och enskilda grenar kan svartlistas så att de aldrig skickas till AI-plattformen. Tjänsten håller reda på redan insamlade sidor i sin databas för att kunna uppdatera och ta bort rätt underlag i Eneo."],"malgrupp":"Kommunens AI-assistenter och de team som förvaltar deras kunskapsunderlag","funktioner":[{"titel":"Schemalagd insamling","text":"Konfigurerade Confluence-sidträd gås igenom enligt cron-schema per kommun och synkroniseras till Eneo."},{"titel":"Realtidsuppdatering via webhook","text":"Confluence anropar tjänsten när sidor skapas, uppdateras eller tas bort; ändringen speglas direkt i Eneo."},{"titel":"Mappning mot Eneo-grupper","text":"Varje Confluence-rotsida mappas mot en grupp i Eneo, konfigurerbart per kommun."},{"titel":"Svartlistning","text":"Utpekade grenar i sidträdet hoppas över i sin helhet och skickas aldrig till AI-plattformen."},{"titel":"Signaturverifiering","text":"Webhook-anrop verifieras med HMAC-SHA256 (x-hub-signature) innan de behandlas."}],"beroenden":[],"integrationer":["Confluence – källa för dokumentationssidor, via REST-API och webhooks","Eneo (kommunens AI-plattform) – kunskapsunderlag laddas upp till och tas bort ur grupper"],"databas":"MariaDB med Flyway-migrationer; insamlade Confluence-sidor och deras Eneo-koppling lagras per kommun, samt ShedLock-tabell för schemaläggningslås","teknik":{"sprak":"Java 25","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.8), byggd med Maven","ovrigt":"ShedLock med JDBC-låsning för schemalagda jobb, OpenAPI Generator för Eneo-klienten, HMAC-signaturverifiering av webhooks"},"konfiguration":["Miljökonfiguration per kommun: Confluence-anslutning, mappningar rotsida–Eneo-grupp, svartlistade rotsidor samt cron-schema och ShedLock-låstid","Webhook-hemlighet för HMAC-verifiering av Confluence-anrop","URL och OAuth2-klientuppgifter för Eneo","MariaDB-anslutning; databasschemat versionshanteras med Flyway"],"anteckningar":["Tjänsten skapar en arbetare per konfigurerad kommun och schemalägger den individuellt med egen cron och eget ShedLock-lås – verifierat i ConfluenceDataSource.","Svartlistade sidor stoppar hela grenen: varken sidan eller dess barn behandlas.","AI-plattformen hette tidigare Intric – databasmigrationen V1.3 döper om kolumnerna från intric till eneo.","README anger Java 21, men bygget styrs av dept44-service-parent 8.0.8 som övriga tjänster (Java 25) – koden är sanningskällan."]},"hasSpec":true,"hasSbom":true,"sbom":{"komponenter":262,"licenser":13}}</script>
