  <script type="application/json" id="page-data">{"api":{"repo":"api-service-remindandinform","namn":"RemindAndInform","slug":"remindandinform","kategori":"Kommunikation","status":null,"apiVersion":"4.0","ingress":"Registrerar påminnelser kopplade till ärenden och skickar ut dem automatiskt vid önskad tidpunkt via kommunens meddelandetjänst.","beskrivning":["RemindAndInform låter kommunens verksamhetssystem registrera påminnelser åt invånare och företag, till exempel om en åtgärd som ska utföras i ett ärende. Varje påminnelse kopplas till en part (partyId), ett ärende och ett påminnelsedatum, och kan förses med en beskrivning av vad som ska göras.","En schemalagd process körs dagligen och skickar alla påminnelser vars datum passerats och som ännu inte skickats. Utskicket går via kommunens Messaging-tjänst, som väljer kanal utifrån mottagarens kontaktinställningar – meddelandet innehåller både en kort textversion och en HTML-formaterad e-postversion. Skickade påminnelser markeras som utskickade så att de inte skickas igen.","Påminnelser kan skapas, uppdateras, hämtas och tas bort via API:et, listas per part, och utskicket kan även utlösas manuellt för ett angivet datum."],"malgrupp":"Kommunens applikationer och verksamhetssystem","funktioner":[{"titel":"Registrera påminnelser","text":"Påminnelser skapas med part, ärendereferens, åtgärdsbeskrivning och påminnelsedatum, och kan uppdateras eller tas bort."},{"titel":"Automatiskt utskick","text":"En daglig schemalagd process skickar alla oskickade påminnelser vars datum passerats, per kommun."},{"titel":"Utskick via Messaging","text":"Påminnelserna levereras genom Messaging-tjänsten som väljer kanal utifrån mottagarens kontaktinställningar, med både text- och HTML-version."},{"titel":"Manuellt utlöst utskick","text":"Utskicket kan även triggas via API:et för ett angivet datum, till exempel för omkörning."},{"titel":"Uppslag per part","text":"Alla påminnelser för en viss part (partyId) kan listas."}],"beroenden":[{"name":"Messaging","version":"7.9","usage":"Skickar påminnelsemeddelanden till mottagarna; kanal väljs utifrån mottagarens kontaktinställningar."}],"integrationer":[],"databas":"MariaDB med Flyway-migrationer; påminnelser lagras med part, ärende, datum och utskicksstatus","teknik":{"sprak":"Java 25","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.8), byggd med Maven","ovrigt":"Dept44Scheduled/ShedLock för det schemalagda utskicket"},"konfiguration":["application.yml med URL och OAuth2-klientuppgifter för Messaging","MariaDB-anslutning; databasschemat versionshanteras med Flyway","Cron-uttryck och lista över kommuner (municipalityIds) för det schemalagda utskicket","Meddelandemallar och avsändaruppgifter (e-postnamn/-adress, sms-avsändare, ämnesrad) konfigureras per miljö","Anrop görs per kommun – municipalityId ingår i alla API-vägar"],"anteckningar":["Det schemalagda utskicket hämtar alla oskickade påminnelser med datum till och med idag – även försenade påminnelser skickas alltså vid nästa körning – verifierat i SendRemindersLogic.","Påminnelserna markeras som skickade först efter att Messaging-anropet lyckats, vilket gör att de skickas om vid fel.","Meddelandetexterna byggs från konfigurerbara mallar där ärende-id och åtgärd sätts in; HTML-versionen för e-post escapas och base64-kodas innan den skickas.","Utskicksprocessen körs per kommun utifrån en konfigurerad lista av municipalityId."]},"hasSpec":true,"hasSbom":true,"sbom":{"komponenter":261,"licenser":13}}</script>
