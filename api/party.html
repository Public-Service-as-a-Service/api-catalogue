  <script type="application/json" id="page-data">{"api":{"repo":"api-service-party","namn":"Party","slug":"party","kategori":"Parts- och kunddata","status":null,"apiVersion":"2.2","ingress":"Översätter mellan person-/organisationsnummer (legalId) och kommunens interna part-id (partyId) för privatpersoner och företag.","beskrivning":["Party är kommunens gemensamma översättningstjänst för partsidentiteter. I stället för att sprida person- och organisationsnummer mellan system använder kommunens tjänster ett internt part-id (partyId, ett UUID). När ett system behöver växla mellan de två identitetsformerna anropas Party, som fungerar som ett paraply över de bakomliggande tjänsterna Citizen (privatpersoner) och LegalEntity (organisationer).","Tjänsten översätter i båda riktningarna: från legalId till partyId och tillbaka, styrt av parttyp (PRIVATE eller ENTERPRISE). Det finns även uppslag där parttypen är okänd – tjänsten provar då först som privatperson och därefter som organisation. För större volymer finns batchoperationer som översätter många personnummer eller partyId i ett anrop.","Party är medvetet tunn: den lagrar ingenting själv utan validerar inkommande identiteter och delegerar uppslagen till Citizen och LegalEntity. Det gör tjänsten till en central byggsten som de flesta av kommunens API:er beror på."],"malgrupp":"Kommunens applikationer och verksamhetssystem","funktioner":[{"titel":"LegalId till partyId","text":"Slår upp kommunens interna part-id utifrån person- eller organisationsnummer, med validering av numrets format."},{"titel":"PartyId till legalId","text":"Slår upp person- eller organisationsnummer utifrån partyId, styrt av parttyp."},{"titel":"Uppslag utan känd parttyp","text":"Ett partyId kan slås upp utan att parttypen anges – tjänsten provar först som privatperson och därefter som organisation."},{"titel":"Batchöversättning","text":"Många personnummer eller partyId översätts i ett anrop; organisationsuppslag i batch körs parallellt."}],"beroenden":[{"name":"Citizen","version":"3.0","usage":"Översätter mellan personnummer och partyId för privatpersoner, enskilt och i batch."},{"name":"LegalEntity","version":"-","usage":"Översätter mellan organisationsnummer och partyId för organisationer (handskriven klient utan incheckad specifikation)."}],"integrationer":[],"databas":null,"teknik":{"sprak":"Java 25","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.8), byggd med Maven","ovrigt":"Resilience4j (circuit breakers mot Citizen och LegalEntity); ingen egen databas – tjänsten är tillståndslös"},"konfiguration":["application.yml med URL och OAuth2-klientuppgifter för Citizen och LegalEntity","Circuit breakers ignorerar klientfel (4xx) så att de inte löser ut i onödan","Ingen databas behöver konfigureras – tjänsten är tillståndslös","Anrop görs per kommun – municipalityId ingår i alla API-vägar"],"anteckningar":["Vid uppslag av legalId utan känd parttyp provas Citizen först och därefter LegalEntity; hittas inget svar i någon av dem returneras 404 – verifierat i PartyService.","Batchuppslag av organisationsnummer körs parallellt i en fast trådpool om tio trådar mot LegalEntity, medan personnummer översätts med Citizens batch-API.","Person- och organisationsnummer formatvalideras med dept44:s validatorer innan uppslag görs.","Tjänsten saknar egen databas och lagrar inga identiteter själv – den är enbart ett översättningsskikt över Citizen och LegalEntity.","Klienten mot LegalEntity är handskriven i koden utan incheckad OpenAPI-specifikation, till skillnad från Citizen-klienten som genereras ur citizen.yml (3.0)."]},"hasSpec":true,"hasSbom":true,"sbom":{"komponenter":221,"licenser":10}}</script>
