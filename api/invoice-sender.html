  <script type="application/json" id="page-data">{"api":{"repo":"api-service-invoice-sender","namn":"InvoiceSender","slug":"invoice-sender","kategori":"Ekonomi och fakturering","status":null,"apiVersion":"2.0","ingress":"Hämtar fakturabatchar från ekonomisystemet Raindance och levererar fakturorna digitalt till invånarnas digitala brevlådor via Kivra.","beskrivning":["InvoiceSender flyttar kommunens fakturautskick från papper till digitala kanaler. Tjänsten hämtar batchar med fakturafiler från ekonomisystemet Raindance via en filshare, behandlar varje faktura och skickar dem som digitala fakturor till mottagarnas digitala brevlådor (Kivra) via kommunens Messaging-tjänst.","Varje faktura går igenom en kedja av kontroller: metadata extraheras ur batchens arkivindex, mottagarens personnummer valideras, partyId slås upp och mottagare med skyddad identitet sorteras bort. Fakturor som inte kan levereras digitalt lämnas kvar i batchen, som skrivs tillbaka till Raindance för traditionell utskrift och distribution.","Behandlingen körs schemalagt per batchtyp och kan även triggas manuellt för ett visst datum via API:et, som också erbjuder uppföljning av behandlade batchar. Efter varje körning skickas statusrapport via e-post och Slack-notifiering med utfallet."],"malgrupp":"Kommunens applikationer och verksamhetssystem","funktioner":[{"titel":"Hämtning från Raindance","text":"Läser batchar med fakturafiler från Raindance via SMB-filshare, enligt konfigurerbara batchtyper per kommun."},{"titel":"Digital fakturaleverans","text":"Skickar fakturor som digital post till mottagarnas digitala brevlådor (Kivra) via Messaging-tjänsten."},{"titel":"Kontroller före utskick","text":"Validerar mottagarens personnummer, slår upp partyId och sorterar bort mottagare med skyddad identitet."},{"titel":"Återkoppling till Raindance","text":"Fakturor som inte kunnat levereras digitalt lämnas kvar och batchen skrivs tillbaka till Raindance för fysisk distribution."},{"titel":"Manuell körning och uppföljning","text":"Behandlingen kan triggas för ett givet datum via API:et, och behandlade batchar kan listas med paginering och filtrering."},{"titel":"Status- och felrapporter","text":"Statusrapport per körning via e-post samt Slack-notifieringar, även vid fatala fel."}],"beroenden":[{"name":"Messaging","version":"7.9","usage":"Skickar digitala fakturor till digital brevlåda samt status- och felrapporter via e-post och Slack."},{"name":"Party","version":"2.0","usage":"Slår upp mottagarens partyId utifrån personnummer."},{"name":"Citizen","version":"v2","usage":"Kontrollerar om mottagaren har skyddad identitet innan digital leverans."}],"integrationer":["Raindance (ekonomisystem, batchfiler via SMB-filshare)","Kivra (digital brevlåda, via Messaging-tjänsten)"],"databas":"MariaDB med Flyway-migrationer; lagrar batchar, fakturaposter och leveransstatus för uppföljning","teknik":{"sprak":"Java 25","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.8), byggd med Maven","ovrigt":"jcifs-ng för SMB-åtkomst mot Raindance, Resilience4j (circuit breaker mot Messaging), Thymeleaf för rapportmallar, schemalagd körning per batchtyp"},"konfiguration":["application.yml med URL och OAuth2-klientuppgifter för Messaging, Party och Citizen","Raindance-anslutning per kommun: SMB-share, inloggningsuppgifter, batchtyper och cron-schema per batch","MariaDB-anslutning; databasschemat versionshanteras med Flyway","Mottagare för status- och felrapporter samt Slack-kanal","Valfri schemalagd omstart av tjänsten via cron-uttryck"],"anteckningar":["Fakturor till mottagare med skyddad identitet sorteras bort före utskick; Citizen-tjänstens svar tolkas så att 204/404 innebär skyddad identitet – verifierat i CitizenIntegration.","Fakturor som inte kan levereras digitalt lämnas kvar i batchen som skrivs tillbaka till Raindance, och tas bort ur arkivindexet (ArchiveIndex.xml) när de levererats digitalt – verifierat i InvoiceProcessor.","Vid fatala fel under batchbehandling skickas både Slack-larm och e-postrapport med körningens request-id.","Fakturors base64-innehåll maskeras i anropsloggarna via Logbook-filter, och 4xx-svar från Messaging öppnar inte circuit breakern.","Tjänsten har en inbyggd, konfigurerbar schemalagd omstart (ScheduledRestart) – en ovanlig lösning som är värd att känna till vid drift."]},"hasSpec":true,"hasSbom":true,"sbom":{"komponenter":270,"licenser":15}}</script>
