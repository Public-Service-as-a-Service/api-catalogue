  <script type="application/json" id="page-data">{"api":{"repo":"api-service-access-mapper","namn":"AccessMapper","slug":"access-mapper","kategori":"Integration","status":null,"apiVersion":"1.0","ingress":"Översätter en medarbetares Active Directory-grupper till behörigheter i kommunens interna system, utifrån konfigurerbara åtkomstgrupper.","beskrivning":["Många av kommunens interna system behöver veta vad en medarbetare får göra – men behörigheterna förvaltas i Active Directory, som systemen inte bör integrera direkt mot. AccessMapper fungerar som brygga: tjänsten slår upp vilka AD-grupper en användare tillhör och översätter dem till åtkomstgrupper med systemspecifika behörigheter.","Kopplingen mellan AD-grupper och behörigheter konfigureras via API:et. En åtkomstgrupp registreras per kommun och namnrymd (namespace) med AD-gruppens id som nyckel och innehåller en eller flera åtkomsttyper, var och en med behörighetsposter som anger nivå och mönster. På så sätt kan olika verksamhetssystem ha sina egna behörighetsmodeller i egna namnrymder, medan grunddatat hämtas från samma AD.","När ett system frågar efter en användares behörigheter hämtar tjänsten användarens AD-grupper, matchar dem mot de registrerade åtkomstgrupperna i den aktuella namnrymden och returnerar de behörigheter som är kopplade – med möjlighet att filtrera på åtkomsttyp."],"malgrupp":"Kommunens applikationer och verksamhetssystem","funktioner":[{"titel":"Behörighetsuppslag","text":"Hämtar en användares AD-grupper och returnerar de åtkomstgrupper med behörigheter som matchar i den aktuella namnrymden, med filtrering på åtkomsttyp."},{"titel":"Åtkomstgrupper","text":"Registrerar, uppdaterar, listar och tar bort åtkomstgrupper som kopplar en AD-grupp till behörigheter."},{"titel":"Namnrymder","text":"Behörighetskonfigurationen hålls isär per kommun och namnrymd, så att olika system kan ha egna behörighetsmodeller."},{"titel":"Åtkomsttyper och nivåer","text":"Varje åtkomstgrupp innehåller åtkomsttyper med behörighetsposter (nivå och mönster) som beskriver vad gruppen ger rätt till."}],"beroenden":[{"name":"ActiveDirectory","version":"v2","usage":"Hämtar vilka AD-grupper en användare tillhör."}],"integrationer":["Active Directory (indirekt – via kommunens ActiveDirectory-API)"],"databas":"MariaDB; lagrar åtkomstgrupper med åtkomsttyper och behörighetsposter per kommun och namnrymd","teknik":{"sprak":"Java 25","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.8), byggd med Maven","ovrigt":"Feign-klient genererad ur ActiveDirectory-specifikationen (openapi-generator), JPA med Specification-baserad filtrering, Resilience4j (circuit breaker mot ActiveDirectory)"},"konfiguration":["application.yml med URL och OAuth2-klientuppgifter för ActiveDirectory-integrationen","MariaDB-anslutning; initialt schema finns som SQL-skript i repot (Flyway är avstängt i standardkonfigurationen)","Anrop görs per kommun och namnrymd – municipalityId och namespace ingår i API-vägarna"],"anteckningar":["Behörighetsuppslaget hämtar användarens grupper från AD och matchar gruppernas GUID mot registrerade åtkomstgrupper i namnrymden; AD-domänen är hårdkodad till personal i tjänsten – verifierat i AccessService.","Åtkomstgruppens id är AD-gruppens GUID, vilket gör kopplingen mellan AD och den interna behörighetsmodellen explicit.","Ett initialt Flyway-skript finns under db/migration, men Flyway är avstängt i application.yml – schemat förutsätts vara etablerat i förväg.","Inparametrar saneras innan de skrivs till loggar och felmeddelanden (sanitizeForLogging) – verifierat i AccessGroupService."]},"hasSpec":true,"hasSbom":true,"sbom":{"komponenter":255,"licenser":13}}</script>
