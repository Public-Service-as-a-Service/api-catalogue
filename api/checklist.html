  <script type="application/json" id="page-data">{"api":{"repo":"api-service-checklist","namn":"Checklist","slug":"checklist","kategori":"Ärendehantering","status":null,"apiVersion":"1.3","ingress":"Hanterar introduktionschecklistor för nyanställda – checklistemallar per organisation, automatisk tilldelning när nya medarbetare anställs och uppföljning av hur långt varje introduktion kommit.","beskrivning":["Checklist stödjer kommunens introduktion av nyanställda. HR och verksamheter bygger checklistemallar med faser och aktiviteter per organisationsenhet, och när en ny medarbetare anställs får hen och närmaste chef automatiskt en egen checklista utifrån mallarna för sin del av organisationen.","Nya medarbetare hämtas löpande från kommunens Employee-API genom ett schemalagt jobb (och vid uppstart), och organisationsträdet byggs med hjälp av Company-API:et. Chefen notifieras per e-post via Messaging, med brevinnehåll som renderas genom Templating-API:et. Chefer kan dessutom delegera en medarbetares checklista till andra medarbetare.","Varje aktivitet bockas av med status, framdriften kan följas per medarbetare och organisation, och passerade checklistor låses automatiskt när utgångsdatumet infallit. Ändringar i mallar loggas till kommunens Eventlog, och hela checklistor kan exporteras och importeras som JSON mellan miljöer."],"malgrupp":"Kommunens HR-funktion, chefer och interna applikationer","funktioner":[{"titel":"Checklistemallar","text":"Mallar med faser och aktiviteter byggs, versioneras och aktiveras per organisationsenhet; anpassad sorteringsordning stöds."},{"titel":"Automatisk tilldelning","text":"Nya medarbetare hämtas schemalagt från Employee-API:et och får automatiskt en personlig checklista utifrån sin organisation."},{"titel":"Chefsnotifiering","text":"Närmaste chef notifieras per e-post via Messaging med mallrenderat innehåll från Templating."},{"titel":"Delegering","text":"En medarbetares checklista kan delegeras till andra medarbetare som då kan följa och bocka av aktiviteter."},{"titel":"Uppföljning och låsning","text":"Framdrift följs per aktivitet och medarbetare; utgångna checklistor låses automatiskt av ett schemalagt jobb."},{"titel":"Export och import","text":"Checklistor kan exporteras och importeras som JSON, till exempel mellan test- och produktionsmiljö."}],"beroenden":[{"name":"Employee","version":"v2","usage":"Hämtar nyanställda och uppdaterade chefsuppgifter via schemalagda jobb."},{"name":"Company","version":"1.0","usage":"Hämtar organisationsstrukturen som checklistorna kopplas till."},{"name":"Messaging","version":"7.9","usage":"Skickar e-postnotifieringar till chefer om nya medarbetares checklistor."},{"name":"Templating","version":"2.0","usage":"Renderar e-postinnehållet utifrån mallen för chefsnotifieringen."},{"name":"Eventlog","version":"2.1","usage":"Loggar händelser när checklistemallar och aktiviteter skapas, ändras eller tas bort."}],"integrationer":[],"databas":"MariaDB med Flyway-migrationer; mallar, medarbetarchecklistor, framdrift, delegeringar och initieringsinformation lagras per kommun","teknik":{"sprak":"Java 25","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.8), byggd med Maven","ovrigt":"dept44-scheduler med ShedLock för fem schemalagda jobb, Resilience4j mot beroende tjänster, e-postmall incheckad under src/main/resources/templates"},"konfiguration":["application.yml med URL och OAuth2-klientuppgifter för Employee, Company, Messaging, Templating och Eventlog","Cron-uttryck och lås för schemalagda jobb: hämta nyanställda, chefsutskick, låsning av utgångna checklistor, rensning av initieringsinformation och chefsuppdatering","E-postmall för chefsnotifiering (checklist.manager-email.email-template)","MariaDB-anslutning; databasschemat versionshanteras med Flyway","Anrop görs per kommun – municipalityId ingår i alla API-vägar"],"anteckningar":["Nyanställda hämtas både vid applikationsstart (konfigurerbart) och enligt cron-schema; initieringsutfallet sparas i en egen tabell som rensas efter konfigurerbart antal dagar (standard 30).","Utgångna medarbetarchecklistor låses av ett schemalagt jobb utifrån utgångsdatum som sätts när checklistan skapas – verifierat i LockEmployeeChecklistsScheduler.","Händelsetexterna som loggas till Eventlog är skrivna på svenska i koden (t.ex. \"Aktivitet ... har lagts till i fas ...\").","Senast använda kommunikationskanal och chefens e-postadress sparas per checklista för uppföljning av notifieringar."]},"hasSpec":true,"hasSbom":true,"sbom":{"komponenter":266,"licenser":13}}</script>
