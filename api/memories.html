  <script type="application/json" id="page-data">{"api":{"repo":"api-service-memories","namn":"Memories","slug":"memories","kategori":"Dokument och arkiv","status":null,"apiVersion":"3.4","ingress":"Sök- och hämttjänst för Sundsvallsminnens digitala arkiv – filmer, fotografier, ljudinspelningar, texter och publikationer.","beskrivning":["Memories exponerar Sundsvallsminnens digitala kulturarvsarkiv som ett API. Tjänsten ger sök- och hämtfunktioner för fem materialtyper – filmer, fotografier, ljud, texter och publikationer – med metadata som titel, ämnesord och topografisk plats, så att webbplatser och applikationer kan visa arkivets innehåll för allmänheten.","Metadata ligger i en MariaDB-databas medan själva mediefilerna hämtas från en SMB-filserver (Samba) och strömmas direkt till anroparen. Fotografier finns i två varianter, miniatyr och stor bild, och filmer strömmas med stöd för HTTP Range-anrop så att uppspelning kan starta mitt i filen.","Sökningen är paginerad och endast material som markerats som publicerat i databasen lämnas ut. Ämnesord (OCM) och topografiska platser slås upp via små referenstabeller som läses in i minnet vid uppstart."],"malgrupp":"Kommunens applikationer och verksamhetssystem","funktioner":[{"titel":"Sökning i arkivet","text":"Paginerad sökning per materialtyp (film, foto, ljud, text, publikation) med fritextmatchning mot titel och beskrivning."},{"titel":"Metadata per objekt","text":"Detaljvy med titel, ämnesord (OCM), topografisk plats och relaterade objekt."},{"titel":"Bildvarianter","text":"Fotografier levereras som miniatyr eller stor bild, hämtade från olika undermappar på filservern."},{"titel":"Filmströmning med Range-stöd","text":"Filmer strömmas Range-medvetet så att spelaren kan hoppa i filmen utan att ladda hela filen."},{"titel":"Endast publicerat material","text":"Sökningar och listningar omfattar bara objekt som markerats som publicerade i arkivdatabasen."}],"beroenden":[],"integrationer":["SMB-filserver (Samba) där arkivets mediefiler lagras och strömmas ifrån"],"databas":"MariaDB med Flyway-migrationer; arkivets metadata, ämnesord (OCM), topografi och publiceringsstatus","teknik":{"sprak":"Java 25","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.8), byggd med Maven","ovrigt":"jcifs-ng för SMB-åtkomst till filservern, strömmande filleverans direkt till HTTP-svaret"},"konfiguration":["SMB-anslutning: värd, port, share, autentisering samt mappar per materialtyp","MariaDB-anslutning till arkivets metadatabas; schemat versionshanteras med Flyway","Logbook-payloadloggning är helt avstängd i denna tjänst (se anteckningar)","Anrop görs per kommun – municipalityId ingår i alla API-vägar"],"anteckningar":["Logbooks servletfilter är avsiktligt avstängt: filtret buffrar ovillkorligen hela svarskroppen i minnet, vilket för en 41 MB-film skulle ge OutOfMemory – utförligt dokumenterat med analys av dekompilerad bytekod i application.yml.","Ämnesordstabellen (OCM) läses in i minnet vid uppstart i stället för att joinas vid varje fråga, eftersom tabellen är liten och i praktiken statisk – verifierat i OcmLookup.","Mediefiler hämtas från SMB-servern och strömmas direkt till HTTP-svaret; sökvägar byggs alltid med '/' oavsett plattform, med kodkommentar som förklarar varför.","Tjänsten anropar inga andra kommun-API:er – integrationslagret består av databasen och SMB-filservern."]},"hasSpec":true,"hasSbom":true,"sbom":{"komponenter":237,"licenser":14}}</script>
