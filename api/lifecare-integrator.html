  <script type="application/json" id="page-data">{"api":{"repo":"api-service-lifecare-integrator","namn":"LifecareIntegrator","slug":"lifecare-integrator","kategori":"Integration","status":null,"apiVersion":"1.0","ingress":"Läser och skapar socialtjänstinformation i verksamhetssystemet Lifecare – beslut, utredningar, verkställigheter, aktualiseringar och beräkningar – för kommunens applikationer.","beskrivning":["Socialtjänstens verksamhetssystem Lifecare (Tietoevry) består av flera delsystem med egna, äldre API:er. LifecareIntegrator kapslar in två av dem – äldreomsorgens Elderly care (EC) och individ- och familjeomsorgens Family care (FC) – bakom ett gemensamt, modernt API så att kommunens applikationer slipper hantera delsystemens olikheter, autentisering och personnummer.","API:et erbjuder en samlad beslutsresurs som hämtar och slår ihop beslut från tre källor: äldreomsorgens SoL- och LSS-beslut samt familjeomsorgens beslut. Därutöver exponeras familjeomsorgens ärendeinformation – utredningar, verkställigheter, resursfördelningar, aktualiseringar (ärendeinflöde), ekonomiska beräkningar, utbetalningar, dokument, insatser, personuppgifter och kontakter.","Personer identifieras genomgående med partyId i det publika API:et. Tjänsten översätter partyId till personnummer via Party-API:et innan Lifecare anropas – personnumret exponeras aldrig utåt."],"malgrupp":"Kommunens applikationer och verksamhetssystem","funktioner":[{"titel":"Samlade beslut","text":"En gemensam beslutsresurs som hämtar och sammanfogar beslut från äldreomsorgen (SoL och LSS) och familjeomsorgen, sorterade på beslutsdatum."},{"titel":"Utredningar och verkställigheter","text":"Läser familjeomsorgens utredningar, verkställigheter och resursfördelningar per person."},{"titel":"Aktualiseringar","text":"Hämtar och skapar aktualiseringar (ärendeinflöde) i familjeomsorgen, inklusive bilagor och förslag."},{"titel":"Ekonomiska beräkningar","text":"Hämtar och skapar beräkningar (t.ex. för ekonomiskt bistånd) med hushållsmedlemmar, samt läser utbetalningar."},{"titel":"Person och kontakter","text":"Läser persongrunddata, kontakter, handläggare och insatser ur familjeomsorgen."},{"titel":"Dokument","text":"Listar dokument och hämtar dokumentinnehåll ur familjeomsorgen."}],"beroenden":[{"name":"Party","version":"2.1","usage":"Översätter partyId till personnummer innan Lifecare anropas."}],"integrationer":["Lifecare Elderly care (Tietoevry, API-nyckelautentisering)","Lifecare Family care (Tietoevry, API-nyckelautentisering)"],"databas":null,"teknik":{"sprak":"Java 25","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.8), byggd med Maven","ovrigt":"Feign-klienter genererade ur Lifecares Swagger-specifikationer, Resilience4j (circuit breakers mot EC och FC)"},"konfiguration":["application.yml med URL, domän och API-nyckel för Lifecare EC respektive FC – nycklarna är hemligheter som sätts per miljö","OAuth2-klientuppgifter för Party-integrationen","Ingen databas – tjänsten är en ren integrationsfasad","Anrop görs per kommun – municipalityId ingår i API-vägarna"],"anteckningar":["Den samlade beslutsresursen hämtar från tre källor (EC SoL, EC LSS och FC); en källa som inte svarar fäller inte hela anropet – dess beslut utelämnas och källan rapporteras som UNAVAILABLE i svaret – verifierat i DecisionService.","Alla personkopplade anrop översätter partyId till personnummer via Party; personnumret vidarebefordras till Lifecare men exponeras aldrig i det publika API:et – verifierat i FamilyCareService.","EC saknar datumfilter på beslutsdatum, så EC-beslut hämtas ofiltrerat och filtreras i tjänsten på giltighetsöverlapp mot den efterfrågade perioden; FC kräver ett datumfönster och får ett brett standardfönster om inget anges.","Autentiseringen mot Lifecare sker med domän och API-nyckel (X-API-Key), inte OAuth2."]},"hasSpec":true,"hasSbom":true,"sbom":{"komponenter":223,"licenser":11}}</script>
