  <script type="application/json" id="page-data">{"api":{"repo":"api-service-caremanagement","namn":"CareManagement","slug":"caremanagement","kategori":"Ärendehantering","status":null,"apiVersion":"1.0","ingress":"Ärendehantering för omsorgsverksamheten – lagrar ärenden med intressenter, parametrar, bilagor och beslut och driver dem framåt genom BPMN-processer i processmotorn Operaton.","beskrivning":["CareManagement håller ordning på omsorgsrelaterade ärenden åt kommunens verksamhetssystem. Varje ärende lagras i ett namespace per verksamhet och kan förses med intressenter, fritt definierade parametrar, bilagor och en beslutslogg. Uppslagsvärden som kontaktorsaker och namespace-konfiguration administreras via egna metadataresurser.","När ett ärende skapas kan ett processdefinitionsnamn anges – då startar tjänsten automatiskt en BPMN-processinstans i processmotorn Operaton med ärendet som affärsnyckel. Ärendets parametrar hålls därefter synkroniserade som processvariabler, och via meddelandekorrelering kan väntande processteg återupptas, till exempel när en handläggare godkänner eller avslår.","Beslutsloggen fungerar som revisionsspår och rymmer både systemgenererade beslut, exempelvis DMN-utvärderade rekommendationer från processen, och mänskliga beslut, åtskilda med beslutstyp. Ärenden söks fram med fria filteruttryck, paginering och sortering."],"malgrupp":"Kommunens applikationer och verksamhetssystem","funktioner":[{"titel":"Ärenden per namespace","text":"Skapa, läsa, uppdatera och ta bort ärenden, uppdelade per kommun och namespace med konfigurerbart visningsnamn och kortkod."},{"titel":"Processautomation","text":"Ärenden kan starta en BPMN-processinstans i Operaton; ärendeparametrar synkroniseras löpande som processvariabler."},{"titel":"Meddelandekorrelering","text":"BPMN-meddelanden korreleras till ärendets pågående processinstans för att återuppta väntande processteg."},{"titel":"Beslutslogg","text":"Revisionsspår med både systemgenererade beslut (t.ex. DMN-rekommendationer) och handläggarbeslut, åtskilda med beslutstyp."},{"titel":"Intressenter och parametrar","text":"Intressenter med egna parametrar samt fria ärendeparametrar i nyckel/värde-form."},{"titel":"Bilagor","text":"Bilagor lagras med innehållet i databasen och hanteras per ärende."},{"titel":"Metadata","text":"Uppslagsvärden som kontaktorsaker administreras per namespace via metadataresurser."}],"beroenden":[{"name":"Operaton","version":"1.0","usage":"Startar processinstanser, uppdaterar processvariabler och korrelerar BPMN-meddelanden för ärendenas processer."}],"integrationer":[],"databas":"MariaDB med Flyway-migrationer; ärenden, intressenter, parametrar, beslut, bilagor (som blob) och namespace-konfiguration lagras per kommun och namespace","teknik":{"sprak":"Java 25","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.8), byggd med Maven","ovrigt":"Resilience4j (circuit breaker mot Operaton), spring-filter (turkraft) för dynamiska sökfilter, JPA/Hibernate med auditering"},"konfiguration":["application.yml med URL och OAuth2-klientuppgifter för Operaton-API:et","MariaDB-anslutning; databasschemat versionshanteras med Flyway","Namespace-konfiguration (visningsnamn, kortkod) administreras per kommun via API:et","Anrop görs per kommun och namespace – municipalityId och namespace ingår i API-vägarna"],"anteckningar":["Processtart är frivillig: anges inget processdefinitionsnamn skapas ärendet utan processinstans – verifierat i ErrandService/ProcessService.","Ärendeparametrar speglas till processvariabler i Operaton när de skapas, ändras eller tas bort; byts en parameternyckel raderas den gamla variabeln först.","Processdefinitionen slås upp på namn hos Operaton vid ärendeskapandet; okänt namn ger 400 Bad Request.","Beslutsloggen är utformad som revisionsspår med både systemgenererade och mänskliga beslut, enligt både API-dokumentationen och beslutsentiteten i koden."]},"hasSpec":true,"hasSbom":true,"sbom":{"komponenter":299,"licens
