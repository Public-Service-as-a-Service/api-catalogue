  <script type="application/json" id="page-data">{"api":{"repo":"api-service-web-message-collector","namn":"WebMessageCollector","slug":"web-message-collector","kategori":"Kommunikation","status":null,"apiVersion":"5.1","ingress":"Samlar in inkommande webbmeddelanden från kommunens e-tjänsteplattform och gör dem tillgängliga för verksamhetssystem som hanterar ärendena.","beskrivning":["WebMessageCollector hämtar regelbundet in meddelanden som invånare skickat via sina ärendesidor på kommunens e-tjänsteplattform (Open ePlatform). Meddelandena mellanlagras i tjänstens databas så att ärendehanteringssystem kan hämta dem via ett enkelt REST-API i stället för att själva integrera mot e-tjänsteplattformen.","Insamlingen styrs av en schemalagd bakgrundsprocess som per kommun och e-tjänstefamilj (familyId) hämtar nya meddelanden sedan senaste lyckade körning, både från plattformens externa och interna instans. Endast inkommande meddelanden sparas, och dubbletter filtreras bort. Även bifogade filer hämtas hem och lagras tillsammans med meddelandet.","Konsumerande system listar meddelanden per e-tjänstefamilj eller per ärende (flowInstanceId), hämtar eventuella bilagor och raderar sedan det de bearbetat klart. Meddelanden som inte kunnat kompletteras med sina bilagor markeras och görs om vid nästa körning."],"malgrupp":"Kommunens applikationer och verksamhetssystem","funktioner":[{"titel":"Schemalagd insamling","text":"En cron-styrd bakgrundsprocess hämtar nya webbmeddelanden per kommun och e-tjänstefamilj från både extern och intern instans av e-tjänsteplattformen."},{"titel":"Mellanlagring med dubblettskydd","text":"Endast inkommande meddelanden sparas; redan hämtade meddelanden filtreras bort utifrån familyId, instans, meddelande-id och ärende-id."},{"titel":"Bilagehantering","text":"Bifogade filer hämtas och lagras som blobbar tillsammans med meddelandet; misslyckade bilagehämtningar markeras och görs om."},{"titel":"Hämtning per familj eller ärende","text":"Konsumenter listar meddelanden per e-tjänstefamilj eller per specifikt ärende (flowInstanceId) och kan hämta bilagor separat."},{"titel":"Radering efter bearbetning","text":"Konsumerande system raderar meddelanden och bilagor när de bearbetats; raderade meddelanden städas bort ur databasen efter en konfigurerbar tid."}],"beroenden":[{"name":"OepIntegrator","version":"1.5","usage":"Hämtar webbmeddelanden och bilagor från e-tjänsteplattformen (Open ePlatform)."}],"integrationer":["Open ePlatform (via OepIntegrator)"],"databas":"MariaDB med Flyway-migrationer; meddelanden, bilagor och körningsinformation per e-tjänstefamilj lagras här","teknik":{"sprak":"Java 25","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.8), byggd med Maven","ovrigt":"ShedLock för distribuerad låsning av den schemalagda insamlingen, Feign-klienter via dept44"},"konfiguration":["application.yml med URL och OAuth2-klientuppgifter för OepIntegrator","MariaDB-anslutning; databasschemat versionshanteras med Flyway","Schemaläggning per kommun: cron-uttryck, clockSkew, lockAtMostFor samt lista av e-tjänstefamiljer (familyId) per instans","Anrop görs per kommun – municipalityId ingår i alla API-vägar"],"anteckningar":["Insamlingen hämtar meddelanden från tidpunkten för senaste lyckade körning minus en konfigurerbar clockSkew, och vid allra första körningen backas starttiden en timme för att inte missa meddelanden – verifierat i MessageCacheService.","Endast inkommande (INBOUND) meddelanden sparas och dubbletter filtreras bort mot databasen innan lagring.","Schemaläggaren validerar vid uppstart att clockSkew inte är större än keepDeletedAfterLastSuccessFor och vägrar annars starta.","Meddelanden med status DELETED städas bort först efter en konfigurerbar karenstid räknat från familjens senaste lyckade körning."]},"hasSpec":true,"hasSbom":true,"sbom":{"komponenter":299,"licenser":14}}</script>
