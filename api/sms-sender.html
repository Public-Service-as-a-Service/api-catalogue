  <script type="application/json" id="page-data">{"api":{"repo":"api-service-sms-sender","namn":"SmsSender","slug":"sms-sender","kategori":"Kommunikation","status":null,"apiVersion":"2.0","ingress":"Skickar sms till invånare och medarbetare via externa sms-gateways, med automatisk växling mellan leverantörer om en av dem inte kan leverera.","beskrivning":["SmsSender är kommunens gemensamma utskickstjänst för sms. Applikationer som behöver nå mottagare via sms anropar detta API i stället för att själva teckna avtal och integrera mot sms-leverantörer. Tjänsten används i praktiken mest indirekt, via Messaging-API:et som routar sms-utskick hit.","Tjänsten har stöd för två externa sms-gateways – Telia och LinkMobility – och varje leverantör konfigureras med aktivering, prioritet och eventuell flash-sms-kapacitet. Vid utskick provas leverantörerna i prioritetsordning med inbyggda omförsök; misslyckas den första provas nästa automatiskt, vilket ger redundans om en leverantör har driftstörningar.","Utöver vanliga sms kan tjänsten skicka flash-sms (meddelanden som visas direkt på mottagarens skärm), förutsatt att en flash-kapabel leverantör är konfigurerad. Tjänsten är helt tillståndslös och lagrar ingenting om skickade meddelanden."],"malgrupp":"Kommunens applikationer och verksamhetssystem","funktioner":[{"titel":"Skicka sms","text":"Ett enkelt anrop med avsändarnamn, mottagarnummer och meddelandetext skickar ett sms via den högst prioriterade leverantören."},{"titel":"Flash-sms","text":"Separat resurs för flash-sms som visas direkt på mottagarens skärm; kräver att en flash-kapabel leverantör är aktiverad."},{"titel":"Automatisk leverantörsväxling","text":"Leverantörer ordnas i en prioritetskö – misslyckas utskicket hos en leverantör efter omförsök provas nästa i kön."},{"titel":"Konfigurerbara leverantörer","text":"Varje sms-gateway kan aktiveras/inaktiveras och ges prioritet och flash-kapacitet via konfiguration, utan kodändringar."},{"titel":"Hälsokontroll av klientcertifikat","text":"En schemalagd kontroll övervakar LinkMobility-integrationens certifikat och sätter tjänstens hälsostatus till RESTRICTED vid problem."}],"beroenden":[],"integrationer":["Telia (sms-gateway, OAuth2)","LinkMobility (sms-gateway, basic auth och klientcertifikat)"],"databas":null,"teknik":{"sprak":"Java 25","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.8), byggd med Maven","ovrigt":"Spring Retry för omförsök, Feign-klienter via dept44, Lombok"},"konfiguration":["Per leverantör (telia/linkmobility): base-url, enabled, priority och flash-capable","Telia autentiseras med OAuth2 (token-url, client-id, client-secret)","LinkMobility autentiseras med basic auth (username/password) samt platform-id och platform-partner-id","Schemalagd certifikatkontroll för LinkMobility styrs med cron-uttryck (avstängd som standard)","Anrop görs per kommun – municipalityId ingår i API-vägen"],"anteckningar":["Routningen sker via en prioritetskö av leverantörer: varje utskick provas med omförsök (RetryTemplate) hos en leverantör i taget och faller vidare till nästa vid fel – verifierat i SmsProviderRouter.","Tjänsten vägrar starta om ingen leverantör är aktiverad, och kräver dessutom minst en flash-kapabel leverantör.","Flash-sms mot en leverantör som saknar flash-stöd avvisas med 400 Bad Request i stället för att skickas som vanligt sms.","Tjänsten saknar databas och interna mikrotjänstberoenden – katalogen under src/main/resources/integrations innehåller endast Telias klientspec (extern leverantör)."]},"hasSpec":true,"hasSbom":true,"sbom":{"komponenter":224,"licenser":11}}</script>
