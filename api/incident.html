  <script type="application/json" id="page-data">{"api":{"repo":"api-service-incident","namn":"Incident","slug":"incident","kategori":"Samhällsservice","status":null,"apiVersion":"3.0","ingress":"Tar emot felanmälningar från invånare, lagrar dem och skickar dem vidare till rätt mottagare – ett externt system för livbojsärenden eller e-post till kundtjänst och MSVA.","beskrivning":["Incident är kommunens mottagning för felanmälningar från e-tjänster. En inkommen anmälan sparas med kategori, beskrivning, kontaktuppgifter och eventuella bilagor, får ett ärende-id och en status som kan följas upp och uppdateras via API:et. Anmälaren kan även lämna återkoppling på ett ärende.","Vidareförmedlingen styrs av anmälans kategori: ärenden om livbojar och livbåtsbatterier skickas till ett externt mottagningssystem via formulär-POST med API-nyckel, ärenden om vattenmätare och bräddövervakningslarm skickas med särskild e-post till MSVA (Mittsverige Vatten & Avfall), och övriga kategorier skickas som e-post till kundtjänst via Messaging med en HTML-mall.","Kategorierna administreras via API:et och kan filtreras för e-tjänsteplattformen. Statusflödet uppdateras utifrån utfallet – bland annat sätts ärendet till felstatus om utskicket misslyckas, så att inget försvinner tyst."],"malgrupp":"Kommunens e-tjänster för felanmälan","funktioner":[{"titel":"Mottagning av felanmälningar","text":"Tar emot och lagrar felanmälningar med kategori, beskrivning, kontaktuppgifter och bilagor."},{"titel":"Kategoristyrd vidareförmedling","text":"Livbojsärenden går till ett externt system, vattenmätar- och bräddlarmsärenden till MSVA och övriga till kundtjänst via e-post."},{"titel":"Statusuppföljning","text":"Varje anmälan har en status som kan hämtas och uppdateras, inklusive uppslag via e-tjänstens externa ärende-id."},{"titel":"Återkoppling","text":"Anmälaren kan lämna feedback på ett ärende i efterhand."},{"titel":"Kategoriadministration","text":"Kategorier skapas, uppdateras och listas via API:et, med separata listor över giltiga kategorier för e-tjänsteplattformen."}],"beroenden":[{"name":"Messaging","version":"7.9","usage":"Skickar felanmälningar som e-post till kundtjänst och MSVA, med HTML-mall."}],"integrationer":["Externt mottagningssystem för livbojsärenden (formulär-POST med API-nyckel)","MSVA – Mittsverige Vatten & Avfall (e-post via Messaging)"],"databas":"MariaDB med Flyway-migrationer; felanmälningar med status, kategori och bilagor lagras per kommun","teknik":{"sprak":"Java 25","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.8), byggd med Maven","ovrigt":"Resilience4j (circuit breakers), Feign-klienter, Messaging-modeller genereras vid bygget ur incheckad OpenAPI-specifikation, HTML-mall för e-postutskick"},"konfiguration":["application.yml med URL och OAuth2-klientuppgifter för Messaging samt URL och API-nyckel för livbojssystemet","MariaDB-anslutning; databasschemat versionshanteras med Flyway","E-postmottagare för kundtjänst och MSVA konfigureras per miljö","Truststore för certifikatverifiering; municipalityId ingår i alla API-vägar"],"anteckningar":["Vidareförmedlingen avgörs av kategorins namn i en switch i IncidentService.sendNotification: LIVBAT/LIVBOJ går till livbojssystemet, VATTENMATARE/BRADD_OVERVAKNINGS_LARM till MSVA-e-post och allt annat till kundtjänst-e-post.","Om utskicket misslyckas fångas felet och ärendet sparas med status ERROR i stället för att förloras – verifierat i IncidentService.","README anger att tjänsten integrerar med ISYCase för SBK-relaterade felanmälningar, men koden innehåller ingen ISYCase-integration – livbojsintegrationen (form-POST med API-nyckel) är den enda systemkopplingen utöver Messaging. Koden är sanningskällan.","Messaging-klientens modeller genereras ur en incheckad kopia av Messaging-specifikationen (version 7.9) vid bygget i stället för via integrations-katalogen som i andra tjänster."]},"hasSpec":true,"hasSbom":true,"sbom":{"komponenter":262,"licenser":13}}</script>
