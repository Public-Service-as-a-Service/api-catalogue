  <script type="application/json" id="page-data">{"api":{"repo":"api-service-email-reader","namn":"EmailReader","slug":"email-reader","kategori":"Kommunikation","status":null,"apiVersion":"4.3","ingress":"Läser av verksamheternas e-postlådor, lagrar inkomna meddelanden och gör dem hämtbara för andra system – med möjlighet att omvandla särskilda mejl till sms.","beskrivning":["EmailReader är motsatsen till kommunens utskickstjänster: den tar hand om inkommande e-post. Tjänsten bevakar konfigurerade e-postlådor, hämtar nya meddelanden med bilagor och lagrar dem i en databas där konsumerande system – till exempel ärendehanteringsflöden – hämtar dem per kommun och namespace och tar bort dem när de behandlats.","Brevlådor kan läsas av på två sätt: via Exchange Web Services (EWS) eller via Microsoft Graph. Vilka brevlådor som bevakas styrs helt av data: inloggningsuppgifter registreras via API:et, knyts till kommun, namespace och destinationsmapp, och lagras krypterat i databasen. Efter att ett mejl hämtats och sparats flyttas det till destinationsmappen i brevlådan, så att inget läses dubbelt.","Utöver vanlig avläsning finns en sms-funktion: brevlådor med åtgärden SEND_SMS töms på mejl med fälten Recipient och Message, och innehållet skickas som sms med hög prioritet via Messaging-API:et. En daglig kontroll larmar dessutom via e-post om lagrade meddelanden blivit liggande längre än ett dygn utan att något system hämtat dem."],"malgrupp":"Kommunens applikationer och verksamhetssystem","funktioner":[{"titel":"Avläsning av e-postlådor","text":"Schemalagda jobb hämtar ny e-post via EWS eller Microsoft Graph, lagrar meddelanden med bilagor och flyttar originalet till en destinationsmapp."},{"titel":"Hämta och radera e-post","text":"Lagrade meddelanden listas per kommun och namespace, bilagor hämtas separat, och meddelanden raderas när konsumenten behandlat dem."},{"titel":"Hantering av brevlådeuppgifter","text":"Inloggningsuppgifter för EWS respektive Microsoft Graph administreras via API:et och lagras krypterade i databasen."},{"titel":"Mejl till sms","text":"Brevlådor med åtgärden SEND_SMS omvandlar mejl med fälten Recipient och Message till sms som skickas via Messaging med hög prioritet."},{"titel":"Bevakning av liggande meddelanden","text":"En schemalagd kontroll rapporterar via e-post när lagrade meddelanden är äldre än ett dygn."}],"beroenden":[{"name":"Messaging","version":"7.9","usage":"Skickar sms för sms-brevlådorna samt e-postrapporter om meddelanden som blivit liggande."}],"integrationer":["Microsoft Exchange via Exchange Web Services (EWS)","Microsoft Graph / Exchange Online"],"databas":"MariaDB med Flyway-migrationer; inkomna e-postmeddelanden med bilagor samt krypterade brevlådeuppgifter lagras i databasen","teknik":{"sprak":"Java 25","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.8), byggd med Maven","ovrigt":"EWS Java API, Microsoft Graph SDK, ShedLock för schemaläggningslås, AES-kryptering av lagrade inloggningsuppgifter"},"konfiguration":["MariaDB-anslutning via miljövariabler; databasschemat versionshanteras med Flyway","Krypteringsnyckel (SECRET_KEY) för lagrade brevlådeuppgifter","Cron-uttryck per schemalagt jobb: EWS-avläsning, Graph-avläsning, sms-mejl och kontroll av gamla meddelanden (alla avstängda som standard)","URL och OAuth2-klientuppgifter för Messaging-API:et","Anrop görs per kommun – municipalityId ingår i alla API-vägar"],"anteckningar":["Vilka brevlådor som bevakas är data, inte konfiguration: uppgifterna registreras via API:et och lagras AES-krypterade i databasen – verifierat i CredentialsService/EncryptionUtility.","Ett hämtat mejl flyttas till brevlådans destinationsmapp först efter att det sparats i databasen; misslyckas flytten görs ett nytt försök vid nästa körning, vilket ger dubblettskydd via det sparade original-id:t.","Sms-flödet validerar mottagarnumren och skickar bara till giltiga nummer; avsändarnamnet kortas till högst 11 tecken och sms:et skickas med hög prioritet via Messaging – verifierat i EwsScheduler.","Om lagrade meddelanden är äldre än ett dygn skickas en rapport per berörd kommun via Messaging, som signal om att konsumerande system inte hämtat sin e-post."]},"hasSpec":true,"hasSbom":true,"sbom":{"komponenter":342,"licenser":17}}</script>
