  <script type="application/json" id="page-data">{"api":{"repo":"api-service-message-exchange","namn":"MessageExchange","slug":"message-exchange","kategori":"Kommunikation","status":null,"apiVersion":"3.0","ingress":"Lagringstjänst för interna konversationer – trådade meddelanden med bilagor, lässtatus och sekvensnummer som andra system kan bygga meddelandefunktioner ovanpå.","beskrivning":["MessageExchange är kommunens nav för intern meddelandeväxling mellan system och handläggare. Tjänsten lagrar konversationer med tillhörande meddelanden och bilagor, och gör dem sökbara för behöriga system. Varje konversation hör till ett namespace och en kommun, vilket gör att flera verksamheter och applikationer kan dela samma tjänst utan att se varandras data.","En konversation har ämne, deltagare, metadata och externa referenser som kopplar den till exempelvis ett ärende i ett verksamhetssystem. Meddelanden får löpande sekvensnummer, vilket låter konsumerande system hämta bara det som tillkommit sedan senaste synkronisering. Tjänsten spårar också vilka som läst varje meddelande, med möjlighet att markera som läst och räkna lästa meddelanden per deltagare.","Bilagor på upp till 50 MB lagras i databasen och kan hämtas separat. API:et är ett rent lagrings- och uppslags-API: det skickar inga notifieringar och har inga beroenden till andra mikrotjänster – konsumerande system, till exempel ärendehanteringstjänster, står för flödena runt omkring."],"malgrupp":"Kommunens applikationer och verksamhetssystem","funktioner":[{"titel":"Konversationer","text":"Skapa, uppdatera, läsa och radera konversationer med ämne, deltagare, metadata och externa referenser, per namespace och kommun."},{"titel":"Meddelanden med sekvensnummer","text":"Meddelanden i en konversation får löpande sekvensnummer så att konsumenter kan hämta inkrementellt sedan senaste läsning."},{"titel":"Bilagor","text":"Filbilagor upp till 50 MB lagras per meddelande och hämtas via egen resurs."},{"titel":"Lässtatus","text":"Meddelanden kan markeras som lästa per identitet, och antal lästa kan räknas per deltagare i en konversation."},{"titel":"Filtrerad sökning","text":"Konversationer och meddelanden söks med flexibla filteruttryck och sidindelning."},{"titel":"Systemmeddelanden vid ändringar","text":"När en konversations ämne, deltagare eller referenser ändras skapas automatiskt ett systemmeddelande som beskriver ändringen."}],"beroenden":[],"integrationer":[],"databas":"MariaDB med Flyway-migrationer; konversationer, meddelanden, bilagor, lässtatus och sekvensnummer lagras i databasen","teknik":{"sprak":"Java 25","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.8), byggd med Maven","ovrigt":"JPA med specifikationsbaserad filtrering, ShedLock för schemaläggningslås"},"konfiguration":["MariaDB-anslutning; databasschemat versionshanteras med Flyway (avstängt som standard i basprofilen)","Maxstorlek för uppladdade bilagor (50 MB per fil)","Schemalagd bakgrundsberäkning av bilage-hashar: cron (standard 03:00 varje natt) och ShedLock-låstid","Anrop görs per kommun och namespace – båda ingår i alla API-vägar"],"anteckningar":["Ändringar av en konversations ämne, deltagare eller externa referenser genererar automatiskt ett systemmeddelande (typ SYSTEM_CREATED) med en svensk beskrivning av vad som ändrats – verifierat i ConversationService/Mapper.","Meddelandens sekvensnummer hämtas ur en separat sekvenstabell, och konversationens senaste sekvensnummer exponeras i API:et som stöd för inkrementell synkronisering.","Anroparens identitet tas från en identifierare i anropshuvudet (dept44 Identifier) och läggs automatiskt till som deltagare i konversationen vid läsning – läskvitton knyts till samma identitet.","En nattlig schemalagd rutin beräknar SHA-256-hashar för äldre bilagor som saknar hash (bakåtfyllnad efter att hash-kolumnen infördes)."]},"hasSpec":true,"hasSbom":true,"sbom":{"komponenter":269,"licenser":13}}</script>
