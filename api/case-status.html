  <script type="application/json" id="page-data">{"api":{"repo":"api-service-case-status","namn":"CaseStatus","slug":"case-status","kategori":"Ärendehantering","status":null,"apiVersion":"4.3","ingress":"Samlar ärendestatus från flera bakomliggande system och ger invånare och företag en aktuell bild av var deras ärenden befinner sig.","beskrivning":["CaseStatus svarar på frågan \"hur går det med mitt ärende?\" oavsett i vilket system ärendet handläggs. API:et hämtar och slår samman status från CaseManagement (som i sin tur täcker bland annat ByggR och Ecos), SupportManagement och e-tjänsteplattformen Open ePlatform, och exponerar dem samlat per externt ärende-id, organisationsnummer eller part.","Uppslagen mot källsystemen görs parallellt och statusarna normaliseras via en gemensam statusvokabulär, så att konsumerande applikationer får enhetliga statusbegrepp oavsett källa. För företagsärenden i e-tjänsteplattformen finns dessutom en schemalagd cache som regelbundet läser in ärenden och statusar per e-tjänstefamilj och sparar dem i tjänstens databas.","API:et arbetar också aktivt med statusuppdateringar: schemalagda jobb läser händelser ur Eventlog för CaseManagement- och CaseData-ärenden och skriver tillbaka aktuell status till e-tjänsteplattformen, så att invånarens \"Mina sidor\" hålls uppdaterade. Misslyckade uppdateringar rapporteras till förvaltningen via Slack-meddelanden genom Messaging."],"malgrupp":"Kommunens e-tjänster och applikationer för invånare och företag","funktioner":[{"titel":"Status per ärende","text":"Aktuell status för ett enskilt ärende via dess externa ärende-id, oavsett bakomliggande system."},{"titel":"Status per part eller företag","text":"Alla ärendestatusar för en part (partyId) eller ett organisationsnummer, sammanslagna från flera källsystem."},{"titel":"Parallell aggregering med enhetlig vokabulär","text":"Källsystemen frågas parallellt och statusarna översätts till gemensamma statusbegrepp via en statusvokabulär."},{"titel":"Automatisk statusuppdatering till e-tjänsten","text":"Schemalagda jobb läser händelser ur Eventlog och skriver tillbaka ny status till Open ePlatform via OepIntegrator."},{"titel":"Cache för företagsärenden","text":"Ett schemalagt jobb läser in företagsärenden per e-tjänstefamilj från e-tjänsteplattformen och cachar status i databasen."},{"titel":"Ärende-PDF","text":"Hämtar ärendet som PDF från e-tjänsteplattformen via OepIntegrator."}],"beroenden":[{"name":"CaseManagement","version":"8.3","usage":"Hämtar ärendestatus från de verksamhetssystem CaseManagement integrerar (ByggR, Ecos med flera)."},{"name":"SupportManagement","version":"12.0","usage":"Hämtar status för supportärenden."},{"name":"CaseData","version":"13.0","usage":"Statusuppdateringar för CaseData-ärenden hämtas via händelseflödet och skrivs tillbaka till e-tjänsten."},{"name":"OepIntegrator","version":"1.6","usage":"Läser ärenden och statusar från Open ePlatform samt skriver tillbaka statusuppdateringar och hämtar ärende-PDF."},{"name":"Party","version":"2.0","usage":"Översätter partyId till person- eller organisationsnummer."},{"name":"Eventlog","version":"2.1","usage":"Poller händelser för CaseManagement- och CaseData-ärenden som utlöser statusuppdateringar."},{"name":"Messaging","version":"7.9","usage":"Skickar Slack-meddelanden till förvaltningen när en statusuppdatering misslyckas."}],"integrationer":[],"databas":"MariaDB med Flyway-migrationer; cachade företagsärenden och statusmappningar lagras här","teknik":{"sprak":"Java 25","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.8), byggd med Maven","ovrigt":"Parallella uppslag med CompletableFuture och MDC-medveten trådpool, schemalagda jobb med Dept44Scheduled/Shedlock, Resilience4j (circuit breakers)"},"konfiguration":["application.yml med URL och OAuth2-klientuppgifter för de sju beroende mikrotjänsterna","MariaDB-anslutning; databasschemat versionshanteras med Flyway","Cron-uttryck för cachejobbet och Eventlog-pollningen (separata scheman för CaseManagement- och CaseData-händelser)","Anrop görs per kommun – municipalityId ingår i alla API-vägar"],"anteckningar":["Statusuppslag görs parallellt mot CaseManagement, Open ePlatform och SupportManagement med CompletableFuture på en MDC-medveten trådpool, och utkast (status \"utkast\") kan filtreras bort (CaseAggregator).","Cachejobbet sätter tjänstens hälsoindikator till unhealthy om inga ärenden alls kunde cachas för en e-tjänstefamilj – en medveten skyddsmekanism mot att cachen tyst blir inaktuell (CaseStatusCacheWorker).","E-tjänstefamiljerna som cachas ligger som uppräkning i koden (FamilyId) med separata id:n för test och produktion.","Misslyckade statusuppdateringar mot e-tjänsteplattformen rapporteras med formaterade Slack-meddelanden via Messaging, inklusive request-id för felsökning (EventLogWorker)."]},"hasSpec":true,"hasSbom":true,"sbom":{"komponenter":268,"licenser":13}}</script>
