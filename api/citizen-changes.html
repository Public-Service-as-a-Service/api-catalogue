  <script type="application/json" id="page-data">{"api":{"repo":"api-service-citizen-changes","namn":"CitizenChanges","slug":"citizen-changes","kategori":"Utbildning","status":null,"apiVersion":"3.0","ingress":"Batchtjänst som bevakar flyttar och skickar påminnelser kopplade till ansökningar om skolskjuts, elevresor och förskoleplats.","beskrivning":["CitizenChanges hjälper skolförvaltningen att hålla beslut om skolskjuts och elevresor aktuella. Tjänsten kör batchjobb som jämför folkbokföringsändringar (flyttar) med pågående ansökningar i kommunens e-tjänsteplattform Open ePlatform, och sammanställer de ärenden som kan behöva utredas på nytt i en e-postrapport till handläggarna.","Inför terminsskiften kan tjänsten även skicka påminnelser till vårdnadshavare med beviljade ansökningar om att söka på nytt inför kommande läsår – i första hand via e-post och vid behov via sms, genom kommunens Messaging-tjänst.","Därtill finns en kontroll som jämför skolskjutsärenden mot en inläst Excel-fil med förskole- och fritidsplaceringar, för att fånga fall där placeringen påverkar rätten till skolskjuts. Batchjobben startas schemalagt eller manuellt via API:et."],"malgrupp":"Kommunens applikationer och verksamhetssystem","funktioner":[{"titel":"Flyttbevakning","text":"Hämtar registrerade flyttar från Citizen och korsar dem mot pågående skolskjuts- och elevreseärenden i Open ePlatform."},{"titel":"Utredningsrapport till handläggare","text":"Ärenden som berörs av en flytt sammanställs och skickas som e-postrapport till förvaltningen."},{"titel":"Terminspåminnelser","text":"Påminnelser till vårdnadshavare inför vår- respektive hösttermin om att förnya sina ansökningar, via e-post och sms."},{"titel":"Förskolekontroll","text":"Jämför skolskjutsärenden mot en inläst Excel-fil med förskole- och fritidsplaceringar."},{"titel":"Manuell batchstart","text":"Samtliga batchjobb kan startas via API:et, med möjlighet till testkörning utan att meddelanden skickas."}],"beroenden":[{"name":"Citizen","version":"v3","usage":"Hämtar folkbokföringsändringar (flyttar) för invånare."},{"name":"Messaging","version":"7.9","usage":"Skickar påminnelser via e-post och sms samt rapporter till handläggare."}],"integrationer":["Open ePlatform (hämtar ärenden och ansökningsdata via Basic Auth)","Excel-filer med förskole- och fritidsplaceringar (läses in med Poiji)"],"databas":"MariaDB med Flyway-migrationer; används enbart för ShedLock-tabellen som låser de schemalagda jobben","teknik":{"sprak":"Java 25","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.8), byggd med Maven","ovrigt":"Poiji för Excel-inläsning, ShedLock för schemalagda jobb, Logbook-filter som maskerar base64-innehåll i loggar"},"konfiguration":["application.yml med URL och OAuth2-klientuppgifter för Citizen och Messaging","URL och Basic Auth-uppgifter (användarnamn/lösenord) för Open ePlatform","Kommaseparerad lista av familyId som pekar ut vilka e-tjänster i Open ePlatform som bevakas","Cron-uttryck för det schemalagda flyttbevakningsjobbet (ShedLock-låst)","Anrop görs per kommun – municipalityId ingår i alla API-vägar"],"anteckningar":["Flyttbevakningen hämtar flyttar från Citizen, filtrerar fram e-tjänsteärenden i rätt status per ärendetyp (skolskjuts respektive elevresa) och mejlar en utredningslista till förvaltningen – verifierat i RelocationCheckService.","Påminnelser skickas i första hand som e-post och kompletteras med sms vid behov; ämnesraden anpassas efter vår- eller hösttermin – verifierat i ReminderService.","Antalet dagar bakåt som flyttbevakningen tittar är i koden en hårdkodad standard – en kodkommentar anger att värdet egentligen ska hämtas ur databasen baserat på senaste lyckade körning.","Förskolekontrollen läser Excel-filer med Poiji och sparar en säkerhetskopia (lastRun.xls) av senaste inläsning – verifierat i DaycareCheckService och FileHandler.","Integrationen mot Open ePlatform använder Basic Auth direkt mot plattformen, till skillnad från övriga beroenden som anropas med OAuth2-klientuppgifter."]},"hasSpec":true,"hasSbom":true,"sbom":{"komponenter":275,"licenser":13}}</script>
