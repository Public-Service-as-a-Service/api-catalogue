  <script type="application/json" id="page-data">{"api":{"repo":"api-service-oep-integrator","namn":"OepIntegrator","slug":"oep-integrator","kategori":"Integration","status":null,"apiVersion":"1.6","ingress":"Gemensam ingång till kommunens e-tjänsteplattform Open ePlatform – för att hämta ärenden, sätta status och skicka webbmeddelanden till invånarnas sidor.","beskrivning":["Open ePlatform är kommunens e-tjänsteplattform där invånare lämnar in ansökningar och följer sina ärenden. OepIntegrator kapslar in plattformens egna SOAP- och REST-gränssnitt bakom ett modernt API, så att kommunens verksamhetssystem slipper integrera direkt mot plattformen. API:et används bland annat av Messaging för att leverera webbmeddelanden till mottagarens sidor på e-tjänsteplattformen.","Genom API:et kan anropande system hämta ärenden (flow instances) per familj eller part, läsa ärendestatus, hämta ärendet som PDF, sätta ny status, bekräfta leverans samt skicka och läsa webbmeddelanden med bilagor. Plattformen finns i en intern och en extern instans, och anroparen väljer instans i API-vägen.","Vilka Open ePlatform-miljöer som ska anropas konfigureras via API:et självt: instanser med adress och autentiseringsuppgifter registreras per kommun och lagras i databasen, med krypterade lösenord. Det gör att nya miljöer kan kopplas på utan omdriftsättning."],"malgrupp":"Kommunens applikationer och verksamhetssystem","funktioner":[{"titel":"Ärenden","text":"Hämtar ärenden från e-tjänsteplattformen per familj eller part, inklusive ärendestatus, bilagor och ärendet som PDF."},{"titel":"Statusuppdatering","text":"Sätter ny status på ett ärende och bekräftar leverans (confirm delivery) mot plattformen."},{"titel":"Webbmeddelanden","text":"Skickar webbmeddelanden med bilagor till ett ärende – som handläggare eller för ärendeägarens räkning – och hämtar meddelandehistorik per familj eller ärende."},{"titel":"Multisigneringsärenden","text":"Hämtar ärenden som väntar på medsignering, per part eller användare."},{"titel":"Instanskonfiguration","text":"Registrerar, uppdaterar och tar bort Open ePlatform-instanser (intern/extern) per kommun via API:et; autentiseringsuppgifter lagras krypterat."},{"titel":"Svartlistning","text":"Familjer kan svartlistas i databasen och filtreras då bort ur ärendelistorna."}],"beroenden":[{"name":"Party","version":"2.0","usage":"Översätter avsändarens partyId till personnummer när ett webbmeddelande skickas för ärendeägarens räkning."}],"integrationer":["Open ePlatform (intern och extern instans, via både SOAP- och REST-gränssnitt)"],"databas":"MariaDB med Flyway-migrationer; lagrar instanskonfiguration (med krypterade lösenord) och svartlistade familjer","teknik":{"sprak":"Java 25","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.8), byggd med Maven","ovrigt":"SOAP-klient genererad ur Open ePlatforms WSDL (jaxb-maven-plugin), Feign-klienter, Resilience4j (circuit breakers), Logbook för anropsloggning"},"konfiguration":["application.yml med OAuth2-klientuppgifter för Party-integrationen","MariaDB-anslutning; databasschemat versionshanteras med Flyway","Krypteringsnyckel för instansernas lösenord","Open ePlatform-instanser (adress och autentiseringsuppgifter) registreras via API:et och lagras i databasen – inte i konfigurationsfiler","Anrop görs per kommun och instanstyp – municipalityId och instanceType ingår i API-vägarna"],"anteckningar":["Klienter mot Open ePlatform skapas dynamiskt per registrerad instans av en klientfabrik; skrivande operationer går via SOAP-gränssnittet och läsande via REST – verifierat i tjänstelagret.","Ett webbmeddelande skickas som handläggare om avsändaren har administratorId, annars som ärendeägare varvid partyId slås upp till personnummer via Party.","Ärendelistor filtreras mot en svartlista av familjer som lagras i databasen – verifierat i CaseService.","Base64-innehåll i SOAP-anropens EncodedData-element maskeras i anropsloggarna via Logbook-filter."]},"hasSpec":true,"hasSbom":true,"sbom":{"komponenter":260,"licenser":14}}</script>
