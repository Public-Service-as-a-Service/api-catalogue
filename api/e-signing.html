  <script type="application/json" id="page-data">{"api":{"repo":"api-service-e-signing","namn":"ESigning","slug":"e-signing","kategori":"Dokument och arkiv","status":null,"apiVersion":"2.1","ingress":"Gemensam ingång för elektronisk signering av dokument – startar, följer upp och avbryter signeringsärenden hos den signeringsleverantör som är konfigurerad för kommunen.","beskrivning":["ESigning ger kommunens verksamhetssystem ett leverantörsoberoende sätt att få dokument elektroniskt signerade. Anroparen startar ett signeringsärende med dokument och undertecknare, och tjänsten väljer signeringsleverantör utifrån vilken kommun anropet gäller – idag Comfact via kommunens ComfactFacade-tjänst. Svaret innehåller ärende-id, status och signeringslänkar till undertecknarna.","Signeringsärenden kan hämtas med aktuell status, giltighetstid och – när alla undertecknat – det signerade dokumentet. Pågående ärenden kan avbrytas. När signeringsleverantören rapporterar händelser via webhook normaliserar tjänsten dem till ett leverantörsneutralt format och vidarebefordrar dem till Postportalservice, som korrelerar händelsen mot rätt utskick och mottagare.","Tjänsten har även ett äldre processbaserat flöde där signering av dokument som lagras i kommunens Document-tjänst startas som en långkörande process i process-tjänsten PwEsigning. Innan processen startas kontrolleras att dokumentet finns, att det är en PDF och att ingen signering redan pågår."],"malgrupp":"Kommunens applikationer och verksamhetssystem","funktioner":[{"titel":"Starta signeringsärende","text":"Signeringsärenden startas med dokument och undertecknare; svaret innehåller ärende-id, status och signeringslänkar."},{"titel":"Leverantörsoberoende gateway","text":"Signeringsleverantör väljs per kommun via konfiguration; idag stöds Comfact via ComfactFacade."},{"titel":"Status och signerat dokument","text":"Ärenden kan hämtas med status och giltighetstid, och det signerade dokumentet returneras när signeringen är klar."},{"titel":"Avbryt signering","text":"Pågående signeringsärenden kan avbrytas hos leverantören."},{"titel":"Webhook och händelsevidarebefordran","text":"Händelser från Comfact tas emot via webhook, normaliseras och vidarebefordras till Postportalservice."},{"titel":"Processbaserad signering","text":"Ett äldre flöde startar signering av dokument i Document-tjänsten som en långkörande process via PwEsigning."}],"beroenden":[{"name":"ComfactFacade","version":"3.1","usage":"Startar, hämtar och avbryter signeringsärenden hos signeringsleverantören Comfact."},{"name":"Document","version":"2.0","usage":"Hämtar och validerar dokument som ska signeras i det processbaserade flödet."},{"name":"PwEsigning","version":"1.0","usage":"Startar den långkörande signeringsprocessen i det processbaserade flödet."},{"name":"Postportalservice","version":"1.9","usage":"Tar emot normaliserade signeringshändelser och korrelerar dem mot utskick och mottagare."}],"integrationer":["Comfact (elektronisk signering, via ComfactFacade)"],"databas":null,"teknik":{"sprak":"Java 25","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.8), byggd med Maven","ovrigt":"Resilience4j (circuit breakers och retry mot beroende tjänster), Feign-klienter; ingen egen databas – tillståndet ligger hos leverantören och i Postportalservice"},"konfiguration":["application.yml med URL och OAuth2-klientuppgifter för ComfactFacade, Document, PwEsigning och Postportalservice","Signeringsleverantör konfigureras per kommun (byMunicipalityId) med en standardleverantör som reserv","Ingen databas behöver konfigureras – tjänsten är tillståndslös","Anrop görs per kommun – municipalityId ingår i alla API-vägar"],"anteckningar":["Signeringsleverantör väljs per kommun via ett konfigurerbart register (SigningProviderRegistry) med standardleverantör som reserv; saknas konfiguration avvisas anropet – verifierat i koden.","Webhook-händelser från Comfact mappas till ett leverantörsneutralt händelseformat innan de skickas vidare till Postportalservice, som korrelerar på customerReference och undertecknarens partyId.","I det processbaserade flödet vägras start om dokumentet redan har metadatafältet signingInProgress=true eller om filen inte är en PDF – verifierat i SigningService.","Tjänsten saknar egen databas och lagrar inget tillstånd själv."]},"hasSpec":true,"hasSbom":true,"sbom":{"komponenter":221,"licenser":10}}</script>
