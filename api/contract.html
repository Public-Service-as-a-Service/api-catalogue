  <script type="application/json" id="page-data">{"api":{"repo":"api-service-contract","namn":"Contracts","slug":"contract","kategori":"Ärendehantering","status":null,"apiVersion":"10.0","ingress":"Hanterar kommunens avtal om mark och nyttjanderätter – arrenden, köpeavtal och andra upplåtelser – med parter, villkor, bilagor och automatisk förlängning.","beskrivning":["Contracts är kommunens register-API för avtal kopplade till mark och nyttjanderätter: markarrenden, tomträtter, jakt- och jordbruksupplåtelser, köpeavtal med mera. Varje avtal lagras med parter (intressenter med roller), fastighetsbeteckningar, avtalsvillkor, avgifter, faktureringsuppgifter och avtalsperioder, och kan förses med bilagor som avtalsdokument.","API:et hanterar hela avtalets livscykel. Nattliga jobb förlänger automatiskt avtal med autoförlängning när avtalsperioden löper ut – med hänsyn till uppsägningstider och slutdatum – och avslutar avtal vars slutdatum passerats. Affärsregler per avtalstyp tillämpas vid ändringar; för köpeavtal rensas exempelvis arrendespecifika attribut som inte är tillämpliga.","Händelser om skapade, ändrade, förlängda och avslutade avtal publiceras till kommunens BillingDataCollector, som använder dem som underlag för fakturering. Publiceringen sker via ett transaktionellt utkorg-mönster (outbox) med omförsök, så att inga faktureringshändelser går förlorade."],"malgrupp":"Kommunens applikationer och verksamhetssystem","funktioner":[{"titel":"Avtalsregister","text":"Skapa, hämta, uppdatera och ta bort avtal med parter, fastighetsbeteckningar, villkor, avgifter och faktureringsuppgifter."},{"titel":"Många avtalstyper","text":"Arrenden, tomträtter, köpeavtal, jakt- och jordbruksupplåtelser, korttidsupplåtelser med flera – med typspecifika affärsregler."},{"titel":"Bilagor","text":"Avtalsdokument och andra bilagor lagras per avtal med metadata och kategori."},{"titel":"Automatisk förlängning","text":"Ett nattligt jobb förlänger avtal med autoförlängning när perioden löper ut, med hänsyn till uppsägningstid och slutdatum."},{"titel":"Automatiskt avslut","text":"Avtal vars slutdatum passerats sätts automatiskt till avslutade."},{"titel":"Faktureringshändelser","text":"Skapade, ändrade, förlängda och avslutade avtal publiceras till BillingDataCollector som faktureringsunderlag."},{"titel":"Sökning med filtrering","text":"Avtal söks med dynamiska filter och paginering (upp till 100 per sida)."}],"beroenden":[{"name":"BillingDataCollector","version":"2.0","usage":"Tar emot avtalshändelser (skapat, uppdaterat, förlängt, avslutat, borttaget) som underlag för fakturering."}],"integrationer":[],"databas":"MariaDB med Flyway-migrationer; lagrar avtal, intressenter, villkor, bilagor samt en utkorg (outbox) för faktureringshändelser","teknik":{"sprak":"Java 25 (via dept44-föräldern)","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.8), byggd med Maven","ovrigt":"Transaktionellt outbox-mönster med omförsök för händelsepublicering, ShedLock för schemalagda jobb, optimistisk låsning av avtal"},"konfiguration":["application.yml med URL och OAuth2-klientuppgifter (client credentials) för BillingDataCollector-integrationen","MariaDB-anslutning; databasschemat versionshanteras med Flyway","Schemalagda jobb för avslut (kl. 01) och autoförlängning (kl. 02) med ShedLock-låsning","Maxstorlek 50 MB per bilaga och maximalt 100 träffar per sida i sökningar","Anrop görs per kommun – municipalityId ingår i alla API-vägar"],"anteckningar":["Autoförlängningen räknar fram nya perioder i en loop tills perioden når fram till dagens datum; kan förlängningen inte nå ett framtida datum innan avtalets slutdatum sätts avtalet i stället till avslutat – verifierat i ContractAutoExtensionWorker.","Faktureringshändelser skickas aldrig direkt: de sparas i en outbox-tabell i samma transaktion som avtalsändringen och skickas av ett separat jobb med räknade omförsök och felloggning, så att händelser inte tappas vid driftstörningar.","Affärsregler tillämpas per avtalstyp – för köpeavtal nollställs arrendeattribut (förlängning, autoförlängning) eftersom de inte är tillämpliga – verifierat i PurchaseAgreementRule.","Avtalsentiteten har versionskolumn för optimistisk låsning, så samtidiga uppdateringar av samma avtal upptäcks."]},"hasSpec":true,"hasSbom":true,"sbom":{"komponenter":306,"licenser":14}}</script>
