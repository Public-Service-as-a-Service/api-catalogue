  <script type="application/json" id="page-data">{"api":{"repo":"api-service-permit-loader","namn":"PermitLoader","slug":"permit-loader","kategori":"Integration","status":null,"apiVersion":"1.0","ingress":"Läser in färdtjänst- och riksfärdtjänsttillstånd från en rådataexport ur Procapita och registrerar dem som tillgångar i PartyAssets.","beskrivning":["När kommunens färdtjänsttillstånd flyttas från verksamhetssystemet Procapita till den gemensamma tillgångstjänsten PartyAssets behövs ett kontrollerat sätt att föra över befintliga tillstånd. PermitLoader gör just det: tjänsten arbetar mot en databastabell med rådata exporterad ur Procapita och lyfter in tillstånden i PartyAssets.","Överföringen sker i två steg som startas via var sitt API-anrop. Först slås personnummer upp mot Party-API:et så att varje rad får ett partyId – personnummer exponeras aldrig vidare. Därefter grupperas raderna per person och tillståndstyp (färdtjänst respektive riksfärdtjänst) och skapas som tillgångar i PartyAssets, med rätt typ, JSON-schema och beskrivning per tillståndsgrupp.","Varje rad i rådatatabellen statusmärks löpande (t.ex. PARTY_ID_FETCHED, ASSET_CREATED eller felstatus), så att körningar kan följas upp och göras om för de rader som misslyckats. Båda stegen returnerar en jobbsummering med antal lyckade och misslyckade poster."],"malgrupp":"Kommunens interna förvaltning vid migrering av tillståndsdata","funktioner":[{"titel":"Uppslag av partyId","text":"Slår upp personnummer mot Party-API:et och kompletterar rådataraderna med partyId; personnummer maskeras i loggarna."},{"titel":"Skapande av tillgångar","text":"Grupperar rader per person och tillståndsgrupp och skapar en tillgång per grupp i PartyAssets, med valfri begränsning av antal per körning."},{"titel":"Typmappning","text":"Mappar tillståndsgrupperna FARDTJANST och RIKSFARDTJANST till rätt tillgångstyp, JSON-schema och beskrivning i PartyAssets."},{"titel":"Statusuppföljning","text":"Statusmärker varje rad i rådatatabellen efter utfall, så att misslyckade poster kan identifieras och köras om."},{"titel":"Jobbsummering","text":"Returnerar antal bearbetade, lyckade och misslyckade poster för varje körning."}],"beroenden":[{"name":"Party","version":"2.0","usage":"Översätter personnummer ur rådatan till partyId."},{"name":"PartyAssets","version":"5.0","usage":"Skapar tillstånden som tillgångar kopplade till respektive person."}],"integrationer":["Procapita (indirekt – via en databastabell med exporterad rådata)"],"databas":"MariaDB; läser och statusuppdaterar tabellen procapita_raw med exporterade tillstånd (schemat förutsätts finnas – Flyway är avstängt)","teknik":{"sprak":"Java 25","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.8), byggd med Maven","ovrigt":"Feign-klienter genererade ur Party- och PartyAssets-specifikationerna (openapi-generator), JPA utan schemagenerering"},"konfiguration":["application.yml med URL och OAuth2-klientuppgifter för Party och PartyAssets","MariaDB-anslutning till databasen med Procapita-rådatan","Flyway och Hibernates schemagenerering är avstängda – tabellen procapita_raw ska finnas i förväg","Anrop görs per kommun – municipalityId ingår i API-vägarna"],"anteckningar":["Tjänsten är en migreringsladdare med två manuellt triggade jobb (fetch-party-ids och create-party-assets) – ingen schemaläggning, körningarna startas via API:et.","Rader grupperas per personnummer och tillståndsgrupp så att en person får en tillgång per tillståndstyp; tillgångens id fångas ur Location-huvudet i PartyAssets-svaret – verifierat i PermitLoaderService.","Personnummer maskeras i alla loggrader (endast de sista tecknen loggas) – verifierat i tjänstelagret.","Ingen OpenAPI-specifikation finns incheckad i repot; API:et består av två POST-resurser under /{municipalityId}/permits.","Ett fel för en grupp stoppar inte körningen – gruppen statusmärks med felet och jobbet fortsätter med nästa."]},"hasSpec":false,"hasSbom":true,"sbom":{"komponenter":254,"licenser":13}}</script>
