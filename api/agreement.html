  <script type="application/json" id="page-data">{"api":{"repo":"api-service-agreement","namn":"Agreement","slug":"agreement","kategori":"Parts- och kunddata","status":null,"apiVersion":"4.1","ingress":"Uppslag av en parts avtal med kommunkoncernens leverantörsbolag – el, fjärrvärme, vatten, avfall med mera – kopplade till anläggningar.","beskrivning":["Agreement svarar på vilka avtal en invånare eller ett företag har med leverantörsbolagen inom kommunkoncernen, till exempel elnät, elhandel, fjärrvärme och fjärrkyla, vatten, avfallshantering och bredband. Avtalen är knutna till anläggningar, och uppgifterna hämtas ur kommunens datalager via tjänsten DataWarehouseReader.","API:et kan slås upp från två håll: alla avtal för en part (partyId), eventuellt avgränsat till vissa kategorier, eller alla avtal knutna till en viss anläggning inom en kategori. Sökningen kan begränsas till enbart aktiva avtal, och det finns både en variant som returnerar allt i ett svar och en paginerad variant.","Tjänsten lagrar ingenting själv utan är ett läsande fasad-API framför datalagret, med kommunens API-plattform som enda väg in."],"malgrupp":"Kommunens applikationer och verksamhetssystem","funktioner":[{"titel":"Avtal per part","text":"Hämtar samtliga avtal för en part uppslaget på partyId, med möjlighet att avgränsa till vissa kategorier."},{"titel":"Avtal per anläggning","text":"Hämtar avtal knutna till en viss anläggning inom en kategori, till exempel alla elavtal för en anläggning."},{"titel":"Sju avtalskategorier","text":"Bredband, fjärrkyla, fjärrvärme, elnät, elhandel, avfallshantering och vatten."},{"titel":"Endast aktiva avtal","text":"Sökningen kan begränsas till avtal som är aktiva vid anropstillfället."},{"titel":"Paginerat svar","text":"En paginerad variant av partsuppslaget för stora avtalsmängder."}],"beroenden":[{"name":"DataWarehouseReader","version":"4.1","usage":"Hämtar avtalsuppgifter ur kommunens datalager, per part eller per anläggning."}],"integrationer":[],"databas":null,"teknik":{"sprak":"Java 25","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.8), byggd med Maven","ovrigt":"Resilience4j-circuit breaker mot DataWarehouseReader"},"konfiguration":["application.yml med URL och OAuth2-klientuppgifter för DataWarehouseReader","Timeout-inställningar för anropen mot DataWarehouseReader","Ingen databas att konfigurera – tjänsten är helt läsande","Anrop görs per kommun – municipalityId ingår i alla API-vägar"],"anteckningar":["I den opaginerade varianten hämtar tjänsten alla sidor från DataWarehouseReader i en loop (1000 poster per sida) och slår ihop dem till ett komplett svar – verifierat i AgreementPartyProvider.","Tomma sökresultat besvaras med 404 Not Found i de opaginerade uppslagen, med förklarande felmeddelande – verifierat i AgreementService.","README beskriver tjänsten som en komponent i DataWarehouseReader-ekosystemet; koden bekräftar att DataWarehouseReader är dess enda beroende."]},"hasSpec":true,"hasSbom":true,"sbom":{"komponenter":223,"licenser":11}}</script>
