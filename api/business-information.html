utMiljöService med NTLM-autentisering"],"databas":null,"teknik":{"sprak":"Java 25","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.8), byggd med Maven","ovrigt":"SOAP-klient genererad ur incheckad WSDL (MinutMiljoService), Feign med NTLM-autentisering mot Ecos"},"konfiguration":["application.yml med URL samt användarnamn och lösenord (NTLM) för Ecos SOAP-gränssnitt","Timeout-inställningar för Ecos-anropen","Ingen databas att konfigurera – tjänsten är helt läsande","Anrop görs per kommun – municipalityId ingår i alla API-vägar"],"anteckningar":["Anläggningslistan filtreras i Ecos-frågan till livsmedelsanläggningar i status anmäld, inaktiv, aktiv eller beviljad – verifierat i EcosIntegration.","Organisationsnummer normaliseras innan uppslag: 10-siffriga nummer prefixas med 16 och bindestreck sätts före de fyra sista siffrorna; ogiltiga format avvisas med 400 – verifierat i EcosIntegration.","Fakturamottagare identifieras via en fast roll-guid för faktureringsrollen i Ecos – verifierat i EcosIntegration.","SOAP-klienten genereras vid bygget ur den incheckade WSDL-filen för MinutMiljöService; autentiseringen mot Ecos sker med NTLM, inte OAuth2."]},"hasSpec":true,"hasSbom":true,"sbom":{"komponenter":223,"licenser":11}}</script>
