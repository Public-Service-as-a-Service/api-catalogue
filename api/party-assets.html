  <script type="application/json" id="page-data">{"api":{"repo":"api-service-party-assets","namn":"PartyAssets","slug":"party-assets","kategori":"Parts- och kunddata","status":null,"apiVersion":"6.5","ingress":"Register över tillstånd och andra tillgångar som en part – invånare eller företag – har hos kommunen, till exempel parkeringstillstånd.","beskrivning":["PartyAssets håller reda på tillgångar (assets) som kommunen utfärdat till en part, exempelvis tillstånd och kort. Varje tillgång knyts till en part via partyId och beskrivs med typ, giltighetstid, status, statusorsak och valfria tilläggsparametrar. Verksamhetssystem kan därmed slå upp vilka engagemang en invånare eller ett företag har hos kommunen utan att själva hålla egna register.","API:et stödjer hela livscykeln: tillgångar kan skapas som utkast, aktiveras, uppdateras, ersättas av nya versioner och avslutas. Ett schemalagt jobb sätter automatiskt status till utgången när giltighetstiden passerats. Tilläggsparametrar kan valideras mot JSON-scheman, och tillgångar kan kopplas till resurser i andra system via kommunens Relation-tjänst.","Tjänsten innehåller även en importfunktion för parkeringstillstånd från systemet PR3: en Excel-fil läses in, tillstånden registreras som tillgångar och resultatet skickas som e-postrapport via Messaging."],"malgrupp":"Kommunens applikationer och verksamhetssystem","funktioner":[{"titel":"Registrera tillgångar","text":"Tillgångar skapas per part med typ, giltighetstid, status, statusorsak och valfria tilläggsparametrar."},{"titel":"Sök och uppslag","text":"Tillgångar söks fram per kommun och part med filtrering på bland annat typ, status och giltighet; utkast hanteras separat."},{"titel":"Utkast och ersättning","text":"Tillgångar kan skapas som utkast och senare aktiveras, samt ersättas av nya versioner med spårbar koppling till den ersatta tillgången."},{"titel":"Automatisk utgång","text":"Ett dagligt schemalagt jobb sätter status till utgången för aktiva och tillfälliga tillgångar vars giltighetstid passerats."},{"titel":"Statusorsaker som metadata","text":"Giltiga statusorsaker per status administreras som metadata per kommun."},{"titel":"Schemavalidering","text":"Tilläggsparametrar kan valideras mot JSON-scheman via kommunens JsonSchema-tjänst."},{"titel":"PR3-import","text":"Parkeringstillstånd importeras från Excel-filer ur systemet PR3 och resultatet rapporteras via e-post."}],"beroenden":[{"name":"Party","version":"2.0","usage":"Översätter person- och organisationsnummer till partyId och avgör om en part är privatperson eller företag."},{"name":"Relation","version":"1.1","usage":"Skapar relationer mellan tillgångar och resurser i andra system utifrån källreferensen."},{"name":"JsonSchema","version":"1.0","usage":"Validerar tillgångarnas tilläggsparametrar mot registrerade JSON-scheman."},{"name":"Messaging","version":"7.9","usage":"Skickar e-postrapport med resultatet av en PR3-import."}],"integrationer":["PR3 (import av parkeringstillstånd via Excel-filer)"],"databas":"MariaDB med Flyway-migrationer; tillgångar, statusorsaker och JSON-scheman lagras i databasen","teknik":{"sprak":"Java 25","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.8), byggd med Maven","ovrigt":"Resilience4j (circuit breakers mot beroende tjänster), ShedLock för schemalagda jobb, fastexcel för PR3-importen"},"konfiguration":["application.yml med URL och OAuth2-klientuppgifter för Party, Relation, JsonSchema och Messaging","MariaDB-anslutning; databasschemat versionshanteras med Flyway","Cron-schema och ShedLock-låstid för det dagliga utgångsjobbet","PR3-importen kan slås av med pr3import.enabled=false","Anrop görs per kommun – municipalityId ingår i alla API-vägar"],"anteckningar":["Ett schemalagt jobb (kl. 00:00 varje natt, med ShedLock-lås) letar upp aktiva och tillfälliga tillgångar vars validTo passerats och sätter status EXPIRED – verifierat i AssetExpirationWorker.","Källreferenser valideras mot formatet '{relationType}|{sourceResourceId};{sourceType};{sourceService};{sourceNamespace}|' och skapar relationer i Relation-tjänsten – verifierat i AssetService.","PR3-importen läser Excel-filer med fastexcel, skiljer på förare och passagerare för parkeringstillstånd och mejlar en resultatrapport via Messaging – verifierat i PR3Importer och PR3ImportMessagingClient.","Sökningar exkluderar alltid utkast; utkast hämtas via en separat operation – verifierat i AssetService."]},"hasSpec":true,"hasSbom":true,"sbom":{"komponenter":305,"licenser":14}}</script>
