  <script type="application/json" id="page-data">{"api":{"repo":"api-service-archive","namn":"Archive","slug":"archive","kategori":"Dokument och arkiv","status":null,"apiVersion":"2.0","ingress":"Tar emot arkivförfrågningar från bygglovssystemet ByggR och lämnar över handlingarna till kommunens långtidsarkiv Formpipe LTA.","beskrivning":["Archive är länken mellan kommunens verksamhetssystem och långtidsarkivet. API:et tar emot en arkivförfrågan med metadata (XML enligt arkivstandard) och en bilaga, paketerar den till ett importärende och skickar den vidare till Formpipe LTA via kommunens Formpipe-proxy, som översätter till arkivsystemets WCF-baserade gränssnitt.","Dagens API har en endpoint, inriktad på handlingar från bygglovssystemet ByggR. Tjänsten validerar att metadata innehåller filändelser, byter ut bilagans namn och länk mot ett genererat UUID, härleder sekretessnivå ur metadata och kompletterar med kommunens leveransöverenskommelse (submission agreement) innan importen skickas.","Svaret innehåller det arkiv-id som långtidsarkivet tilldelat handlingen, alternativt strukturerade feluppgifter om importen misslyckades. Tjänsten är medvetet tunn: den lagrar ingenting själv utan är en ren förmedlingstjänst mot arkivet."],"malgrupp":"Kommunens applikationer och verksamhetssystem","funktioner":[{"titel":"Arkivering av ByggR-handlingar","text":"Tar emot metadata och bilaga från bygglovssystemet ByggR och skickar dem som ett importärende till långtidsarkivet."},{"titel":"Metadatavalidering","text":"Kontrollerar att metadata innehåller filändelser innan arkivering; ogiltiga förfrågningar avvisas med 400 Bad Request."},{"titel":"Sekretesshantering","text":"Sekretessnivå läses ur handlingens metadata och följer med till arkivet."},{"titel":"Spårbart arkiv-id","text":"Svaret innehåller arkivets id för den importerade handlingen, eller detaljerade feluppgifter från arkivsystemet."},{"titel":"Robust felhantering","text":"Fel från arkivsidan översätts till strukturerade problemsvar och klientfel mot proxyn redovisas som Bad Gateway."}],"beroenden":[{"name":"FormpipeProxy","version":null,"usage":"Kommunens REST-proxy framför Formpipe LTA:s WCF-gränssnitt; tar emot importärendet och utför själva arkiveringen."}],"integrationer":["Formpipe LTA (långtidsarkiv, via FormpipeProxy)","ByggR (bygglovssystem, som avsändare av handlingar)"],"databas":null,"teknik":{"sprak":"Java 21","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.8), byggd med Maven","ovrigt":"Feign-klient med Resilience4j circuit breaker mot FormpipeProxy, jsoup för XML-bearbetning av arkivmetadata"},"konfiguration":["integration.formpipe-proxy.base-url med anslutnings- och lästimeout för proxyn mot långtidsarkivet","byggr.submission-agreement-id – kommunens leveransöverenskommelse som stämplas på varje importärende","Ingen databas – tjänsten lagrar ingenting själv","Anrop görs per kommun – municipalityId ingår i API-vägen"],"anteckningar":["Bilagans filnamn ersätts med ett genererat UUID och metadata skrivs om med samma UUID innan importen – verifierat i ByggRFormpipeProxyMapper.","Sekretessnivån härleds ur metadata-XML:en med jsoup-parsning i MetadataUtil.","Metadata utan filändelser stoppas i valideringen innan något skickas till arkivet.","Tjänsten saknar helt databas och tjänstelagerpaket – all logik ligger i resurs- och mapperklasserna, vilket gör den till en ren förmedlingstjänst."]},"hasSpec":true,"hasSbom":true,"sbom":{"komponenter":223,"licenser":10}}</script>
