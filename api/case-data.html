  <script type="application/json" id="page-data">{"api":{"repo":"api-service-case-data","namn":"CaseData","slug":"case-data","kategori":"Ärendehantering","status":null,"apiVersion":"13.0","ingress":"Ärendehanterings-API som lagrar och förvaltar myndighetsärenden – bland annat parkeringstillstånd, färdtjänst samt mark- och exploateringsärenden – åt kommunens handläggarapplikationer.","beskrivning":["CaseData är kommunens datanav för myndighetsärenden. API:et lagrar ärenden med parter, fastigheter/anläggningar, beslut, bilagor, anteckningar och statusar, och exponerar allt per kommun och namnrymd (namespace). Idag hanteras bland annat parkeringstillstånd, färdtjänst och mark- och exploateringsärenden, där varje verksamhetsområde har sin egen namnrymd.","När ett ärende skapas startar API:et automatiskt en tillhörande handläggningsprocess i rätt processmotor utifrån ärendets namnrymd och ärendetyp, och vid uppdateringar meddelas processen så att handläggningen drivs vidare. Ärendetyper kan konfigureras att inte starta någon process alls.","API:et samlar också in inkommande kommunikation till ärendena: schemalagda jobb hämtar e-post via EmailReader och webbmeddelanden via WebMessageCollector varje minut, och konversationer synkroniseras mot MessageExchange. Alla ändringar på ärenden, beslut, parter med mera versionshistorieförs med Javers och kan läsas ut via history-endpoints."],"malgrupp":"Kommunens applikationer och verksamhetssystem","funktioner":[{"titel":"Ärenden med fullständig ärendebild","text":"CRUD för ärenden med parter (stakeholders), fastigheter/anläggningar, beslut, bilagor, anteckningar, statusar och extraparametrar."},{"titel":"Automatisk processtart","text":"När ett ärende skapas startas en handläggningsprocess i rätt processmotor (parkeringstillstånd, färdtjänst eller mark och exploatering) utifrån namnrymd och ärendetyp."},{"titel":"Meddelanden och konversationer","text":"Meddelanden per ärende, inklusive utgående meddelanden via Messaging och trådade konversationer via MessageExchange."},{"titel":"Automatisk insamling av inkommande post","text":"Schemalagda jobb hämtar inkommande e-post och webbmeddelanden från e-tjänster och knyter dem till rätt ärende."},{"titel":"Ändringshistorik","text":"Alla ändringar på ärenden, beslut, parter, anteckningar, bilagor och anläggningar versionshanteras med Javers och exponeras via history-endpoints."},{"titel":"Notifieringar till handläggare","text":"Notifieringar per ärende och användare, med uppslag av handläggaruppgifter via Employee och daglig rensning av inaktuella notifieringar."},{"titel":"Metadata och parkering av ärenden","text":"Metadata över ärendetyper per namnrymd samt tidsstyrd parkering (suspension) av ärenden som automatiskt återaktiveras när tiden löpt ut."}],"beroenden":[{"name":"PwParkingPermit","version":"3.0","usage":"Startar och uppdaterar handläggningsprocesser för parkeringstillståndsärenden."},{"name":"PwParatransit","version":"1.0","usage":"Startar och uppdaterar handläggningsprocesser för färdtjänstärenden."},{"name":"PwLandAndExploitation","version":"3.0","usage":"Startar och uppdaterar handläggningsprocesser för mark- och exploateringsärenden."},{"name":"EmailReader","version":"4.2","usage":"Hämtar inkommande e-post som knyts till ärenden via schemalagt jobb."},{"name":"WebMessageCollector","version":"5.1","usage":"Hämtar webbmeddelanden från e-tjänsteplattformen via schemalagt jobb."},{"name":"MessageExchange","version":"1.1","usage":"Synkroniserar trådade konversationer kopplade till ärenden."},{"name":"Messaging","version":"7.9","usage":"Skickar utgående meddelanden till ärendets parter."},{"name":"MessagingSettings","version":"2.0","usage":"Hämtar avsändar- och meddelandeinställningar för utskick."},{"name":"Employee","version":"v2","usage":"Slår upp handläggaruppgifter (portalpersondata) för notifieringar."},{"name":"Relation","version":"1.1","usage":"Hanterar relationer mellan ärenden vid konversationssynkronisering."},{"name":"Eventlog","version":"2.1","usage":"Skriver ärendehändelser till kommunens centrala händelselogg."},{"name":"JsonSchema","version":null,"usage":"Validerar ärendens extraparametrar mot JSON-scheman."}],"integrationer":[],"databas":"MariaDB med Flyway-migrationer; ärenden med beslut, parter och bilagor lagras tillsammans med Javers-ändringshistorik","teknik":{"sprak":"Java 21","ramverk":"Spring Boot via kommunens gemensamma tjänsteplattform dept44 (8.0.8), byggd med Maven","ovrigt":"Javers för ändringshistorik, schemalagda jobb med Shedlock-låsning (dept44-starter-scheduler), Resilience4j (circuit breakers), Feign-klienter, Logbook för anropsloggning"},"konfiguration":["application.yml med base-url och OAuth2-klientuppgifter (client-id/client-secret) för samtliga tolv beroende mikrotjänster","MariaDB-anslutning; databasschemat versionshanteras med Flyway","Namnrymder per processmotor konfigureras via integration.parkingpermit/landandexploitation.supported-namespaces","Cron-uttryck och Shedlock-låstider för de fem schemalagda jobben (e-post, webbmeddelanden, konversationer, suspensioner, notifieringar)","Anrop görs per kommun och namnrymd – municipalityId och namespace ingår i alla API-vägar"],"anteckningar":["ProcessService väljer processmotor utifrån ärendets namnrymd: parkeringstillstånd och färdtjänst delar namnrymd och skiljs på ärendetyp, medan mark- och exploateringsärenden har egen namnrymd – verifierat i ProcessService.startProcess.","Ärendetyper kan konfigureras i databasen att inte starta någon process (isProcessingDisabled) – processtarten hoppas då över.","Bilage-endpoints är undantagna från Logbook-payloadloggning; en kommentar i application.yml förklarar att base64-kropparna tidigare orsakade OOM-omstarter.","README beskriver tjänsten som hantering av parkeringstillstånd samt mark och exploatering, men koden hanterar även färdtjänstärenden via PwParatransit – koden är sanningskällan."]},"hasSpec":true,"hasSbom":true,"sbom":{"komponenter":273,"licenser":13}}</script>
