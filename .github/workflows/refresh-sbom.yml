name: Refresh SBOMs

# Regenerates every API's software bill of materials from the source repositories
# and commits the result. The catalogue's own generators are pure functions of
# apis-data.json and can be run by hand, but an SBOM tracks 75 external repos that
# Dependabot bumps continuously -- it has to be scheduled to stay honest.
#
# Note: a push made with GITHUB_TOKEN does NOT trigger other workflows, so
# deploy-pages.yml will not pick this commit up. The publish job below therefore
# deploys to Pages explicitly.

on:
  schedule:
    # 05:00 UTC on Mondays, after the services' own Sunday 03:00 CI run.
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      only:
        description: "Kör bara för denna slug (t.ex. garbage). Tomt = alla API:er."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: refresh-sbom
  cancel-in-progress: false

jobs:
  matrix:
    name: Build matrix
    runs-on: ubuntu-latest
    outputs:
      apis: ${{ steps.build.outputs.apis }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read apis-data.json
        id: build
        env:
          ONLY: ${{ inputs.only }}
        run: |
          apis=$(jq -c --arg only "$ONLY" \
            '[.[] | {slug, repo}] | if $only == "" then . else map(select(.slug == $only)) end' \
            scripts/apis-data.json)
          if [ "$(echo "$apis" | jq 'length')" -eq 0 ]; then
            echo "::error::No API matched '$ONLY'."
            exit 1
          fi
          echo "apis=$apis" >> "$GITHUB_OUTPUT"
          echo "$apis" | jq -r 'length | "\(.) APIs in the matrix"'

  sbom:
    name: SBOM ${{ matrix.api.slug }}
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Keeps us inside GitHub's concurrent-job limit and stops 75 parallel jobs
      # from hammering Maven Central into rate-limiting us.
      max-parallel: 10
      matrix:
        api: ${{ fromJson(needs.matrix.outputs.apis) }}
    steps:
      - name: Checkout catalogue
        uses: actions/checkout@v7

      - name: Checkout ${{ matrix.api.repo }}
        uses: actions/checkout@v7
        with:
          repository: Sundsvallskommun/${{ matrix.api.repo }}
          path: src
          fetch-depth: 1

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin
          cache: maven
          cache-dependency-path: src/pom.xml

      - name: Resolve dependencies
        # Populates ~/.m2 so Trivy reads parent and BOM poms locally instead of
        # fetching them from Maven Central, which rate-limits fleet-wide scans.
        #
        # Retried because that rate-limiting also hits Maven itself: with ten
        # matrix legs resolving at once, the odd repository gets refused and the
        # leg dies even though nothing is wrong with it (measured at roughly 1% of
        # legs). Without the retry the run goes red on a transient fault, and a red
        # run that is "normal" is one nobody reads -- which is how a genuinely
        # stuck repository would sit stale for weeks unnoticed.
        working-directory: src
        run: |
          for attempt in 1 2 3; do
            if mvn -B -q dependency:go-offline -DskipTests; then
              exit 0
            fi
            echo "::warning::Dependency resolution failed (attempt ${attempt}/3)."
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 45))
            fi
          done
          echo "::error::Could not resolve dependencies after 3 attempts."
          exit 1

      - name: Install Trivy
        # Pinned deliberately: a Trivy upgrade can change the document contents and
        # would rewrite all 75 SBOMs at once. Bumping it should be its own reviewable
        # change, not a silent side effect of a scheduled run.
        #
        # cache: true because the download from GitHub releases is the kind of
        # transient network fault that otherwise reddens a leg for no real reason
        # (observed: curl exit 35 mid-run). With the cache, one leg downloads the
        # binary and the other 74 restore it from the Actions cache.
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.74.0
          cache: true

      - name: Generate SPDX SBOM
        # Two things here are deliberate:
        #
        # 1. MUST run from inside the checkout and scan "." -- Trivy derives every
        #    package SPDXID from a PkgID containing the scan path, so scanning "src"
        #    instead would change every identifier and churn the whole file.
        # 2. --offline-scan resolves purely from the ~/.m2 populated above. Scanning
        #    online is both fragile (Maven Central rate-limits a fleet-wide sweep
        #    after a handful of repositories) and non-deterministic: a throttled run
        #    silently degrades licences to NOASSERTION, which would commit a diff
        #    that is not a real dependency change. Offline costs about 1% of licences
        #    and yields an identical component list.
        working-directory: src
        run: |
          trivy fs --format spdx-json --scanners license --quiet --offline-scan \
            --output "$GITHUB_WORKSPACE/raw.spdx.json" .

      - name: Normalise
        run: |
          mkdir -p assets/sbom
          python3 scripts/normalize-sbom.py \
            --input raw.spdx.json \
            --output "assets/sbom/${{ matrix.api.slug }}.spdx.json" \
            --slug "${{ matrix.api.slug }}" \
            --repo "${{ matrix.api.repo }}" \
            --source src

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.api.slug }}
          path: assets/sbom/${{ matrix.api.slug }}.spdx.json
          if-no-files-found: error

  commit:
    name: Commit refreshed SBOMs
    needs: sbom
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    # Runs even if some services failed to scan: their artifact is simply absent
    # and the previously committed SBOM is left untouched rather than deleted.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download SBOMs
        uses: actions/download-artifact@v8
        with:
          pattern: sbom-*
          path: assets/sbom
          merge-multiple: true

      - name: Regenerate pages
        # Only generate-pages.py is affected; the architecture diagrams are a pure
        # function of apis-data.json and are unrelated to the SBOMs.
        run: python3 scripts/generate-pages.py

      - name: Commit if changed
        id: commit
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No SBOM changes - nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/sbom api
          git commit -m "Uppdatera programvaruförteckningar (SBOM)"
          # main can move between this job's checkout and its push, which rejects
          # the push as non-fast-forward and loses the whole refresh. Rebase and
          # retry rather than failing the run.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed refreshed SBOMs."
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto the latest main."
            git pull --rebase origin main
          done
          echo "::error::Could not push after 3 attempts."
          exit 1

  publish:
    name: Publish to GitHub Pages
    needs: commit
    # always() is required, not cosmetic: GitHub skips a job when anything in its
    # needs-chain failed, and the sbom job is a 75-leg matrix with fail-fast off.
    # Without it, a single unscannable repository silently blocks publication of
    # all the others.
    if: always() && needs.commit.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Same concurrency group as deploy-pages.yml so the two never race.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Must be the branch tip, not github.sha: the commit job pushed a new
          # commit during this run, and the default checkout would deploy the tree
          # as it looked when the run started -- silently publishing stale content.
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  keepalive:
    name: Reset inactivity timer
    # Runs on every scheduled execution, whether or not anything changed. That is
    # the whole point: GitHub disables a scheduled workflow in a public repository
    # after 60 days without repository activity, and this workflow only commits
    # when a dependency actually changed -- a genuinely quiet couple of months
    # would produce no activity at all and the schedule would stop silently.
    #
    # Re-enabling the workflow through the API is what the keepalive tooling
    # settled on after moving away from dummy commits (keepalive-workflow v1 -> v2,
    # gh-workflow-immortality), and it avoids polluting the history. Note that
    # GitHub documents neither what counts as "repository activity" nor that
    # enabling resets the counter -- this is the best available mitigation, not a
    # guarantee. The state check below makes the outcome observable either way.
    needs: sbom
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          before=$(gh api "repos/$REPO/actions/workflows/refresh-sbom.yml" --jq '.state')
          echo "state before: $before"
          if [ "$before" = "disabled_inactivity" ]; then
            echo "::warning::The schedule had been disabled for inactivity and is being re-enabled."
          fi
          gh api -X PUT "repos/$REPO/actions/workflows/refresh-sbom.yml/enable"
          after=$(gh api "repos/$REPO/actions/workflows/refresh-sbom.yml" --jq '.state')
          echo "state after: $after"
          [ "$after" = "active" ] || { echo "::error::Workflow is $after, expected active."; exit 1; }
